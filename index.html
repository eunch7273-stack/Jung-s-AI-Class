<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외무직 시험대비 국제정치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2ff;--ink:#1b1d3a;--sub:#6b6f94;--card:#fff;--line:#e3e5fb;--pri:#5b5bf0;--pri2:#8a5cff;--yel:#ffc53d;--mint:#14b8a0;--mintbg:#dcf7f1;--coral:#ff5c7a;--coralbg:#ffe4e9;--hl:#eef0ff;--prof:#fff7dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;font-size:16px}
.hidden{display:none!important}
.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.3px}
button{font:inherit;color:inherit}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;background:var(--hl);color:var(--pri);cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(91,91,240,.28)}
.btn.yel{background:var(--yel);color:#4a3600}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.note{font-size:13px;color:var(--sub)}
.err{color:var(--coral);font-size:14px;white-space:pre-wrap}
.ok{color:var(--mint)}
input[type=text],select,textarea{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 5px}

/* student shell */
#student{max-width:560px;margin:0 auto;padding-bottom:96px;min-height:100vh}
.hero{background:linear-gradient(135deg,#4a4de7,#8a5cff 60%,#ff7ab6);color:#fff;padding:26px 20px 70px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .kick{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.5px}
.univ{display:inline-block;margin:7px 0 2px;padding:3px 13px;border-radius:999px;background:rgba(255,255,255,.22);font-size:12.5px;font-weight:700;letter-spacing:.6px}
.univ.dark{background:var(--hl);color:var(--pri);margin:8px 0 4px}
.hero h1{font-size:30px;line-height:1.15;margin:4px 0 10px}
.hero .hi{font-size:15px;opacity:.95}
.lv{display:flex;align-items:center;gap:10px;margin-top:14px}
.lv .badge{background:var(--yel);color:#4a3600;font-weight:900;border-radius:999px;padding:2px 12px;font-size:13px;white-space:nowrap}
.xpbar{flex:1;height:10px;background:rgba(255,255,255,.28);border-radius:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .4s}
.pull{margin:-48px 14px 0;position:relative}
.body{padding:0 14px}
.sec{font-size:17px;margin:20px 2px 10px;font-weight:900}
.mission{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:0;border-radius:18px;padding:16px 14px;text-align:left;cursor:pointer;color:#fff;font-weight:900;font-size:16px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile span{font-weight:500;font-size:12px;opacity:.9}
.tile .e{font-size:26px}
.t1{background:linear-gradient(135deg,#5b5bf0,#7a7aff)}.t2{background:linear-gradient(135deg,#ff8a5c,#ff5c7a)}.t3{background:linear-gradient(135deg,#14b8a0,#38d9b9)}.t4{background:linear-gradient(135deg,#f5a623,#ffc53d);color:#3f2d00}
.catrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.catrow:first-child{border-top:0}
.catrow .ic{width:42px;height:42px;border-radius:14px;background:var(--hl);display:grid;place-items:center;font-size:22px;flex:none}
.catrow .mid{flex:1;min-width:0}.catrow .mid b{display:block;line-height:1.3}
.mini{height:8px;border-radius:6px;background:var(--hl);overflow:hidden;margin-top:6px}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;background:var(--hl);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{display:flex;max-width:560px;width:100%}
.nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;font-weight:700;color:var(--sub);cursor:pointer}
.nav button em{display:block;font-style:normal;font-size:22px;line-height:1.2}
.nav button.on{color:var(--pri)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat3 div{background:var(--hl);border-radius:14px;padding:12px 4px}.stat3 b{display:block;font-size:22px;font-family:"Black Han Sans";font-weight:400}.stat3 span{font-size:12px;color:var(--sub)}
.wrongit{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.wrongit:first-child{border-top:0}
.wrongit .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.pill{background:var(--hl);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:26px 0}

/* quiz */
.qtop{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;z-index:10}
.qtop .bar{height:10px;background:#dfe1fb;border-radius:8px;overflow:hidden;margin-top:8px}
.qtop .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:8px;transition:width .3s}
.qcard{margin:6px 14px 14px;background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 2px 0 var(--line)}
.stmts{margin-top:12px;padding:12px 14px;border:2px solid var(--line,#d9d3c7);border-radius:14px;background:rgba(255,255,255,.6);font-size:15px;font-weight:500;line-height:1.75}
.qtext{font-size:18px;font-weight:700;line-height:1.6;margin:8px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font-size:16px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:transform .08s,border-color .15s}
.opt:active:not([disabled]){transform:scale(.98)}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hl);color:var(--pri);display:grid;place-items:center;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--hl)}.opt.sel .n{background:var(--pri);color:#fff}
.opt.right{border-color:var(--mint);background:var(--mintbg);animation:pop .35s}.opt.right .n{background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--coral);background:var(--coralbg);animation:shake .35s}.opt.wrong .n{background:var(--coral);color:#fff}
.opt[disabled]{cursor:default}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.banner{border-radius:16px;padding:12px 14px;font-weight:900;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.banner.ok{background:var(--mintbg);color:#0b7e6c}.banner.bad{background:var(--coralbg);color:#c2234a}
.base{background:var(--hl);border-radius:14px;padding:12px 14px;font-size:15px;margin-bottom:12px}
.base b{display:block;font-size:12px;color:var(--sub)}
.prof{background:var(--prof);border-radius:18px;padding:14px}
.prof-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ava{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 2px 0 #f2e2a6}
.prof-h b{display:block;line-height:1.2}.prof-h span{font-size:12px;color:var(--sub)}
.msg{margin:8px 0;font-size:15.5px}
.msg.u{background:#fff;border-radius:14px;padding:8px 12px;margin-left:30px}
.msg p{margin:0 0 7px}.msg ul{margin:0 0 7px;padding-left:20px}
.cur::after{content:"▍";opacity:.5;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.ask{display:flex;gap:8px;margin-top:8px}.ask input{flex:1}
.abar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.abar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.abar .in .btn.pri{flex:1}
.score{font-size:58px;line-height:1.1}

/* login */
.login{max-width:420px;margin:0 auto;padding:60px 22px}
.login .hero2{text-align:center;margin-bottom:22px}
.login h1{font-size:32px;line-height:1.15;margin:4px 0;background:linear-gradient(135deg,var(--pri),#ff7ab6);-webkit-background-clip:text;background-clip:text;color:transparent}

/* professor */
#pro{max-width:1040px;margin:0 auto;padding:16px 16px 60px}
.ptop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ptop h1{font-size:24px;margin:0}
.ptabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.ptabs button{border:0;background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--sub)}
.ptabs button.on{background:var(--pri);color:#fff}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:18px;padding:16px}.kpi b{display:block;font-family:"Black Han Sans";font-weight:400;font-size:30px;line-height:1.2}.kpi span{font-size:13px;color:var(--sub)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.tw{overflow-x:auto}
.qi{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.qi:first-child{border-top:0}.qi .tx{flex:1;min-width:0}.qi .tx div{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bars .b{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.bars .nm{width:120px;flex:none}.bars .v{width:76px;text-align:right;color:var(--sub);flex:none}
.bars .b .mini{flex:1;margin:0}
.qrbox{background:#fff;border-radius:20px;padding:16px;width:260px;margin:0 auto}
.qrbox svg{width:100%;height:auto;display:block}
.warn{background:#fff3d6;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px}
dialog{border:0;border-radius:22px;padding:20px;max-width:640px;width:calc(100% - 24px);background:#fff;color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(20,20,60,.5)}
.cho{display:flex;gap:8px;margin-bottom:8px;align-items:center}.cho span{width:22px;font-weight:900;color:var(--pri)}
@media(max-width:520px){.bars .nm{width:84px}.hero h1{font-size:27px}}
</style>
</head>
<body>

<!-- ============ 학생 ============ -->
<div id="student">
  <!-- 로그인(이름 입력) -->
  <section id="vOnboard" class="hidden">
    <div class="login">
      <div class="hero2">
        <div style="font-size:54px">🎓</div>
        <div class="note" style="font-weight:700">AI 교수와 함께하는 문제은행</div>
        <div class="univ dark">동아대학교 정치외교학전공</div>
        <h1 class="disp">외무직 시험대비<br>국제정치</h1>
      </div>
      <div class="card">
        <label class="f" style="margin-top:0">이름</label>
        <input type="text" id="obName" maxlength="20" placeholder="예) 김외교" autocomplete="off">
        <button class="btn pri block" id="obGo" style="margin-top:18px">공부 시작하기 🚀</button>
      </div>
    </div>
  </section>

  <!-- 메인(탭) -->
  <section id="vMain" class="hidden">
    <div id="tabBody"></div>
  </section>

  <!-- 문제 풀이 -->
  <section id="vQuiz" class="hidden">
    <div class="qtop">
      <div class="row"><button class="btn sm ghost" data-act="quit">✕ 나가기</button><span class="sp"></span><b id="qpos"></b></div>
      <div class="bar"><i id="progBar" style="width:0"></i></div>
    </div>
    <div class="qcard">
      <div class="row" id="qmeta"></div>
      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
    </div>
    <div class="body hidden" id="fb">
      <div class="banner" id="banner"></div>
      <div class="base" id="base"></div>
      <div class="prof">
        <div class="prof-h"><div class="ava">🧑‍🏫</div><div><b>AI 교수님</b><span>문제 풀이 해설</span></div><span class="sp"></span><button class="btn sm ghost hidden" id="speak">🔊 읽어주기</button></div>
        <div id="chat"></div>
        <div id="explainRow"><button class="btn pri block" id="explain">🧑‍🏫 교수님께 해설 듣기</button></div>
      </div>
    </div>
    <div style="height:110px"></div>
    <div class="abar"><div class="in">
      <button class="btn ghost" id="star" title="북마크">☆</button>
      <button class="btn ghost" id="prev">←</button>
      <button class="btn pri" id="mainBtn">정답 확인</button>
    </div></div>
  </section>

  <!-- 결과 -->
  <section id="vResult" class="hidden">
    <div class="hero" style="padding-bottom:34px;text-align:center">
      <div class="kick">RESULT</div>
      <div class="score disp" id="scoreBig"></div>
      <div id="scoreSub" style="font-weight:700"></div>
      <div id="xpGain" style="margin-top:6px"></div>
    </div>
    <div class="body" style="margin-top:14px">
      <div class="card"><b>영역별 정답률</b><div class="bars" id="catBars" style="margin-top:6px"></div></div>
      <div class="card"><b>문항별 결과</b> <span class="note">눌러서 해설 보기</span><div id="resList" style="margin-top:6px"></div></div>
      <div class="row">
        <button class="btn pri sp" id="retryWrong">틀린 문제 다시 풀기</button>
        <button class="btn ghost" data-act="home">홈으로</button>
      </div>
    </div>
  </section>

  <nav class="nav hidden" id="nav"><div class="in" id="navIn"></div></nav>
</div>

<script>
"use strict";
/* ===== 설정 ===== */
// 구글 Apps Script 웹 앱 URL을 아래 따옴표 안에 붙여 넣으면 학생 성적이 시트에 쌓입니다. 비워 두면 기록을 보내지 않습니다.
const SHEET_URL="";
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dayKey=(t=Date.now())=>{const d=new Date(t+9*3600e3);return d.toISOString().slice(0,10)};
const pct=(c,t)=>t?Math.round(c/t*100):0;
function md(s){
  const lines=esc(s).split("\n");let out="",inList=false;
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  for(const raw of lines){const l=raw.trim();const m=l.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
    if(m){if(!inList){out+="<ul>";inList=true}out+="<li>"+inl(m[1])+"</li>"}
    else{if(inList){out+="</ul>";inList=false}const h=l.match(/^#{1,4}\s+(.*)$/);if(h)out+="<p><b>"+inl(h[1])+"</b></p>";else if(l)out+="<p>"+inl(l)+"</p>"}}
  if(inList)out+="</ul>";return out;
}
const ICONS={"국제정치이론": "🧠", "국제안보·군비통제": "🛡️", "외교정책결정론": "🧭", "국제정치경제": "💱", "국제기구·국제법": "⚖️", "국제정치사": "📜", "주요국 대외정책": "🏛️", "한반도·통일·북한": "🗺️", "중동·유럽·분쟁 지역": "🌍", "초국가·신안보": "🌐"};
const icon=c=>ICONS[c]||"📘";

/* ===== 예시 문제 (게시된 문제가 없을 때만 사용) ===== */
const SAMPLE_BANK=[{"id": "q001", "category": "국제정치이론", "difficulty": "하", "question": "한스 모겐소(Hans Morgenthau)의 고전적 현실주의에 대한 설명으로 옳은 것은?", "choices": ["정치적 현실주의는 권력으로 정의되는 이익 개념을 국제정치를 이해하는 핵심 길잡이로 삼는다", "인간 본성은 선하나 제도의 결함 때문에 국가 간 갈등이 발생한다고 본다", "국제체제의 구조가 국가 행동을 결정하므로 인간 본성은 설명변수에서 제외한다", "국가 이익은 시대와 장소를 초월하는 보편적 도덕 원칙에 의해 규정된다고 본다"], "answer": 1, "explanation": "모겐소는 『국가 간의 정치』에서 국가 행동을 '권력으로 정의된 이익'으로 설명하는 합리적 틀을 제시했어요.", "prof": "정답은 1번이에요. 모겐소는 『국가 간의 정치』에서 국가 행동을 '권력으로 정의된 이익'으로 설명하는 합리적 틀을 제시했어요. 인간 본성이 선하다는 관점은 자유주의에 가깝고, 구조가 행동을 결정한다고 보며 인간 본성을 배제하는 것은 왈츠의 신현실주의예요. 모겐소는 오히려 국가의 행동에 보편적 도덕 원칙을 그대로 적용할 수 없다고 봤어요."}, {"id": "q002", "category": "국제정치이론", "difficulty": "중", "question": "케네스 왈츠(Kenneth Waltz)의 신현실주의에 대한 설명으로 옳지 않은 것은?", "choices": ["양극체제는 계산 착오의 가능성이 낮아 다극체제보다 안정적이라고 본다", "국제체제의 무정부 상태에서도 국가들은 기능이 분화되어 서로 다른 역할을 수행한다고 본다", "국가는 구조의 제약 속에서 경쟁과 사회화를 통해 유사한 행동을 하게 된다고 본다", "국제체제의 구조는 질서원리, 단위의 기능, 능력의 분포로 규정된다고 본다"], "answer": 2, "explanation": "왈츠는 무정부 상태에서는 위계적 분업이 없으므로 단위들이 비슷한 기능을 수행하는 '유사 단위(like units)'라고 봤어요.", "prof": "정답은 2번이에요. 왈츠는 무정부 상태에서는 위계적 분업이 없으므로 단위들이 비슷한 기능을 수행하는 '유사 단위(like units)'라고 봤어요. 따라서 기능 분화를 말하는 서술이 틀렸고, 국가 간 차이는 기능이 아니라 능력의 분포에서 생겨요. 나머지는 모두 『국제정치이론』의 핵심 주장과 일치해요."}, {"id": "q003", "category": "국제정치이론", "difficulty": "상", "question": "존 미어샤이머(John Mearsheimer)의 공격적 현실주의에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 강대국은 생존을 극대화하는 최선의 방법으로 권력을 극대화하여 지역패권을 추구한다\nㄴ. 미국과 같은 역외 강대국은 타 지역의 패권국 출현을 막기 위해 역외균형 전략을 쓸 수 있다고 본다\nㄷ. 국가는 적정한 수준의 권력에 만족하며 현상유지를 추구하는 경향이 강하다\nㄹ. 『강대국 국제정치의 비극』에서 핵심 논지를 전개하였다", "choices": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄴ, ㄹ"], "answer": 1, "explanation": "ㄱ은 공격적 현실주의의 핵심이에요.", "prof": "정답은 1번이에요. ㄱ은 공격적 현실주의의 핵심이에요. 미어샤이머는 안보를 위해 권력 극대화, 곧 지역패권을 추구한다고 봤어요. ㄴ 역외균형은 미국이 지역 패권국의 등장을 억제할 때 쓰는 전략으로 그가 강조했고, ㄹ은 2001년 저서예요. ㄷ은 적정 수준에서 멈추는 방어적 현실주의의 논리라 틀렸어요."}, {"id": "q004", "category": "국제정치이론", "difficulty": "중", "question": "스티븐 월트(Stephen Walt)의 위협균형론에 대한 설명으로 옳은 것은?", "choices": ["편승보다 균형이 드물며 약소국은 위협에 대해 대부분 편승을 선택한다", "동맹 형성은 능력의 분포만으로 설명되며 위협 인식은 고려할 필요가 없다", "국가는 힘의 분포뿐 아니라 지리적 근접성, 공격 능력, 공격 의도를 함께 보고 가장 위협적인 국가에 맞서 균형을 형성한다", "위협의 구성요소로는 경제적 상호의존, 이념적 동질성, 군사동맹 가입 여부를 든다"], "answer": 3, "explanation": "월트는 『동맹의 기원』에서 국가가 가장 강한 국가가 아니라 가장 위협적인 국가에 균형을 맞춘다고 했어요.", "prof": "정답은 3번이에요. 월트는 『동맹의 기원』에서 국가가 가장 강한 국가가 아니라 가장 위협적인 국가에 균형을 맞춘다고 했어요. 위협의 요소는 총체적 능력, 지리적 근접성, 공격 능력, 공격 의도이고 경제적 상호의존이나 이념은 요소가 아니에요. 또한 월트는 편승보다 균형이 더 일반적이라고 봤어요."}, {"id": "q005", "category": "국제정치이론", "difficulty": "중", "question": "로버트 키헤인(Robert Keohane)과 조지프 나이(Joseph Nye)의 복합적 상호의존론에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 국가 간 사회를 연결하는 정부 간 채널 외에도 초정부 및 초국가 채널이 존재한다\nㄴ. 이슈 간 위계가 뚜렷하여 군사안보가 항상 가장 중요한 의제로 설정된다\nㄷ. 상호의존이 심화된 관계에서는 군사력이 정책 수단으로 사용되는 정도가 줄어든다\nㄹ. 취약성은 정책을 바꾼 뒤에도 외부 충격이 초래하는 비용, 곧 대안의 이용 가능성과 비용을 반영하는 개념이다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ"], "answer": 3, "explanation": "복합적 상호의존은 다중 채널, 이슈 간 위계의 부재, 군사력 역할의 감소라는 세 특징을 가져요.", "prof": "정답은 3번이에요. 복합적 상호의존은 다중 채널, 이슈 간 위계의 부재, 군사력 역할의 감소라는 세 특징을 가져요. 그래서 ㄴ은 반대 서술이에요. 또 민감성은 정책 변화 이전의 영향 정도이고, 취약성은 대안을 찾는 비용까지 고려한 개념이라 ㄹ은 옳아요."}, {"id": "q006", "category": "국제정치이론", "difficulty": "중", "question": "패권안정론에 대한 설명으로 옳은 것은?", "choices": ["군사적 공공재만 중요하며 통화나 무역 질서와 같은 경제적 공공재는 논의에서 제외한다", "패권국은 공공재 제공 비용을 부담하지 않으며 다른 국가들이 비용을 분담한다고 본다", "패권국이 쇠퇴해도 국제레짐은 자율성을 가지고 지속되므로 질서가 곧바로 붕괴되지는 않는다고 주장한다", "개방적인 국제경제질서는 압도적 경제력을 가진 패권국이 공공재를 제공할 때 안정적으로 유지된다고 본다"], "answer": 4, "explanation": "킨들버거 등이 제시한 패권안정론은 대공황이 길어진 원인을 공공재를 제공할 국가의 부재에서 찾았어요.", "prof": "정답은 4번이에요. 킨들버거 등이 제시한 패권안정론은 대공황이 길어진 원인을 공공재를 제공할 국가의 부재에서 찾았어요. 패권국이 쇠퇴해도 레짐이 지속될 수 있다는 주장은 키헤인의 『패권 이후』의 논점이라 패권안정론과 구별돼요. 패권국은 비용을 부담하고 다른 국가는 무임승차하는 문제가 있다는 점도 중요해요."}, {"id": "q007", "category": "국제정치이론", "difficulty": "상", "question": "오르간스키(A. F. K. Organski)의 세력전이이론에 대한 설명으로 옳은 것은?", "choices": ["도전국의 만족 여부는 전쟁 발생 여부와 무관하다고 본다", "국제체제를 위계가 없는 무정부 상태로 규정하고 단일 지배국의 존재를 부정한다", "국력이 균형을 이루는 상태에서 전쟁 가능성이 가장 낮아진다고 본다", "현존 질서에 불만을 가진 도전국의 국력이 지배국에 근접하거나 추월할 때 전쟁 가능성이 높아진다고 본다"], "answer": 4, "explanation": "세력전이론은 국제체제를 지배국을 정점으로 하는 위계로 보고, 도전국이 현상에 불만을 가진 채 국력을 따라잡을 때 전쟁 위험이 커진다고 해요.", "prof": "정답은 4번이에요. 세력전이론은 국제체제를 지배국을 정점으로 하는 위계로 보고, 도전국이 현상에 불만을 가진 채 국력을 따라잡을 때 전쟁 위험이 커진다고 해요. 세력균형론과 달리 균형 상태가 평화를 보장한다고 보지 않으며, 도전국의 불만족 여부가 핵심 변수예요."}, {"id": "q008", "category": "국제정치이론", "difficulty": "상", "question": "이매뉴얼 월러스틴(Immanuel Wallerstein)의 세계체제론에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 세계체제는 중핵, 반주변, 주변으로 이루어진 분업 구조를 가진다\nㄴ. 근대 세계경제는 하나의 정치적 제국이 지배하는 세계제국으로 발전해 왔다고 본다\nㄷ. 반주변부는 중핵과 주변부 사이에서 체제의 안정을 돕는 완충 역할을 한다\nㄹ. 분석 단위를 개별 국민국가로 보고 국가 간의 관계를 중심으로 설명한다", "choices": ["ㄱ, ㄹ", "ㄴ", "ㄴ, ㄹ", "ㄹ"], "answer": 3, "explanation": "세계체제론은 근대 세계경제를 하나의 제국이 아닌 여러 국가로 구성된 자본주의 세계경제로 봐요.", "prof": "정답은 3번이에요. 세계체제론은 근대 세계경제를 하나의 제국이 아닌 여러 국가로 구성된 자본주의 세계경제로 봐요. 그래서 ㄴ이 틀렸어요. 또 분석 단위는 개별 국가가 아니라 세계체제 전체이므로 ㄹ도 틀려요. ㄱ과 ㄷ은 맞는 서술이에요."}, {"id": "q009", "category": "국제정치이론", "difficulty": "중", "question": "영국학파(English School)에 대한 설명으로 옳은 것은?", "choices": ["국제체제는 국가 간의 힘의 관계만으로 구성되며 규범이나 제도는 영향을 주지 못한다고 본다", "헤들리 불은 무정부 상태에서도 국가들이 공동의 이익과 규칙을 인식하는 국제사회가 존재한다고 보았다", "계량적 실증 방법을 중시하며 역사와 규범적 해석을 배제한다", "국제사회는 세계정부가 수립될 때 비로소 완성된다고 본다"], "answer": 2, "explanation": "헤들리 불은 『무정부 사회』에서 국가들이 공통 규칙과 제도를 공유하는 국제사회가 있다고 봤어요.", "prof": "정답은 2번이에요. 헤들리 불은 『무정부 사회』에서 국가들이 공통 규칙과 제도를 공유하는 국제사회가 있다고 봤어요. 영국학파는 힘만으로 설명하는 접근도, 세계정부를 전제로 하는 접근도 아니며, 역사와 규범을 해석하는 방법을 중시한다는 점이 행태주의와 달라요."}, {"id": "q010", "category": "국제정치이론", "difficulty": "중", "question": "알렉산더 웬트(Alexander Wendt)의 구성주의에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 국제체제의 구조는 물질적 능력의 분포뿐 아니라 관념의 분포에 의해서도 규정된다\nㄴ. 무정부 문화는 홉스적, 로크적, 칸트적 문화로 구분될 수 있다\nㄷ. 국가의 정체성과 이익은 국가 간 상호작용 과정에서 사회적으로 구성된다\nㄹ. 국가의 이익은 체제와 무관하게 국내 정치에 의해서만 결정되어 외생적으로 주어진다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "웬트는 구조를 물질적 요소뿐 아니라 공유된 관념으로 보고, 정체성과 이익이 상호작용 속에서 만들어진다고 했어요.", "prof": "정답은 3번이에요. 웬트는 구조를 물질적 요소뿐 아니라 공유된 관념으로 보고, 정체성과 이익이 상호작용 속에서 만들어진다고 했어요. 무정부 문화를 적, 경쟁자, 친구 관계로 나눈 것이 홉스적, 로크적, 칸트적 문화예요. 이익이 외생적으로 주어진다는 서술은 합리주의 가정이라 ㄹ만 틀려요."}, {"id": "q011", "category": "국제정치이론", "difficulty": "중", "question": "로버트 콕스(Robert Cox)의 비판이론에 대한 설명으로 옳은 것은?", "choices": ["문제해결이론은 기존 질서를 주어진 것으로 받아들여 유지에 기여하고, 비판이론은 질서의 기원과 변화 가능성을 묻는다고 구분한다", "이론은 가치중립적이어서 누구를 위한 것인지는 이론의 성격과 무관하다고 본다", "그람시의 헤게모니 개념을 부정하며 물질적 능력만으로 국제질서를 설명한다", "문제해결이론과 비판이론은 방법론과 목적이 동일한 접근이라고 본다"], "answer": 1, "explanation": "콕스는 이론이 언제나 누군가를 위해, 어떤 목적으로 쓰인다고 보고 문제해결이론과 비판이론을 구분했어요.", "prof": "정답은 1번이에요. 콕스는 이론이 언제나 누군가를 위해, 어떤 목적으로 쓰인다고 보고 문제해결이론과 비판이론을 구분했어요. 그람시의 헤게모니 개념을 적극 활용했다는 점도 기억해 두세요."}, {"id": "q012", "category": "국제정치이론", "difficulty": "상", "question": "코펜하겐학파의 안보화(securitization) 이론에 대한 설명으로 옳은 것은?", "choices": ["지역안보복합체 개념은 안보화 이론과 무관한 독립 이론이다", "행위자가 특정 이슈를 실존적 위협으로 담론적으로 구성하고 청중이 이를 수용할 때 비상조치가 정당화된다", "안보 영역을 군사 부문으로 한정하며 경제와 환경 부문은 안보 논의에서 제외한다", "안보는 객관적 위협의 존재 여부로만 규정되며 담론의 영향은 없다고 본다"], "answer": 2, "explanation": "부잔과 웨버 등은 안보를 객관적 상태가 아닌 발화 행위와 청중의 수용으로 구성되는 과정으로 봐요.", "prof": "정답은 2번이에요. 부잔과 웨버 등은 안보를 객관적 상태가 아닌 발화 행위와 청중의 수용으로 구성되는 과정으로 봐요. 안보 영역도 군사, 정치, 경제, 사회, 환경 등으로 확장하고, 지역안보복합체 이론도 같은 학파의 분석틀이라 나머지는 틀려요."}, {"id": "q013", "category": "국제정치이론", "difficulty": "상", "question": "민주평화론에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 마이클 도일은 칸트의 영구평화론을 재해석하여 자유주의 국가들 사이에는 전쟁이 거의 일어나지 않는다고 보았다\nㄴ. 민주주의 국가는 민주주의 국가뿐 아니라 비민주주의 국가에 대해서도 전쟁을 하지 않는 경향이 있다\nㄷ. 제도적 설명은 권력분립과 여론의 견제를, 규범적 설명은 타협과 비폭력 분쟁 해결의 규범을 강조한다\nㄹ. 맨스필드와 스나이더는 민주화 과도기에 있는 국가가 오히려 전쟁에 개입할 가능성이 높다고 주장하였다", "choices": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 3, "explanation": "민주평화론의 핵심은 민주국가 '사이'의 평화예요.", "prof": "정답은 3번이에요. 민주평화론의 핵심은 민주국가 '사이'의 평화예요. 민주국가가 비민주국가와는 전쟁을 하는 경향이 있으므로 ㄴ은 틀렸어요. ㄷ은 제도적, 규범적 설명을 맞게 요약했고, ㄹ의 맨스필드와 스나이더는 민주화 과정의 위험을 지적한 학자들이에요."}, {"id": "q014", "category": "국제정치이론", "difficulty": "중", "question": "로버트 키헤인(Robert Keohane)의 신자유제도주의에 대한 설명으로 옳은 것은?", "choices": ["협력의 가장 큰 장애는 상대적 이득에 대한 우려라고 주장한다", "국제레짐은 국가의 이익 계산과 무관하게 독립적으로 규범을 강제하는 초국가적 권위를 가진다", "국가를 합리적 이기주의자로 가정하는 것을 부정하고 비합리적 행위자로 본다", "국제레짐은 거래비용을 줄이고 정보를 제공하며 반복 게임의 미래 그림자를 키워 협력을 촉진한다"], "answer": 4, "explanation": "키헤인은 국가를 합리적 이기주의자로 가정하면서도 레짐이 거래비용과 정보 문제를 줄여 협력을 돕는다고 했어요.", "prof": "정답은 4번이에요. 키헤인은 국가를 합리적 이기주의자로 가정하면서도 레짐이 거래비용과 정보 문제를 줄여 협력을 돕는다고 했어요. 상대적 이득 우려는 그리코 등 신현실주의자의 논점이고, 레짐은 초국가적 강제력이 있는 것이 아니에요."}, {"id": "q015", "category": "국제정치이론", "difficulty": "상", "question": "방어적 현실주의에 대한 설명으로 옳은 것은?", "choices": ["국가는 안보를 위해 적정한 수준의 권력을 추구하며 과도한 팽창은 반대 균형을 불러 오히려 안보를 해친다고 본다", "국가는 언제나 권력을 극대화하려 하며 패권 달성이 이상적 목표라고 본다", "공격이 방어보다 유리하다고 인식될수록 국가 간 협력이 쉬워진다고 본다", "대표적 학자는 미어샤이머이다"], "answer": 1, "explanation": "방어적 현실주의는 국가가 안보를 극대화하되 지나친 팽창은 균형 형성으로 이어져 역효과라고 봐요.", "prof": "정답은 1번이에요. 방어적 현실주의는 국가가 안보를 극대화하되 지나친 팽창은 균형 형성으로 이어져 역효과라고 봐요. 공격이 유리하다고 인식되면 선제공격 유인이 커져 협력이 어려워지고, 권력 극대화는 공격적 현실주의의 논리이며 미어샤이머는 공격적 현실주의자예요."}, {"id": "q016", "category": "국제정치이론", "difficulty": "중", "question": "로버트 저비스(Robert Jervis)의 안보딜레마 논의에 대한 설명으로 옳은 것은?", "choices": ["안보딜레마는 국가가 침략적 의도를 가질 때만 발생한다", "안보딜레마는 무정부 상태가 아닌 위계 체제에서 주로 발생한다", "공격이 유리하고 무기의 공방 구분이 불가능할수록 안보딜레마는 완화된다", "방어가 공격보다 유리하고 공격 무기와 방어 무기를 구별할 수 있으면 안보딜레마가 완화된다"], "answer": 4, "explanation": "저비스는 방어 우위와 공방 구별 가능성이 안보딜레마를 좌우한다고 했어요.", "prof": "정답은 4번이에요. 저비스는 방어 우위와 공방 구별 가능성이 안보딜레마를 좌우한다고 했어요. 안보딜레마는 방어적 의도에서도 발생하며 무정부성과 불확실성에서 비롯돼요."}, {"id": "q017", "category": "국제정치이론", "difficulty": "중", "question": "국제정치학의 이론 논쟁에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 제2차 논쟁은 헤들리 불로 대표되는 전통주의와 모턴 카플란으로 대표되는 과학주의 사이에서 전개되었다\nㄴ. 제1차 논쟁은 1990년대 냉전 종식 이후 현실주의와 자유주의 사이에서 전개되었다\nㄷ. 키헤인은 1988년 국제제도 연구를 합리주의적 접근과 성찰주의적 접근으로 구분하였다\nㄹ. 이상주의와 현실주의의 논쟁에서 E. H. 카는 『20년의 위기』를 통해 이상주의를 비판하였다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄷ, ㄹ"], "answer": 3, "explanation": "제1차 논쟁은 1930~40년대 이상주의와 현실주의 사이의 논쟁이라 ㄴ이 틀렸어요.", "prof": "정답은 3번이에요. 제1차 논쟁은 1930~40년대 이상주의와 현실주의 사이의 논쟁이라 ㄴ이 틀렸어요. ㄱ은 방법론 논쟁이며 ㄷ은 키헤인의 1988년 논문, ㄹ은 카의 대표 저서에 대한 정확한 서술이에요."}, {"id": "q018", "category": "국제정치이론", "difficulty": "중", "question": "레짐(regime)에 대한 크래스너(Stephen Krasner)의 정의로 가장 적절한 것은?", "choices": ["강제력을 독점한 세계정부가 수립하는 규칙 체계이다", "특정 이슈 영역에서 행위자들의 기대가 수렴되는 원칙, 규범, 규칙, 의사결정 절차의 총체이다", "국제기구와 동일한 개념으로 상설 사무국을 갖춘 공식 조직을 가리킨다", "반드시 명시적 조약에 의해서만 성립하는 법적 구속력을 가진 규범 체계이다"], "answer": 2, "explanation": "크래스너는 국제레짐을 이슈 영역별로 행위자의 기대가 수렴되는 원칙, 규범, 규칙, 절차의 집합으로 정의했어요.", "prof": "정답은 2번이에요. 크래스너는 국제레짐을 이슈 영역별로 행위자의 기대가 수렴되는 원칙, 규범, 규칙, 절차의 집합으로 정의했어요. 레짐은 공식 기구나 조약이 없어도 존재할 수 있어서 국제기구와 동일하지 않아요."}, {"id": "q019", "category": "국제정치이론", "difficulty": "상", "question": "로버트 액설로드(Robert Axelrod)의 협력 연구에 대한 설명으로 옳은 것은?", "choices": ["반복되는 죄수의 딜레마에서 상대의 직전 행동을 따라 하는 팃포탯 전략은 미래의 그림자가 길 때 협력을 유도하기 쉽다", "참여자 수가 늘수록 감시와 제재가 쉬워져 협력이 더 쉬워진다", "일회성 게임에서도 협력은 지배 전략이므로 항상 균형에서 나타난다", "상대적 이득에 대한 관심이 높을수록 협력은 더 쉬워진다"], "answer": 1, "explanation": "액설로드는 반복 게임에서 미래의 가치가 클수록 협력이 유지되기 쉽다고 했어요.", "prof": "정답은 1번이에요. 액설로드는 반복 게임에서 미래의 가치가 클수록 협력이 유지되기 쉽다고 했어요. 일회성 게임에서는 배신이 지배 전략이고, 참여자가 늘면 감시가 어려워져 협력이 힘들며, 상대적 이득 우려는 협력을 가로막는 요인이에요."}, {"id": "q020", "category": "국제정치이론", "difficulty": "상", "question": "세력균형과 균형 개념에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 세력균형 정책의 목적은 어느 한 국가가 지배적 지위에 올라서지 못하도록 막는 데 있다\nㄴ. 헨리 키신저는 『회복된 세계』에서 19세기 빈 체제를 분석하였다\nㄷ. 왈츠는 세력균형이 국가들의 의도적 정책과 무관하게 체제 구조의 작동 결과로 나타날 수 있다고 보았다\nㄹ. 내적 균형(internal balancing)은 동맹 형성을 통해 상대에 대응하는 방식이다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "ㄱ, ㄴ, ㄷ은 올바른 서술이에요.", "prof": "정답은 1번이에요. ㄱ, ㄴ, ㄷ은 올바른 서술이에요. 왈츠는 균형이 구조의 결과로 형성될 수 있다고 했어요. 내적 균형은 자국의 군비와 경제력 강화를 뜻하고, 동맹을 통한 균형은 외적 균형이라 ㄹ이 틀려요."}, {"id": "q021", "category": "국제정치이론", "difficulty": "하", "question": "이상주의(윌슨주의)에 대한 설명으로 옳은 것은?", "choices": ["국제정치는 권력투쟁의 장이므로 국제기구는 의미가 없다고 보았다", "국제연맹과 집단안보를 통해 국가 간 평화를 제도적으로 구축할 수 있다고 보았다", "세력균형만이 평화를 유지하는 유일한 방법이라고 보았다", "국가 이익은 군사력의 크기로만 결정된다고 보았다"], "answer": 2, "explanation": "윌슨의 이상주의는 14개조 평화원칙과 국제연맹, 집단안보를 통한 평화를 지향했어요.", "prof": "정답은 2번이에요. 윌슨의 이상주의는 14개조 평화원칙과 국제연맹, 집단안보를 통한 평화를 지향했어요. 힘의 정치만을 강조하는 접근은 현실주의의 관점이에요."}, {"id": "q022", "category": "국제정치이론", "difficulty": "중", "question": "지정학 이론에 대한 설명으로 옳은 것은?", "choices": ["스파이크먼은 심장지대를 장악한 국가가 곧 세계를 지배한다고 주장하였다", "마한은 육군력과 대륙 횡단 철도의 전략적 중요성을 강조하였다", "매킨더는 해군력 우위가 세계 지배의 필수 조건이라고 강조하였다", "스파이크먼은 유라시아의 주변부인 림랜드를 통제하는 것이 세계 패권의 열쇠라고 보았다"], "answer": 4, "explanation": "스파이크먼은 매킨더의 심장지대론을 수정해 림랜드 통제가 핵심이라고 했어요.", "prof": "정답은 4번이에요. 스파이크먼은 매킨더의 심장지대론을 수정해 림랜드 통제가 핵심이라고 했어요. 마한은 해양력, 매킨더는 심장지대를 장악한 대륙 세력의 우위를 강조했다는 점을 구분하세요."}, {"id": "q023", "category": "국제정치이론", "difficulty": "상", "question": "케네스 왈츠의 『인간, 국가, 전쟁』에서 제시된 전쟁 원인의 세 가지 이미지에 대한 설명으로 옳지 않은 것은?", "choices": ["제2이미지는 국가의 내부 구조와 정치체제에서 전쟁의 원인을 찾는다", "제3이미지는 국제체제의 무정부적 구조에서 전쟁의 원인을 찾는다", "제1이미지는 인간의 본성과 행동에서 전쟁의 원인을 찾는다", "제2이미지는 국제체제의 무정부적 구조를 전쟁의 근본 원인으로 본다"], "answer": 4, "explanation": "왈츠는 전쟁의 원인을 인간, 국가, 국제체제의 세 층위로 나눴어요.", "prof": "정답은 4번이에요. 왈츠는 전쟁의 원인을 인간, 국가, 국제체제의 세 층위로 나눴어요. 무정부적 구조에서 원인을 찾는 것은 제3이미지이므로 제2이미지에 대한 서술이 틀렸어요."}, {"id": "q024", "category": "국제정치이론", "difficulty": "중", "question": "칼 도이치(Karl Deutsch)의 안보공동체 개념에 대한 설명으로 옳은 것은?", "choices": ["다원적 안보공동체는 구성원들이 하나의 정치체로 통합될 것을 전제한다", "구성원 간에 전쟁이 아닌 평화적 방법으로 분쟁이 해결되리라는 믿을 만한 기대가 형성된 공동체이다", "안보공동체는 군사동맹과 동일한 개념이다", "국가 간 교류와 소통은 안보공동체 형성에 영향을 주지 않는다고 본다"], "answer": 2, "explanation": "도이치는 평화적 변화에 대한 신뢰할 만한 기대를 안보공동체의 핵심으로 봤어요.", "prof": "정답은 2번이에요. 도이치는 평화적 변화에 대한 신뢰할 만한 기대를 안보공동체의 핵심으로 봤어요. 다원적 안보공동체는 구성원이 법적 독립을 유지하는 형태이고, 통합형은 하나의 정치체로 합쳐지는 형태예요."}, {"id": "q025", "category": "국제정치이론", "difficulty": "상", "question": "지역통합이론에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 기능주의는 기술적 협력이 확대되면서 정치적 통합으로 이어진다고 본다\nㄴ. 신기능주의의 대표 학자 에른스트 하스는 파급효과(spillover) 개념을 중시한다\nㄷ. 정부간주의는 초국가적 엘리트가 통합을 주도한다고 본다\nㄹ. 모라브칙의 자유주의적 정부간주의는 국가 선호가 국내 정치과정에서 형성된다고 본다", "choices": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "기능주의와 신기능주의는 협력이 다른 영역으로 확대된다고 보고, 하스가 파급효과를 강조했어요.", "prof": "정답은 1번이에요. 기능주의와 신기능주의는 협력이 다른 영역으로 확대된다고 보고, 하스가 파급효과를 강조했어요. 정부간주의는 통합의 주체를 초국가적 엘리트가 아닌 회원국 정부로 보므로 ㄷ이 틀려요. 모라브칙은 국내 선호 형성, 국가 간 협상, 제도 선택의 3단계로 설명해요."}, {"id": "q026", "category": "국제정치이론", "difficulty": "중", "question": "국제정치학자와 개념에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 존 허츠(John Herz)는 안보딜레마 개념을 제시하였다\nㄴ. 조지프 나이(Joseph Nye)는 소프트 파워 개념을 제시하였다\nㄷ. 새뮤얼 헌팅턴(Samuel Huntington)은 『역사의 종언』에서 자유민주주의의 최종적 승리를 주장하였다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 2, "explanation": "허츠는 1950년대 안보딜레마를 제시했고, 나이는 연성권력을 제시했어요.", "prof": "정답은 2번이에요. 허츠는 1950년대 안보딜레마를 제시했고, 나이는 연성권력을 제시했어요. 『역사의 종언』은 프랜시스 후쿠야마의 저서이고, 헌팅턴은 『문명의 충돌』로 알려져 있어요."}, {"id": "q027", "category": "국제정치이론", "difficulty": "중", "question": "노먼 에인절(Norman Angell)의 『거대한 환상』(1910)에 대한 설명으로 옳은 것은?", "choices": ["세력균형 정책이 국가 번영을 보장하는 유일한 길이라고 주장하였다", "국가 간 무역이 늘수록 갈등이 필연적으로 증가한다고 주장하였다", "군사적 정복이 경제적 번영을 얻는 가장 효율적인 수단이라고 주장하였다", "경제적 상호의존이 심화되어 전쟁은 승자에게도 경제적 이익이 되지 않는다고 주장하였다"], "answer": 4, "explanation": "에인절은 금융과 무역으로 얽힌 국가들 사이에서는 전쟁이 이득이 되지 않는다고 봤어요.", "prof": "정답은 4번이에요. 에인절은 금융과 무역으로 얽힌 국가들 사이에서는 전쟁이 이득이 되지 않는다고 봤어요. 이는 상업적 자유주의의 초기 논거로 자주 인용돼요."}, {"id": "q028", "category": "국제정치이론", "difficulty": "상", "question": "레닌(V. I. Lenin)의 제국주의론에 대한 설명으로 옳은 것은?", "choices": ["제국주의 전쟁은 자유무역이 확산되면 사라진다고 보았다", "제국주의를 자본주의의 초기 단계로 규정하였다", "독점자본주의가 해외 시장과 식민지를 둘러싼 선진 자본주의 국가 간 경쟁과 전쟁을 낳는다고 보았다", "카우츠키의 초제국주의론에 동의하여 자본주의 국가들의 연합이 평화를 가져온다고 보았다"], "answer": 3, "explanation": "레닌은 『제국주의, 자본주의의 최고 단계』에서 독점자본의 팽창이 식민지 분할 경쟁과 전쟁으로 이어진다고 봤어요.", "prof": "정답은 3번이에요. 레닌은 『제국주의, 자본주의의 최고 단계』에서 독점자본의 팽창이 식민지 분할 경쟁과 전쟁으로 이어진다고 봤어요. 제국주의는 최고 단계이지 초기 단계가 아니며, 카우츠키의 초제국주의론은 오히려 비판했어요."}, {"id": "q029", "category": "국제정치이론", "difficulty": "중", "question": "J. 데이비드 싱어(J. David Singer)의 분석수준 문제에 대한 설명으로 옳은 것은?", "choices": ["분석수준의 선택은 이론의 설명력과 무관하다고 보았다", "분석수준은 개인 수준 하나만 인정하며 체제 수준은 부정하였다", "국제정치 현상을 국제체제 수준과 국가 수준으로 구분하여 각 수준의 설명 강점과 한계를 논하였다", "체제 수준은 국가 간 차이를, 국가 수준은 체제의 구조적 제약을 강조한다고 보았다"], "answer": 3, "explanation": "싱어는 1961년 논문에서 국제체제와 국가라는 두 수준의 설명을 대비했어요.", "prof": "정답은 3번이에요. 싱어는 1961년 논문에서 국제체제와 국가라는 두 수준의 설명을 대비했어요. 체제 수준은 구조적 제약과 유사성을, 국가 수준은 국가 간 차이를 강조하므로 마지막 서술은 거꾸로 되어 있어요."}, {"id": "q030", "category": "국제정치이론", "difficulty": "하", "question": "국제정치학자와 이론적 입장에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 알렉산더 웬트(Alexander Wendt)는 구성주의를 대표하는 학자이다\nㄴ. 이매뉴얼 월러스틴(Immanuel Wallerstein)은 신현실주의를 대표하는 학자이다\nㄷ. 찰스 킨들버거(Charles Kindleberger)는 패권안정론과 관련이 깊다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 2, "explanation": "웬트는 구성주의, 킨들버거는 패권안정론과 관련된 학자예요.", "prof": "정답은 2번이에요. 웬트는 구성주의, 킨들버거는 패권안정론과 관련된 학자예요. 월러스틴은 세계체제론을 제시한 학자이고, 신현실주의를 대표하는 학자는 왈츠예요."}, {"id": "q031", "category": "국제안보·군비통제", "difficulty": "중", "question": "토머스 셸링(Thomas Schelling)의 억지(deterrence)와 강압(compellence) 구분에 대한 설명으로 옳은 것은?", "choices": ["억지는 상대가 특정 행동을 하지 못하도록 막는 것이고, 강압은 이미 한 행동을 되돌리거나 새로운 행동을 하도록 압박하는 것이다", "억지는 보상을 약속하는 것이고, 강압은 처벌을 약속하는 것이다", "억지와 강압은 모두 군사력의 실제 사용을 전제로 한다", "억지는 상대가 이미 한 행동을 되돌리도록 압박하는 것이고, 강압은 상대의 행동을 미리 막는 것이다"], "answer": 1, "explanation": "셸링은 『무기와 영향력』에서 억지는 현상 유지를 위해 행동을 막는 것, 강압은 상대에게 행동을 바꾸거나 새로 하도록 요구하는 것이라고 구분했어요.", "prof": "정답은 1번이에요. 셸링은 『무기와 영향력』에서 억지는 현상 유지를 위해 행동을 막는 것, 강압은 상대에게 행동을 바꾸거나 새로 하도록 요구하는 것이라고 구분했어요. 둘 다 군사력 사용 위협이 핵심이지만 실제 사용을 전제하지는 않으며, 보상과 처벌로 나누는 방식도 아니에요."}, {"id": "q032", "category": "국제안보·군비통제", "difficulty": "중", "question": "거부적 억지(deterrence by denial)와 보복적 억지(deterrence by punishment)에 대한 설명으로 옳은 것은?", "choices": ["보복적 억지는 상대의 공격 자체를 물리적으로 막는 능력에 의존한다", "거부적 억지는 공격 이후의 보복 위협만으로 이루어진다", "두 방식은 모두 방어 체계를 배제한 개념이다", "거부적 억지는 공격이 성공하지 못하도록 방어 능력을 갖추어 공격 유인을 줄이는 방식이다"], "answer": 4, "explanation": "거부적 억지는 상대가 목표를 달성하지 못하게 방어를 강화해 공격 이익을 줄이는 접근이에요.", "prof": "정답은 4번이에요. 거부적 억지는 상대가 목표를 달성하지 못하게 방어를 강화해 공격 이익을 줄이는 접근이에요. 보복적 억지는 공격에 대한 처벌 위협으로 비용을 키우는 접근이라 둘을 구분하세요."}, {"id": "q033", "category": "국제안보·군비통제", "difficulty": "중", "question": "상호확증파괴와 핵전략에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 상호확증파괴는 선제공격을 받은 뒤에도 상대에게 감당할 수 없는 보복을 가할 수 있는 2차 타격 능력의 상호 보유를 전제로 한다\nㄴ. 대도시 표적 전략은 상대의 인구와 산업 중심지를 보복 표적으로 삼는 방식이다\nㄷ. 대량보복전략은 케네디 행정부가 소련의 재래식 위협에 대응하기 위해 채택한 전략이다\nㄹ. 유연반응전략은 재래식 전력에서 핵전력까지 단계적 대응 선택지를 확보하려는 전략이다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ"], "answer": 3, "explanation": "대량보복전략은 아이젠하워 행정부의 전략이고 케네디 행정부는 유연반응전략으로 전환했어요.", "prof": "정답은 3번이에요. 대량보복전략은 아이젠하워 행정부의 전략이고 케네디 행정부는 유연반응전략으로 전환했어요. 그래서 ㄷ이 틀려요. 나머지는 MAD의 전제, 대도시 표적 전략, 유연반응의 취지를 올바르게 설명한 내용이에요."}, {"id": "q034", "category": "국제안보·군비통제", "difficulty": "중", "question": "이스라엘의 핵 정책에 대한 설명으로 옳은 것은?", "choices": ["핵확산금지조약의 회원국으로서 IAEA의 포괄안전조치를 받고 있다", "1981년 이라크 원자로 공습은 이스라엘의 첫 핵실험에 대한 대응이었다", "핵 보유를 공식 선언하고 핵실험 사실을 공개하였다", "핵무기 보유 여부를 공식적으로 인정도 부인도 하지 않는 불투명성 정책을 유지해 왔다"], "answer": 4, "explanation": "이스라엘은 핵 보유를 공식 확인하지 않는 불투명성 정책을 유지해 왔어요.", "prof": "정답은 4번이에요. 이스라엘은 핵 보유를 공식 확인하지 않는 불투명성 정책을 유지해 왔어요. NPT에 가입하지 않았기 때문에 포괄안전조치도 받지 않고, 1981년 공습은 이라크의 원자로를 겨냥한 예방적 공격으로 평가돼요."}, {"id": "q035", "category": "국제안보·군비통제", "difficulty": "상", "question": "핵확산금지조약(NPT)과 핵 비확산 체제에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 1995년 운용검토·연장회의에서 조약의 효력이 무기한 연장되었다\nㄴ. 인도, 파키스탄, 이스라엘은 NPT에 가입하지 않은 핵 보유국 또는 보유 의혹국이다\nㄷ. NPT는 핵보유국을 1970년 1월 1일 이전에 핵무기를 폭발시킨 국가로 정의한다\nㄹ. NPT 제6조는 모든 당사국에게 핵군축에 관한 성실한 협상 의무를 부과한다", "choices": ["ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ", "ㄷ"], "answer": 4, "explanation": "NPT는 1967년 1월 1일 이전에 핵무기나 핵폭발 장치를 제조·폭발한 국가를 핵보유국으로 정의해요.", "prof": "정답은 4번이에요. NPT는 1967년 1월 1일 이전에 핵무기나 핵폭발 장치를 제조·폭발한 국가를 핵보유국으로 정의해요. 그래서 ㄷ이 틀렸고, 나머지 세 가지는 맞는 서술이에요. 제6조의 군축 의무는 비핵국가들이 자주 거론하는 쟁점이에요."}, {"id": "q036", "category": "국제안보·군비통제", "difficulty": "상", "question": "포괄적핵실험금지조약(CTBT)에 대한 설명으로 옳은 것은?", "choices": ["조약의 발효에는 UN 안보리 상임이사국의 비준만 있으면 충분하다", "1996년 채택되었으나 발효 요건국의 비준 미비로 아직 발효되지 못하였다", "지하 핵실험만 금지하고 대기권 핵실험은 허용한다", "모든 핵실험을 금지하는 조약으로 1970년대에 발효되었다"], "answer": 2, "explanation": "CTBT는 1996년 채택되었지만 핵 능력이 있는 일부 국가의 비준이 필요해 아직 발효되지 않았어요.", "prof": "정답은 2번이에요. CTBT는 1996년 채택되었지만 핵 능력이 있는 일부 국가의 비준이 필요해 아직 발효되지 않았어요. 모든 핵폭발을 금지하는 조약이며, 대기권·우주·수중 실험만 금지한 것은 1963년 부분적 핵실험금지조약이에요."}, {"id": "q037", "category": "국제안보·군비통제", "difficulty": "중", "question": "냉전기 군비통제 조약에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1963년 부분적 핵실험금지조약은 대기권, 우주, 수중에서의 핵실험을 금지하였다\nㄴ. 1972년 SALT I 협정과 함께 체결된 ABM 조약은 미사일 방어체계의 배치를 제한하였다\nㄷ. 1987년 INF 조약은 미국과 소련의 중거리 핵전력을 폐기하도록 하였다\nㄹ. SALT II는 1979년 서명 후 미 상원의 비준을 거쳐 정상적으로 발효되었다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": 2, "explanation": "SALT II는 1979년 서명되었으나 소련의 아프가니스탄 침공으로 미 상원 비준이 이루어지지 않았어요.", "prof": "정답은 2번이에요. SALT II는 1979년 서명되었으나 소련의 아프가니스탄 침공으로 미 상원 비준이 이루어지지 않았어요. 그래서 ㄹ이 틀리고, 나머지 세 조약에 대한 서술은 모두 정확해요."}, {"id": "q038", "category": "국제안보·군비통제", "difficulty": "상", "question": "탄도탄요격미사일(ABM) 조약에 대한 설명으로 옳은 것은?", "choices": ["상대의 보복 능력을 무력화할 수 있는 방어망을 제한하여 상호확증파괴를 안정화하려는 취지였다", "조약은 2002년까지 양측이 준수하였고 이후 소련이 탈퇴하였다", "공격용 전략미사일의 보유 상한을 직접 정한 조약이다", "조약은 미소 양국 외에도 중국과 영국이 서명한 다자조약이다"], "answer": 1, "explanation": "ABM 조약은 방어망을 제한하여 서로의 보복 능력이 유지되게 하려던 조약이에요.", "prof": "정답은 1번이에요. ABM 조약은 방어망을 제한하여 서로의 보복 능력이 유지되게 하려던 조약이에요. 2002년에 탈퇴한 것은 미국이며, 공격용 미사일 상한은 SALT I 잠정협정의 몫이었어요. 당사국도 미국과 소련 양자였어요."}, {"id": "q039", "category": "국제안보·군비통제", "difficulty": "상", "question": "INF 조약(1987)에 대한 설명으로 옳은 것은?", "choices": ["미국과 소련 외에 중국이 당사국으로 참여하였다", "2019년 러시아가 먼저 조약 탈퇴를 선언하여 종료되었다", "사거리 500km 이상 5,500km 이하의 지상 발사 탄도미사일과 순항미사일의 폐기를 규정하였다", "사거리와 관계없이 잠수함 발사 탄도미사일까지 모두 폐기하도록 하였다"], "answer": 3, "explanation": "INF 조약은 레이건과 고르바초프가 체결했고 사거리 500~5,500km 지상 발사 미사일을 대상으로 했어요.", "prof": "정답은 3번이에요. INF 조약은 레이건과 고르바초프가 체결했고 사거리 500~5,500km 지상 발사 미사일을 대상으로 했어요. 중국은 당사국이 아니어서 이후 중국의 중거리 전력이 쟁점이 되었고, 2019년 미국이 탈퇴를 통보한 뒤 조약이 종료됐어요."}, {"id": "q040", "category": "국제안보·군비통제", "difficulty": "상", "question": "생물무기금지협약(BWC)과 화학무기금지협약(CWC)에 대한 설명으로 옳은 것은?", "choices": ["BWC는 협약 이행을 확인할 공식 검증 체제를 갖추지 못한 점이 한계로 지적된다", "CWC는 화학무기의 개발만 금지하고 보유와 사용은 허용한다", "BWC는 1993년에 서명되어 1997년 발효되었다", "CWC는 이행을 감시할 국제기구를 두지 않고 당사국의 자발적 보고에만 의존한다"], "answer": 1, "explanation": "BWC는 1972년 서명되고 1975년 발효되었지만 검증 체제가 없다는 것이 약점이에요.", "prof": "정답은 1번이에요. BWC는 1972년 서명되고 1975년 발효되었지만 검증 체제가 없다는 것이 약점이에요. CWC는 1993년 서명, 1997년 발효되었고 화학무기금지기구(OPCW)가 사찰을 맡으며 개발, 생산, 비축, 사용을 모두 금지해요."}, {"id": "q041", "category": "국제안보·군비통제", "difficulty": "중", "question": "동맹이론에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 글렌 스나이더는 동맹 관리의 딜레마를 연루(entrapment)와 방기(abandonment)로 설명하였다\nㄴ. 집단안보는 외부 위협에 대한 공동 방어이고, 집단방위는 체제 내부의 침략국에 대한 공동 대응이다\nㄷ. 월트는 동맹을 위협에 대한 균형의 한 방식으로 설명하였다\nㄹ. 모로우는 동맹을 안보와 자율성의 교환으로 설명하였다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "스나이더의 연루와 방기, 월트의 위협균형, 모로우의 안보-자율성 교환은 모두 맞아요.", "prof": "정답은 3번이에요. 스나이더의 연루와 방기, 월트의 위협균형, 모로우의 안보-자율성 교환은 모두 맞아요. 집단안보는 체제 내부의 침략국에 대한 공동 대응이고 집단방위는 외부 위협에 대한 공동 방어라 ㄴ이 서로 뒤바뀌어 틀렸어요."}, {"id": "q042", "category": "국제안보·군비통제", "difficulty": "중", "question": "집단안보와 집단방위에 대한 설명으로 옳은 것은?", "choices": ["북대서양조약기구(NATO)는 회원국에 대한 외부의 공격에 공동 대응하는 집단방위 기구로 분류된다", "국제연맹과 UN은 외부의 공동 적국을 상정하는 집단방위 체제이다", "집단방위는 체제 내부의 침략국에 대한 제재를 목적으로 한다", "집단안보는 가상의 적국을 사전에 지정하여 대비한다"], "answer": 1, "explanation": "NATO는 외부 위협에 맞서는 집단방위 기구이고, 국제연맹과 UN은 체제 내부 침략국에 공동 대응하는 집단안보 기구예요.", "prof": "정답은 1번이에요. NATO는 외부 위협에 맞서는 집단방위 기구이고, 국제연맹과 UN은 체제 내부 침략국에 공동 대응하는 집단안보 기구예요. 집단안보는 특정한 적을 미리 지정하지 않는 것이 특징이에요."}, {"id": "q043", "category": "국제안보·군비통제", "difficulty": "중", "question": "안정-불안정 역설(stability-instability paradox)에 대한 설명으로 옳은 것은?", "choices": ["양극체제가 다극체제보다 불안정하다는 주장이다", "핵 균형이 불안정할수록 국가들은 협력을 확대한다", "핵무기를 가진 국가 사이에서는 모든 형태의 무력 충돌이 완전히 사라진다", "핵무기에 의한 전략적 안정이 확보되면 오히려 낮은 수준의 재래식 분쟁이나 제한전이 늘어날 수 있다"], "answer": 4, "explanation": "이 역설은 글렌 스나이더 등이 설명한 것으로, 핵 억지가 전면전을 막아 주는 대신 제한적 도발의 위험을 키울 수 있다는 논리예요.", "prof": "정답은 4번이에요. 이 역설은 글렌 스나이더 등이 설명한 것으로, 핵 억지가 전면전을 막아 주는 대신 제한적 도발의 위험을 키울 수 있다는 논리예요. 인도와 파키스탄의 카르길 분쟁이 사례로 자주 거론돼요."}, {"id": "q044", "category": "국제안보·군비통제", "difficulty": "상", "question": "억지와 선제·예방전쟁 개념에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 억지가 성공하려면 일반적으로 능력, 의지, 의사 전달이 필요하다\nㄴ. 확대억지는 동맹국에 대한 공격까지 억제하려는 안보 공약이다\nㄷ. 예방전쟁은 상대의 공격이 임박했을 때 먼저 타격하는 것을 말한다\nㄹ. 2002년 미국 국가안보전략은 선제 공격 개념을 공식적으로 내세웠다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explanation": "예방전쟁은 장기적인 힘의 변화를 막기 위해 미리 하는 전쟁이고, 공격이 임박했을 때 먼저 치는 것은 선제공격이에요.", "prof": "정답은 2번이에요. 예방전쟁은 장기적인 힘의 변화를 막기 위해 미리 하는 전쟁이고, 공격이 임박했을 때 먼저 치는 것은 선제공격이에요. 그래서 ㄷ이 틀렸어요. 나머지는 억지의 요건, 확대억지 개념, 2002년 부시 행정부의 전략 변화를 올바르게 설명했어요."}, {"id": "q045", "category": "국제안보·군비통제", "difficulty": "중", "question": "버나드 브로디(Bernard Brodie)의 핵전략 인식으로 옳은 것은?", "choices": ["핵무기는 재래식 무기와 본질이 같아 전쟁 승리의 수단이 된다고 보았다", "핵무기는 방어에만 쓰이므로 억지와 무관하다고 보았다", "핵무기 시대에는 군사력의 주된 목적이 전쟁 승리보다 전쟁 방지에 있다고 보았다", "핵무기의 확산이 모든 국가에 안정을 가져온다고 보았다"], "answer": 3, "explanation": "브로디는 『절대무기』에서 핵무기 시대의 군사력은 전쟁을 막는 데 쓰여야 한다고 강조했어요.", "prof": "정답은 3번이에요. 브로디는 『절대무기』에서 핵무기 시대의 군사력은 전쟁을 막는 데 쓰여야 한다고 강조했어요. 이 관점이 이후 핵 억지 이론의 출발점이 되었어요."}, {"id": "q046", "category": "국제안보·군비통제", "difficulty": "상", "question": "핵확산 이론에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 왈츠는 핵무기의 제한적 확산이 오히려 국제 안정에 기여할 수 있다고 보았다\nㄴ. 스콧 사간은 조직이론을 바탕으로 핵무기 확산의 위험을 강조하였다\nㄷ. 핵확산 낙관론은 핵보유국이 늘면 억지가 더 불안정해진다고 본다\nㄹ. 사간은 핵 보유 동기를 안보모델, 국내정치모델, 규범모델로 설명하였다", "choices": ["ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄷ", "ㄷ, ㄹ"], "answer": 3, "explanation": "확산 낙관론은 핵무기가 늘면 오히려 억지가 안정된다는 입장이라 ㄷ이 거꾸로 되어 있어요.", "prof": "정답은 3번이에요. 확산 낙관론은 핵무기가 늘면 오히려 억지가 안정된다는 입장이라 ㄷ이 거꾸로 되어 있어요. 사간은 조직 사고의 한계를 들어 확산 비관론을 펴고, 핵 보유 동기도 세 가지 모델로 설명했어요."}, {"id": "q047", "category": "국제안보·군비통제", "difficulty": "중", "question": "핵공급국그룹(NSG)에 대한 설명으로 옳은 것은?", "choices": ["1974년 인도의 핵실험을 계기로 핵 관련 물자와 기술의 수출 통제를 위해 결성되었다", "UN 안보리 결의에 근거한 법적 구속력 있는 국제기구이다", "1991년 걸프전 이후 이라크의 핵 개발을 막기 위해 처음 구성되었다", "핵 물질의 수입 확대를 촉진하기 위한 협의체이다"], "answer": 1, "explanation": "NSG는 인도의 1974년 핵실험으로 평화적 이용 목적의 기술이 전용될 수 있음이 드러난 뒤 수출통제 지침을 마련하려고 만들어졌어요.", "prof": "정답은 1번이에요. NSG는 인도의 1974년 핵실험으로 평화적 이용 목적의 기술이 전용될 수 있음이 드러난 뒤 수출통제 지침을 마련하려고 만들어졌어요. 조약기구가 아니라 자발적 협의체예요."}, {"id": "q048", "category": "국제안보·군비통제", "difficulty": "중", "question": "군비통제 조약에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 1963년 부분적 핵실험금지조약은 지하 핵실험까지 모두 금지하였다\nㄴ. 포괄적핵실험금지조약(CTBT)은 1996년 채택되었으나 발효되지 못하였다\nㄷ. 핵무기금지조약(TPNW)은 2017년 채택되어 2021년 발효되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 3, "explanation": "부분적 핵실험금지조약은 대기권, 우주, 수중 핵실험만 금지하고 지하는 제외했어요.", "prof": "정답은 3번이에요. 부분적 핵실험금지조약은 대기권, 우주, 수중 핵실험만 금지하고 지하는 제외했어요. CTBT는 채택되었지만 발효 요건이 충족되지 않았고, TPNW는 2017년 채택, 2021년 발효했어요."}, {"id": "q049", "category": "국제안보·군비통제", "difficulty": "상", "question": "대인지뢰 금지에 관한 오타와 협약(1997)에 대한 설명으로 옳은 것은?", "choices": ["미국, 러시아, 중국은 모두 협약의 가입국이다", "집속탄의 금지를 규정한 협약이다", "협약은 재래식 무기 전체의 사용을 금지하는 것을 목적으로 한다", "대인지뢰의 사용, 비축, 생산, 이전을 금지하며 한국은 이 협약에 가입하지 않았다"], "answer": 4, "explanation": "오타와 협약은 대인지뢰를 금지하며, 한국을 비롯해 미국, 러시아, 중국 등 주요 군사 강국은 가입하지 않았어요.", "prof": "정답은 4번이에요. 오타와 협약은 대인지뢰를 금지하며, 한국을 비롯해 미국, 러시아, 중국 등 주요 군사 강국은 가입하지 않았어요. 집속탄은 2008년 오슬로 협약(CCM)이 금지한 대상이에요."}, {"id": "q050", "category": "국제안보·군비통제", "difficulty": "상", "question": "헬싱키 최종의정서(1975)에 대한 설명으로 옳은 것은?", "choices": ["법적 구속력을 가진 조약으로 비준 절차를 거쳐 발효되었다", "안보, 경제·과학·환경 협력, 인권과 인도 문제의 세 범주(바스켓)를 포괄하였다", "인권 문제를 제외하고 군사 문제에만 집중하였다", "서유럽 국가들만 참여하고 소련과 동유럽 국가는 서명하지 않았다"], "answer": 2, "explanation": "유럽안보협력회의(CSCE)의 헬싱키 최종의정서는 안보, 경제·환경, 인권이라는 세 바스켓을 담았어요.", "prof": "정답은 2번이에요. 유럽안보협력회의(CSCE)의 헬싱키 최종의정서는 안보, 경제·환경, 인권이라는 세 바스켓을 담았어요. 정치적 구속력은 있으나 조약은 아니며, 소련과 동유럽도 참여했어요."}, {"id": "q051", "category": "국제안보·군비통제", "difficulty": "중", "question": "유럽의 군비통제와 신뢰구축에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1990년 유럽재래식전력조약(CFE)은 주요 재래식 무기의 보유 상한을 설정하였다\nㄴ. 오픈스카이(Open Skies) 조약은 참가국 간 상호 비무장 정찰비행을 허용하였다\nㄷ. 1986년 스톡홀름 문서는 대규모 군사훈련의 사전 통보와 현장 사찰 등을 규정하였다\nㄹ. 미국은 2020년 오픈스카이 조약에서 러시아와 같은 시기에 함께 탈퇴하였다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "미국은 2020년에, 러시아는 2021년에 각각 오픈스카이 조약에서 탈퇴했어요.", "prof": "정답은 1번이에요. 미국은 2020년에, 러시아는 2021년에 각각 오픈스카이 조약에서 탈퇴했어요. 같은 시기가 아니어서 ㄹ이 틀려요. 앞의 세 설명은 유럽 군비통제의 핵심 사례에 대한 정확한 서술이에요."}, {"id": "q052", "category": "국제안보·군비통제", "difficulty": "중", "question": "인계철선(tripwire) 개념에 대한 설명으로 옳은 것은?", "choices": ["동맹국의 방위 의지를 약화시켜 자율성을 높이는 장치이다", "상대국이 먼저 공격하도록 유도하기 위한 군사 전략이다", "핵무기의 선제 사용 금지를 약속하는 정책이다", "동맹국에 병력을 전방 배치해 공격 시 자동 개입이 이루어지게 함으로써 확대억지의 신뢰성을 높인다"], "answer": 4, "explanation": "전방에 배치된 병력이 공격받으면 후방 병력과 핵전력이 자동으로 개입한다는 신호가 되기 때문에 억지의 신뢰성이 높아져요.", "prof": "정답은 4번이에요. 전방에 배치된 병력이 공격받으면 후방 병력과 핵전력이 자동으로 개입한다는 신호가 되기 때문에 억지의 신뢰성이 높아져요. 한반도의 주한미군도 이 의미로 설명되곤 해요."}, {"id": "q053", "category": "국제안보·군비통제", "difficulty": "중", "question": "확산방지구상(PSI)에 대한 설명으로 옳은 것은?", "choices": ["UN 안보리 결의로 창설되어 모든 회원국에 법적 구속력을 갖는다", "2003년 미국이 주도하여 시작된 대량살상무기와 관련 물자의 운송 차단을 위한 다자 협력 체제이다", "재래식 무기 전반의 거래를 차단하는 기구이다", "한국은 2003년 창설 때부터 정식 참여하였다"], "answer": 2, "explanation": "PSI는 부시 행정부가 2003년 시작한 자발적 협력 체제예요.", "prof": "정답은 2번이에요. PSI는 부시 행정부가 2003년 시작한 자발적 협력 체제예요. 한국은 초기에는 참여를 유보하다가 2009년에 전면 참여를 선언했어요. 안보리 결의에 근거한 기구가 아니에요."}, {"id": "q054", "category": "국제안보·군비통제", "difficulty": "상", "question": "국제원자력기구(IAEA) 안전조치에 대한 설명으로 옳은 것은?", "choices": ["추가의정서는 NPT 가입국 모두에 자동으로 적용된다", "추가의정서는 IAEA의 접근 범위와 정보 요구를 확대하여 미신고 핵활동 탐지 능력을 강화한다", "포괄안전조치는 핵보유국에도 NPT상 의무로 전면 적용된다", "IAEA는 UN 안전보장이사회의 하부 기관이다"], "answer": 2, "explanation": "추가의정서는 별도로 서명하고 비준해야 적용되는 보강 장치예요.", "prof": "정답은 2번이에요. 추가의정서는 별도로 서명하고 비준해야 적용되는 보강 장치예요. 포괄안전조치는 비핵국가에 의무이고 핵보유국에는 자발적이며, IAEA는 UN과 협정을 맺은 독립 기구로 안보리에 보고해요."}, {"id": "q055", "category": "국제안보·군비통제", "difficulty": "중", "question": "핵안보정상회의에 대한 설명으로 옳은 것은?", "choices": ["2012년 도쿄에서 두 번째 회의가 열렸다", "매년 연례 정상회의로 개최되어 왔다", "2012년 서울 회의가 처음 개최된 정상회의였다", "2010년 워싱턴에서 처음 열렸고 2012년 서울에서 두 번째 회의가 열렸다"], "answer": 4, "explanation": "핵안보정상회의는 2010년 워싱턴, 2012년 서울, 2014년 헤이그, 2016년 워싱턴에서 격년으로 열렸어요.", "prof": "정답은 4번이에요. 핵안보정상회의는 2010년 워싱턴, 2012년 서울, 2014년 헤이그, 2016년 워싱턴에서 격년으로 열렸어요. 서울 회의는 두 번째 회의라는 점을 기억하세요."}, {"id": "q056", "category": "국제안보·군비통제", "difficulty": "중", "question": "하이브리드전(hybrid warfare)에 대한 설명으로 옳은 것은?", "choices": ["정규전, 비정규전, 테러, 사이버 공격 등 다양한 수단을 결합하여 동시에 운용하는 전쟁 방식이다", "국가 간 외교 교섭 중에 벌어지는 군사 훈련을 뜻한다", "정규군 간의 전통적 교전만을 지칭한다", "핵무기만을 이용한 전면전을 가리키는 개념이다"], "answer": 1, "explanation": "하이브리드전은 군사적, 비군사적 수단을 섞어 모호하게 운용하는 방식이에요.", "prof": "정답은 1번이에요. 하이브리드전은 군사적, 비군사적 수단을 섞어 모호하게 운용하는 방식이에요. 정규전만 지칭하는 개념이 아니라는 점이 핵심이에요."}, {"id": "q057", "category": "국제안보·군비통제", "difficulty": "중", "question": "전쟁상관관계프로젝트(Correlates of War)에 대한 설명으로 옳은 것은?", "choices": ["연간 100명 이상의 사망자를 기준으로 삼는다", "국가 간 전쟁만을 분류하고 내전은 포함하지 않는다", "일반적으로 연간 1,000명 이상의 전투 사망자를 전쟁의 기준으로 삼는다", "전쟁 발생 원인을 단일 변수로 제시한다"], "answer": 3, "explanation": "COW는 전투 사망자 1,000명 이상을 기준으로 전쟁을 분류하며 국가 간 전쟁뿐 아니라 내전 등도 구분해요.", "prof": "정답은 3번이에요. COW는 전투 사망자 1,000명 이상을 기준으로 전쟁을 분류하며 국가 간 전쟁뿐 아니라 내전 등도 구분해요. 특정 단일 원인을 제시하는 프로젝트가 아니라 데이터 구축 프로젝트예요."}, {"id": "q058", "category": "국제안보·군비통제", "difficulty": "상", "question": "대군사 표적 전략(counterforce)과 대도시 표적 전략(countervalue)에 대한 설명으로 옳은 것은?", "choices": ["대군사 표적 전략은 상대의 핵전력과 군사시설을 표적으로 하며 선제공격 유인을 높일 수 있다는 비판이 있다", "대도시 표적 전략은 상대의 핵 미사일 기지를 우선 표적으로 삼는다", "두 전략은 모두 억지와 무관한 방어 개념이다", "대군사 표적 전략은 민간 인구 밀집 지역을 일차 표적으로 한다"], "answer": 1, "explanation": "대군사 표적 전략은 상대의 핵전력을 겨냥해 선제 타격이 가능한 것처럼 보이게 해 위기 불안정성을 키울 수 있어요.", "prof": "정답은 1번이에요. 대군사 표적 전략은 상대의 핵전력을 겨냥해 선제 타격이 가능한 것처럼 보이게 해 위기 불안정성을 키울 수 있어요. 대도시 표적 전략은 인구와 산업 중심지를 보복 표적으로 삼는 방식이에요."}, {"id": "q059", "category": "국제안보·군비통제", "difficulty": "중", "question": "전쟁과 무력 사용의 정당성에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 2003년 미국 주도의 이라크 침공은 안보리의 명시적 승인 없이 이루어졌다\nㄴ. 1991년 걸프전의 다국적군 군사행동은 안보리 결의 678호에 근거하였다\nㄷ. 1999년 코소보 사태에서 NATO의 공습은 안보리의 명시적 승인에 따라 시작되었다\nㄹ. 1981년 이스라엘의 이라크 오시라크 원자로 공습은 예방적 공격의 사례로 거론된다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 3, "explanation": "코소보 공습은 러시아와 중국의 반대 때문에 안보리 승인 없이 NATO가 단독으로 실시했어요.", "prof": "정답은 3번이에요. 코소보 공습은 러시아와 중국의 반대 때문에 안보리 승인 없이 NATO가 단독으로 실시했어요. 그래서 ㄷ이 틀려요. 나머지는 이라크 침공과 걸프전, 오시라크 공습에 대한 정확한 서술이에요."}, {"id": "q060", "category": "국제안보·군비통제", "difficulty": "중", "question": "1962년 쿠바 미사일 위기에 대한 설명으로 옳은 것은?", "choices": ["미국은 해상 봉쇄를 시작하기 전에 UN의 사전 승인을 받았다", "미국은 쿠바를 침공하지 않겠다고 약속했고, 터키에 배치된 주피터 미사일의 철수에도 비공식적으로 합의하였다", "위기는 1960년에 발생하였다", "미국은 위기 해결 과정에서 소련에게 어떠한 양보도 하지 않았다"], "answer": 2, "explanation": "위기 해결 과정에서 소련은 쿠바의 미사일을 철수하고, 미국은 쿠바 불침공을 약속하고 터키의 주피터 미사일을 비공식적으로 철수하기로 했어요.", "prof": "정답은 2번이에요. 위기 해결 과정에서 소련은 쿠바의 미사일을 철수하고, 미국은 쿠바 불침공을 약속하고 터키의 주피터 미사일을 비공식적으로 철수하기로 했어요. 위기 이후 1963년 미소 핫라인이 설치된 것도 함께 기억하세요."}, {"id": "q061", "category": "외교정책결정론", "difficulty": "상", "question": "앨리슨(Graham Allison)의 조직과정 모델(모델 II)에 대한 설명으로 옳은 것은?", "choices": ["정책결정자의 신념체계와 성격이 결정의 거의 전부를 설명한다고 본다", "국가를 단일한 합리적 행위자로 보고 목표를 극대화하는 선택을 한다고 본다", "정부 행동은 정부 내 행위자들의 협상과 타협의 정치적 산물이라고 본다", "정부의 행동은 조직들이 가진 표준운영절차와 사전에 프로그램화된 행동 목록에 크게 좌우된다고 본다"], "answer": 4, "explanation": "조직과정 모델은 정부를 느슨하게 연결된 조직들의 집합으로 보고, 결과가 표준운영절차(SOP)에 의해 만들어진다고 설명해요.", "prof": "정답은 4번이에요. 조직과정 모델은 정부를 느슨하게 연결된 조직들의 집합으로 보고, 결과가 표준운영절차(SOP)에 의해 만들어진다고 설명해요. 협상과 타협의 산물이라는 설명은 모델 III(관료정치), 단일한 합리적 행위자는 모델 I이에요."}, {"id": "q062", "category": "외교정책결정론", "difficulty": "상", "question": "관료정치 모델에서 흔히 인용되는 명제인 '서 있는 자리는 앉아 있는 자리에 따라 달라진다'에 대한 설명으로 옳은 것은?", "choices": ["모든 정부 관료는 국가 이익에 대해 동일한 입장을 갖는다는 뜻이다", "정책 결과는 조직의 표준운영절차만으로 결정된다는 뜻이다", "정책 결정은 단일한 합리적 행위자의 선택으로 설명된다는 뜻이다", "정부 관료의 정책 입장은 그가 속한 조직의 임무와 이해관계에 따라 달라진다는 뜻이다"], "answer": 4, "explanation": "이 명제는 관료정치 모델의 핵심 직관으로, 관료의 정책 입장은 그가 맡은 직책과 소속 조직의 이해에 영향을 받는다는 의미예요.", "prof": "정답은 4번이에요. 이 명제는 관료정치 모델의 핵심 직관으로, 관료의 정책 입장은 그가 맡은 직책과 소속 조직의 이해에 영향을 받는다는 의미예요. 그래서 같은 정부 안에서도 서로 다른 입장이 충돌해 협상과 타협으로 정책이 만들어져요."}, {"id": "q063", "category": "외교정책결정론", "difficulty": "상", "question": "앨리슨의 세 가지 정책결정 모델에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 합리적 행위자 모델은 국가를 일관된 목표를 가진 단일 행위자로 보고 선택을 설명한다\nㄴ. 조직과정 모델은 조직의 표준운영절차가 선택 가능한 대안의 범위를 제한한다고 본다\nㄷ. 관료정치 모델은 정책이 정부 내 행위자들의 당기고 밀치는 정치적 게임의 결과라고 본다\nㄹ. 관료정치 모델은 정부 행위를 단일한 국가 행위자의 합리적 선택으로 설명한다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ"], "answer": 2, "explanation": "앞의 세 설명은 각 모델의 핵심을 정확히 짚었어요.", "prof": "정답은 2번이에요. 앞의 세 설명은 각 모델의 핵심을 정확히 짚었어요. 관료정치 모델은 정부를 단일 행위자로 보지 않고 다수의 행위자가 경쟁하는 과정으로 보기 때문에 ㄹ이 틀려요."}, {"id": "q064", "category": "외교정책결정론", "difficulty": "중", "question": "어빙 재니스(Irving Janis)의 집단사고(groupthink)에 대한 설명으로 옳은 것은?", "choices": ["응집력이 높은 소집단에서 만장일치 압력 때문에 현실적인 대안 평가가 왜곡되는 현상이며 피그스만 침공 결정이 대표 사례로 거론된다", "집단 내 이견이 활발할수록 집단사고가 더 쉽게 나타난다", "쿠바 미사일 위기 때 케네디의 결정 과정은 집단사고의 전형적 사례로 제시되었다", "집단의 규모가 클수록 반드시 집단사고가 나타난다"], "answer": 1, "explanation": "재니스는 피그스만 침공 같은 실패한 결정에서 집단사고가 작동했다고 보았어요.", "prof": "정답은 1번이에요. 재니스는 피그스만 침공 같은 실패한 결정에서 집단사고가 작동했다고 보았어요. 반대로 쿠바 미사일 위기의 토의는 이견을 활발히 다룬 점에서 개선된 사례로 대비되곤 해요. 이견이 많으면 집단사고가 완화돼요."}, {"id": "q065", "category": "외교정책결정론", "difficulty": "상", "question": "집단사고를 예방하기 위한 방안에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 지도자는 회의 초기에 자신의 선호를 밝히지 않는 것이 좋다\nㄴ. 악마의 대변인 역할을 맡은 구성원을 지정해 반론을 제기하게 한다\nㄷ. 외부 전문가를 초청하여 집단의 판단을 점검받게 한다\nㄹ. 집단의 동질성을 높이고 외부와의 접촉을 줄여 응집력을 강화한다", "choices": ["ㄱ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄴ, ㄹ", "ㄹ"], "answer": 4, "explanation": "집단사고는 응집력과 폐쇄성에서 비롯되므로 동질성을 높이고 외부와의 접촉을 줄이는 것은 오히려 위험을 키워요.", "prof": "정답은 4번이에요. 집단사고는 응집력과 폐쇄성에서 비롯되므로 동질성을 높이고 외부와의 접촉을 줄이는 것은 오히려 위험을 키워요. 그래서 ㄹ이 틀려요. 나머지는 재니스가 제안한 예방책에 해당해요."}, {"id": "q066", "category": "외교정책결정론", "difficulty": "상", "question": "로버트 저비스(Robert Jervis)의 억지 모델과 나선 모델에 대한 설명으로 옳은 것은?", "choices": ["억지 모델은 양보 정책이 상대의 공격 유인을 줄여 갈등을 완화한다고 본다", "나선 모델은 상대의 의도를 오인하고 강경 대응하면 군비경쟁과 갈등이 악화된다고 본다", "두 모델은 상대 의도에 대한 같은 가정과 같은 처방을 제시한다", "나선 모델은 상대가 팽창적이므로 강경한 억지가 반드시 필요하다고 본다"], "answer": 2, "explanation": "저비스는 상대가 침략적이라는 가정에는 억지 모델이, 상대의 의도가 방어적이라는 가정에는 나선 모델이 맞는다고 구분했어요.", "prof": "정답은 2번이에요. 저비스는 상대가 침략적이라는 가정에는 억지 모델이, 상대의 의도가 방어적이라는 가정에는 나선 모델이 맞는다고 구분했어요. 억지 모델은 양보가 침략을 부른다고 보고, 나선 모델은 불필요한 강경 대응이 악순환을 부른다고 봐요."}, {"id": "q067", "category": "외교정책결정론", "difficulty": "중", "question": "인지적 일관성과 오인(misperception)에 대한 설명으로 옳은 것은?", "choices": ["정책결정자는 모든 정보를 객관적이고 중립적으로 처리한다", "오인은 정보가 완전해지면 자동으로 사라진다", "정책결정자는 기존의 믿음에 부합하는 정보는 쉽게 받아들이고 어긋나는 정보는 무시하거나 재해석하는 경향이 있다", "역사적 유추는 정책결정자의 판단에 영향을 주지 않는다"], "answer": 3, "explanation": "저비스의 『국제정치에서의 인식과 오인』은 인지적 일관성 욕구가 정보 해석을 왜곡한다고 지적해요.", "prof": "정답은 3번이에요. 저비스의 『국제정치에서의 인식과 오인』은 인지적 일관성 욕구가 정보 해석을 왜곡한다고 지적해요. 정책결정자는 과거 경험이나 역사적 유추의 영향도 받아요."}, {"id": "q068", "category": "외교정책결정론", "difficulty": "상", "question": "작동 코드(operational code) 연구에 대한 설명으로 옳은 것은?", "choices": ["정치 엘리트의 신념체계가 정치 세계의 본질, 갈등 해결 방식, 수단의 효용에 대한 인식을 통해 정책 선택에 영향을 준다고 본다", "정책결정자의 대인 관계 스타일만을 분석한다", "정책결정자의 신념체계는 정책 선택과 무관하다고 본다", "국제체제의 구조가 신념체계를 완전히 결정한다고 본다"], "answer": 1, "explanation": "작동 코드는 네이선 리이츠가 소련 정치국을 분석하며 제시하고 알렉산더 조지가 체계화한 개념이에요.", "prof": "정답은 1번이에요. 작동 코드는 네이선 리이츠가 소련 정치국을 분석하며 제시하고 알렉산더 조지가 체계화한 개념이에요. 신념체계가 정치 세계에 대한 인식과 행동 방식을 안내한다고 보는 접근이에요."}, {"id": "q069", "category": "외교정책결정론", "difficulty": "중", "question": "스프라우트(Harold and Margaret Sprout)의 심리적 환경과 작전적 환경 구분에 대한 설명으로 옳은 것은?", "choices": ["정책결정자는 작전적 환경을 정확히 인식하므로 두 환경은 항상 일치한다", "작전적 환경은 정책결정자의 인식에 의해서만 규정된다고 본다", "정책결정자의 행동은 객관적인 작전적 환경이 아니라 그가 인식한 심리적 환경에 직접 영향을 받는다고 본다", "심리적 환경은 정책 결과와 무관하다고 본다"], "answer": 3, "explanation": "스프라우트는 정책결정자가 환경을 인식하는 방식이 행동을 좌우한다고 주장했어요.", "prof": "정답은 3번이에요. 스프라우트는 정책결정자가 환경을 인식하는 방식이 행동을 좌우한다고 주장했어요. 객관적 환경과 인식된 환경이 어긋날 때 정책 실패가 나타나기 쉬워요."}, {"id": "q070", "category": "외교정책결정론", "difficulty": "중", "question": "제임스 로즈나우(James Rosenau)의 사전이론(pre-theory)에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1966년 외교정책 설명을 위한 변수를 체계화하려는 시도로 제시되었다\nㄴ. 설명 변수로 개인, 역할, 정부, 사회, 체제 변수를 구분하였다\nㄷ. 국가의 규모, 경제 발전 정도, 정치체제의 유형에 따라 변수의 상대적 중요도가 달라진다고 보았다\nㄹ. 체제 변수는 영향이 가장 작아 분석에서 제외하였다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "로즈나우는 다섯 변수의 상대적 영향력이 국가의 유형에 따라 달라진다고 했어요.", "prof": "정답은 1번이에요. 로즈나우는 다섯 변수의 상대적 영향력이 국가의 유형에 따라 달라진다고 했어요. 체제 변수는 제외된 것이 아니라 다섯 변수 가운데 하나라 ㄹ이 틀려요."}, {"id": "q071", "category": "외교정책결정론", "difficulty": "상", "question": "로버트 퍼트넘(Robert Putnam)의 양면게임(two-level game)에 대한 설명으로 옳은 것은?", "choices": ["국제협상은 국내 정치와 완전히 분리되어 진행된다", "국제협상과 국내 비준이 연결되어 있으며, 양쪽 수준에서 수용 가능한 합의의 범위인 승리집합(win-set)이 중요하다", "국내 승리집합이 클수록 협상력이 반드시 강해진다", "수준 II는 국제협상 단계이고 수준 I은 국내 비준 단계이다"], "answer": 2, "explanation": "퍼트넘의 모델에서 수준 I은 국제협상, 수준 II는 국내 비준이에요.", "prof": "정답은 2번이에요. 퍼트넘의 모델에서 수준 I은 국제협상, 수준 II는 국내 비준이에요. 국내 승리집합이 작을수록 양보할 여지가 좁아 협상에서 유리해질 수 있다는 점도 중요한 시사점이에요."}, {"id": "q072", "category": "외교정책결정론", "difficulty": "상", "question": "피터 구레비치(Peter Gourevitch)의 '역전된 제2이미지'에 대한 설명으로 옳은 것은?", "choices": ["국내 정치가 국제체제의 구조를 일방적으로 결정한다고 본다", "국제정치경제와 국내정치를 분석할 때 국가 내부 요인만 고려한다고 본다", "국제정치와 국내정치는 서로 영향을 주지 않는다고 본다", "국제체제의 구조와 변화가 국내 정치와 정책 선택에 영향을 미친다고 본다"], "answer": 4, "explanation": "왈츠의 제2이미지는 국내 요인이 국제 현상을 설명한다는 관점이고, 구레비치는 그 방향을 뒤집어 국제체제의 압력이 국내 정치와 정책에 영향을 준다고 설명했어요.", "prof": "정답은 4번이에요. 왈츠의 제2이미지는 국내 요인이 국제 현상을 설명한다는 관점이고, 구레비치는 그 방향을 뒤집어 국제체제의 압력이 국내 정치와 정책에 영향을 준다고 설명했어요."}, {"id": "q073", "category": "외교정책결정론", "difficulty": "중", "question": "프로스펙트 이론과 외교정책 결정에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 이익보다 손실에 더 민감하게 반응하는 경향이 있다\nㄴ. 손실 영역에서는 위험을 감수하려는 경향이 나타날 수 있다\nㄷ. 기준점(reference point)에 따라 같은 결과도 이득 또는 손실로 인식될 수 있다\nㄹ. 기대효용 이론의 가정을 그대로 지지한다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "카너먼과 트버스키의 프로스펙트 이론은 손실 회피, 기준점 의존, 손실 영역에서의 위험 추구를 설명하며 합리적 기대효용 이론에 도전해요.", "prof": "정답은 3번이에요. 카너먼과 트버스키의 프로스펙트 이론은 손실 회피, 기준점 의존, 손실 영역에서의 위험 추구를 설명하며 합리적 기대효용 이론에 도전해요. 그래서 ㄹ은 틀리고 옳은 것은 3개예요."}, {"id": "q074", "category": "외교정책결정론", "difficulty": "상", "question": "린드블롬(Charles Lindblom)의 점증주의에 대한 설명으로 옳은 것은?", "choices": ["정책은 기존 정책을 조금씩 수정하는 점증적 방식으로 형성되는 경우가 많다고 본다", "정책 결정은 목표와 수단이 명확히 구분되고 일관된 질서를 갖는다고 본다", "정책결정자는 모든 대안을 완전히 평가하여 최적의 결정을 선택한다고 본다", "정보와 시간의 제약은 정책 결정에서 고려할 필요가 없다고 본다"], "answer": 1, "explanation": "린드블롬은 이를 '헤쳐 나가기(muddling through)'라고 표현했어요.", "prof": "정답은 1번이에요. 린드블롬은 이를 '헤쳐 나가기(muddling through)'라고 표현했어요. 합리적 포괄 모형이 가정하는 완전한 대안 평가는 현실에서 어렵다고 비판하는 관점이에요."}, {"id": "q075", "category": "외교정책결정론", "difficulty": "상", "question": "코헨, 마치, 올슨의 쓰레기통 모형(garbage can model)에 대한 설명으로 옳은 것은?", "choices": ["결정은 항상 문제 인식 뒤에 해결책이 탐색되는 순서로 이루어진다고 본다", "문제, 해결책, 참여자, 선택 기회가 서로 독립적으로 흘러 다니다가 우연히 결합하여 결정이 이루어질 수 있다고 본다", "조직의 참여자는 항상 동일하고 안정적으로 참여한다고 본다", "조직의 목표가 명확하고 일관되며 결정은 목표 달성 과정으로만 이루어진다고 본다"], "answer": 2, "explanation": "쓰레기통 모형은 목표가 모호하고 참여가 유동적인 조직에서 문제와 해결책이 우연히 결합해 결정이 나오기도 한다고 봐요.", "prof": "정답은 2번이에요. 쓰레기통 모형은 목표가 모호하고 참여가 유동적인 조직에서 문제와 해결책이 우연히 결합해 결정이 나오기도 한다고 봐요. 합리적 모형과는 정반대의 가정을 가져요."}, {"id": "q076", "category": "외교정책결정론", "difficulty": "중", "question": "신고전 현실주의에 대한 설명으로 옳은 것은?", "choices": ["국제 구조만으로 모든 국가 행동을 완전히 예측할 수 있다고 본다", "구성주의에서 발전한 이론으로 규범의 영향만 강조한다", "국내 요인은 외교정책 설명에서 완전히 배제해야 한다고 본다", "체제 수준의 구조적 압력이 지도자의 인식, 국가-사회 관계 같은 국내 요인을 거쳐 외교정책으로 나타난다고 본다"], "answer": 4, "explanation": "신고전 현실주의는 구조 변수를 독립변수로 두고, 국내 요인을 매개변수로 도입해 같은 구조 아래서도 국가 정책이 달라지는 이유를 설명하려 해요.", "prof": "정답은 4번이에요. 신고전 현실주의는 구조 변수를 독립변수로 두고, 국내 요인을 매개변수로 도입해 같은 구조 아래서도 국가 정책이 달라지는 이유를 설명하려 해요. 국내 요인을 배제하는 것은 구조적 현실주의의 입장이에요."}, {"id": "q077", "category": "외교정책결정론", "difficulty": "중", "question": "외교정책과 국내 정치에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 위기 시 대통령 지지율이 오르는 '깃발 아래 결집 효과'는 무엘러가 분석하였다\nㄴ. 전환전쟁(diversionary war) 가설은 국내 불만을 외부 갈등으로 돌리려는 지도자의 유인을 말한다\nㄷ. 알몬드-리프먼 합의는 대중의 외교 여론이 매우 안정적이고 일관되다고 본다\nㄹ. 이익집단은 외교정책에 영향을 미치는 국내 행위자로 분석된다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄹ", "ㄴ, ㄹ"], "answer": 2, "explanation": "알몬드-리프먼 합의는 여론이 변덕스럽고 외교 문제에 대한 관심과 지식이 낮다고 보는 입장이라 ㄷ이 거꾸로예요.", "prof": "정답은 2번이에요. 알몬드-리프먼 합의는 여론이 변덕스럽고 외교 문제에 대한 관심과 지식이 낮다고 보는 입장이라 ㄷ이 거꾸로예요. 깃발 아래 결집 효과, 전환전쟁 가설, 이익집단의 영향은 모두 맞는 서술이에요."}, {"id": "q078", "category": "외교정책결정론", "difficulty": "중", "question": "협상 이론에 대한 설명으로 옳은 것은?", "choices": ["협상이 결렬될 때 확보할 수 있는 최선의 대안(BATNA)은 협상력의 중요한 기준이 된다", "협상에서는 상대의 이해관계보다 고정된 입장만 고려해야 한다", "협상 결렬 시 대안이 약할수록 협상력이 강해진다", "협상은 항상 한쪽의 이익이 다른 쪽의 손실이 되는 영합 게임이다"], "answer": 1, "explanation": "피셔와 유리의 『Getting to Yes』는 입장이 아니라 이해관계에 초점을 맞추고, 결렬 시 최선의 대안이 협상력을 좌우한다고 설명해요.", "prof": "정답은 1번이에요. 피셔와 유리의 『Getting to Yes』는 입장이 아니라 이해관계에 초점을 맞추고, 결렬 시 최선의 대안이 협상력을 좌우한다고 설명해요. 대안이 좋을수록 협상력이 커지고, 협상은 윈윈이 가능한 비영합 게임이 될 수 있어요."}, {"id": "q079", "category": "외교정책결정론", "difficulty": "상", "question": "알렉산더 조지(Alexander George)의 강압외교에 대한 설명으로 옳은 것은?", "choices": ["강압외교에서는 위협만 사용해야 하며 유인책은 제시해서는 안 된다", "강압외교는 군사력의 전면 사용만을 의미한다", "강압외교는 상대의 행동을 사전에 차단하는 것만을 목표로 한다", "강압외교의 유형으로 최후통첩, 암묵적 최후통첩, 시험적 압박, 점진적 압박 등을 구분하였다"], "answer": 4, "explanation": "조지는 『Forceful Persuasion』에서 강압외교를 상대가 이미 시작한 행동을 중단하거나 되돌리도록 설득하는 정책으로 보고 여러 변형을 구분했어요.", "prof": "정답은 4번이에요. 조지는 『Forceful Persuasion』에서 강압외교를 상대가 이미 시작한 행동을 중단하거나 되돌리도록 설득하는 정책으로 보고 여러 변형을 구분했어요. 위협에 더해 유인책을 함께 쓰는 것이 도움이 될 수 있다고 봤어요."}, {"id": "q080", "category": "외교정책결정론", "difficulty": "중", "question": "위기 상황의 정책 결정에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 찰스 헤르만은 위기를 높은 우선순위 가치에 대한 위협, 제한된 결정 시간, 놀람으로 정의하였다\nㄴ. 위기 상황에서 결정자들은 대체로 대안 탐색의 범위가 넓어진다\nㄷ. 위기 상황의 시간 압박은 인지적 단순화를 강화할 수 있다\nㄹ. 위기 관리 중 신호의 오해는 확전 위험을 높일 수 있다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ"], "answer": 4, "explanation": "위기에서는 시간 압박과 스트레스 때문에 대안 탐색 범위가 좁아지는 경향이 있어 ㄴ이 틀려요.", "prof": "정답은 4번이에요. 위기에서는 시간 압박과 스트레스 때문에 대안 탐색 범위가 좁아지는 경향이 있어 ㄴ이 틀려요. 나머지는 위기 정의와 인지적 단순화, 신호 오해의 위험에 대한 정확한 서술이에요."}, {"id": "q081", "category": "외교정책결정론", "difficulty": "중", "question": "리처드 노이스타트(Richard Neustadt)의 대통령 권력 이해로 옳은 것은?", "choices": ["대통령은 헌법상 권한만으로 어떤 정책도 일방적으로 관철할 수 있다고 보았다", "대통령은 설득보다 명령을 통해서만 영향력을 행사한다고 보았다", "대통령의 공식 권한만으로는 정책을 관철하기 어려워 설득이 핵심 권력이라고 보았다", "대통령의 권력은 의회와 관료제의 협조와 무관하다고 보았다"], "answer": 3, "explanation": "노이스타트는 대통령의 권력은 명령이 아니라 설득할 수 있는 능력에 있다고 강조했어요.", "prof": "정답은 3번이에요. 노이스타트는 대통령의 권력은 명령이 아니라 설득할 수 있는 능력에 있다고 강조했어요. 권력이 분산된 미국 정치에서 대통령은 협상과 설득에 의존한다는 취지예요."}, {"id": "q082", "category": "외교정책결정론", "difficulty": "상", "question": "외교정책분석(FPA)에 대한 설명으로 옳은 것은?", "choices": ["국가를 하나의 블랙박스로 보지 않고 개인, 집단, 조직 등 행위자 수준의 요인을 열어서 분석한다", "국제체제의 구조만을 유일한 설명 변수로 삼는다", "국가를 항상 단일하고 합리적인 행위자로 전제하며 내부 과정은 분석하지 않는다", "정책결정자의 인식과 신념은 연구 대상에서 제외한다"], "answer": 1, "explanation": "외교정책분석은 국가라는 블랙박스를 열어 의사결정자, 집단, 조직과 정책 과정을 살핀다는 점에서 구조 중심 이론과 구별돼요.", "prof": "정답은 1번이에요. 외교정책분석은 국가라는 블랙박스를 열어 의사결정자, 집단, 조직과 정책 과정을 살핀다는 점에서 구조 중심 이론과 구별돼요."}, {"id": "q083", "category": "외교정책결정론", "difficulty": "중", "question": "스나이더, 브룩, 사핀(Snyder, Bruck, Sapin)의 의사결정 접근에 대한 설명으로 옳은 것은?", "choices": ["국가의 행동은 국제체제 구조만으로 설명되어야 한다고 본다", "의사결정자의 인식이나 조직적 맥락은 분석에서 배제한다", "국가의 행동은 국가를 대표하는 의사결정자들이 상황을 규정하는 방식을 통해 설명되어야 한다고 본다", "국가 간 힘의 분포만으로 정책을 예측할 수 있다고 본다"], "answer": 3, "explanation": "이 연구는 국가 행동을 의사결정자들이 상황을 어떻게 규정하는지를 중심으로 설명하려 한 외교정책 분석의 출발점으로 평가돼요.", "prof": "정답은 3번이에요. 이 연구는 국가 행동을 의사결정자들이 상황을 어떻게 규정하는지를 중심으로 설명하려 한 외교정책 분석의 출발점으로 평가돼요."}, {"id": "q084", "category": "외교정책결정론", "difficulty": "중", "question": "외교정책의 수단과 개념에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 경제제재는 무역과 금융 관계를 제한해 상대의 행동 변화를 압박하는 수단이다\nㄴ. 공공외교는 상대국 국민을 대상으로 한 홍보와 교류 활동을 포함한다\nㄷ. 소프트파워는 군사력과 경제 제재를 통해 상대의 선호를 바꾸는 능력이다\nㄹ. 케넌의 X 논문은 소련 팽창을 장기적으로 봉쇄해야 한다고 주장하였다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "소프트파워는 매력과 설득을 통해 원하는 것을 얻는 능력이라 군사력과 제재를 통한 능력이라는 ㄷ이 틀려요.", "prof": "정답은 3번이에요. 소프트파워는 매력과 설득을 통해 원하는 것을 얻는 능력이라 군사력과 제재를 통한 능력이라는 ㄷ이 틀려요. 옳은 것은 3개예요."}, {"id": "q085", "category": "외교정책결정론", "difficulty": "상", "question": "조지 케넌(George Kennan)의 봉쇄 구상에 대한 설명으로 옳은 것은?", "choices": ["중국을 최우선 봉쇄 대상으로 지목하였다", "1947년 필명 X로 발표한 글에서 소련의 팽창을 장기적이고 끈기 있게 봉쇄해야 한다고 주장하였다", "1953년 한국전쟁 정전 직후에 발표되었다", "소련에 대한 선제 핵공격을 강력히 주장하였다"], "answer": 2, "explanation": "케넌은 『포린 어페어스』에 X라는 필명으로 소련의 팽창 성향을 장기적으로 봉쇄해야 한다고 주장했어요.", "prof": "정답은 2번이에요. 케넌은 『포린 어페어스』에 X라는 필명으로 소련의 팽창 성향을 장기적으로 봉쇄해야 한다고 주장했어요. 이후 봉쇄 정책이 군사화되는 것에는 비판적이었어요."}, {"id": "q086", "category": "외교정책결정론", "difficulty": "중", "question": "역사적 유추(historical analogy)와 정책 결정에 대한 설명으로 옳은 것은?", "choices": ["정책결정자는 과거 사건을 현재 상황 판단에 유추로 활용하며, 뮌헨의 교훈은 유화정책 회피 경향으로 이어지기도 한다", "베트남전 결정에서 역사적 유추는 아무런 영향을 주지 않았다", "역사적 유추는 항상 정확한 판단으로 이어진다", "정책결정자는 역사적 유추를 사용하지 않고 객관적 자료로만 판단한다"], "answer": 1, "explanation": "연구에 따르면 정책결정자는 한국전쟁이나 뮌헨 협정과 같은 과거 사건을 유추로 삼는 경향이 있고, 이는 판단을 돕기도 하지만 왜곡하기도 해요.", "prof": "정답은 1번이에요. 연구에 따르면 정책결정자는 한국전쟁이나 뮌헨 협정과 같은 과거 사건을 유추로 삼는 경향이 있고, 이는 판단을 돕기도 하지만 왜곡하기도 해요. 항상 정확하지는 않다는 점이 핵심이에요."}, {"id": "q087", "category": "외교정책결정론", "difficulty": "중", "question": "외교정책 결정 이론가와 개념에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 어빙 재니스는 집단사고 개념을 제시하였다\nㄴ. 로버트 퍼트넘은 양면게임 이론을 제시하였다\nㄷ. 그레이엄 앨리슨은 『결정의 본질』에서 신현실주의 구조 이론을 체계화하였다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 1, "explanation": "재니스는 집단사고, 퍼트넘은 양면게임과 관련된 학자예요.", "prof": "정답은 1번이에요. 재니스는 집단사고, 퍼트넘은 양면게임과 관련된 학자예요. 앨리슨의 『결정의 본질』은 구조 이론이 아니라 쿠바 미사일 위기를 세 가지 정책결정 모델로 분석한 책이에요."}, {"id": "q088", "category": "외교정책결정론", "difficulty": "상", "question": "미국 국가안전보장회의(NSC)에 대한 설명으로 옳은 것은?", "choices": ["국무부의 하부 조직으로 설치되어 국무장관이 의장을 맡는다", "1990년대 냉전 종식 이후에 처음 설치되었다", "1947년 의회 산하의 입법 보좌기구로 설립되었다", "1947년 국가안보법에 따라 외교, 군사, 정보 정책을 통합 조정하기 위해 설치되었다"], "answer": 4, "explanation": "NSC는 1947년 국가안보법으로 신설되어 대통령이 외교, 군사, 정보 부처의 정책을 통합 조정하는 데 쓰는 기구예요.", "prof": "정답은 4번이에요. NSC는 1947년 국가안보법으로 신설되어 대통령이 외교, 군사, 정보 부처의 정책을 통합 조정하는 데 쓰는 기구예요. 의회 산하나 국무부 하부 조직이 아니에요."}, {"id": "q089", "category": "외교정책결정론", "difficulty": "중", "question": "합리적 행위자 모델(모델 I)에 대한 설명으로 옳은 것은?", "choices": ["국가 내부의 조직 정치와 관료들의 협상 과정에 주목한다", "국가를 일관된 목표를 가진 단일한 행위자로 가정하고 비용과 효용을 따져 효용을 극대화하는 선택을 한다고 본다", "정책은 정보 부족과 우연이 만든 비합리적 산물이라고 본다", "정부는 느슨하게 결합된 조직들의 집합으로 보고 SOP에 따라 행동한다고 본다"], "answer": 2, "explanation": "모델 I은 국가를 단일 합리적 행위자로 보고 목표 달성에 가장 효과적인 수단을 선택한다고 가정해요.", "prof": "정답은 2번이에요. 모델 I은 국가를 단일 합리적 행위자로 보고 목표 달성에 가장 효과적인 수단을 선택한다고 가정해요. 조직과정과 관료정치 모델은 내부 과정을 열어 설명한다는 점에서 구별돼요."}, {"id": "q090", "category": "외교정책결정론", "difficulty": "중", "question": "외교정책 결정과 헌법·제도에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 외교정책은 국내외 요인이 상호작용하는 과정에서 결정된다\nㄴ. 미국 헌법상 조약 비준에는 출석 상원의원 3분의 2의 동의가 필요하다\nㄷ. 미국에서 행정협정은 조약과 같이 상원 3분의 2의 동의가 반드시 필요하다\nㄹ. 한국 헌법상 중요한 조약의 체결과 비준에는 국회의 동의가 필요하다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄹ"], "answer": 3, "explanation": "미국의 행정협정은 상원 3분의 2 비준 없이 대통령이 체결할 수 있어 ㄷ이 틀려요.", "prof": "정답은 3번이에요. 미국의 행정협정은 상원 3분의 2 비준 없이 대통령이 체결할 수 있어 ㄷ이 틀려요. 나머지는 외교정책 결정의 국내외 연계, 미국의 조약 비준 요건, 한국 헌법상 국회 동의권에 대한 정확한 서술이에요."}, {"id": "q091", "category": "국제정치경제", "difficulty": "중", "question": "브레턴우즈 체제에 대한 설명으로 옳은 것은?", "choices": ["GATT도 이 회의에서 설립되어 국제 무역 질서를 함께 규율하였다", "변동환율제를 원칙으로 채택하였고 각국이 환율을 자유롭게 결정하도록 하였다", "소련이 IMF의 창립 회원국으로 가입하여 체제에 참여하였다", "1944년 회의에서 IMF와 국제부흥개발은행(IBRD) 설립이 합의되었고 달러의 금 태환을 바탕으로 조정 가능한 고정환율제를 채택하였다"], "answer": 4, "explanation": "브레턴우즈 체제는 금 1온스를 35달러로 고정하고 다른 통화를 달러에 고정하는 조정 가능한 고정환율제였어요.", "prof": "정답은 4번이에요. 브레턴우즈 체제는 금 1온스를 35달러로 고정하고 다른 통화를 달러에 고정하는 조정 가능한 고정환율제였어요. GATT는 1947년 제네바에서 체결되었고, 소련은 이 체제에 가입하지 않았어요."}, {"id": "q092", "category": "국제정치경제", "difficulty": "중", "question": "국제통화체제의 변화에 대한 설명으로 옳은 것은?", "choices": ["킹스턴 합의에서 금이 국제통화체제의 공식 기준으로 재확립되었다", "1971년 닉슨 행정부가 금 태환 정지를 선언한 뒤 1976년 킹스턴 합의에서 변동환율제가 공식 인정되었다", "닉슨 행정부의 금 태환 정지 이후 곧바로 금본위제로 복귀하였다", "플라자 합의에서 변동환율제가 공식 인정되었다"], "answer": 2, "explanation": "닉슨 쇼크(1971)로 금 태환이 정지되었고, 킹스턴 합의(1976)에서 금의 공식 역할이 폐지되고 변동환율제가 합법화되었어요.", "prof": "정답은 2번이에요. 닉슨 쇼크(1971)로 금 태환이 정지되었고, 킹스턴 합의(1976)에서 금의 공식 역할이 폐지되고 변동환율제가 합법화되었어요. 플라자 합의(1985)는 달러 강세를 시정하기 위한 G5의 협조예요."}, {"id": "q093", "category": "국제정치경제", "difficulty": "상", "question": "국제통화체제와 국제정치경제 개념에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 트리핀 딜레마는 기축통화 발행국이 유동성을 공급하려면 경상수지 적자를 감수해야 하고 이는 통화의 신뢰를 약화시킨다는 문제를 말한다\nㄴ. 러기의 내장된 자유주의는 국제적 개방과 국내의 복지, 완전고용을 절충한 전후 질서의 성격을 설명한다\nㄷ. 특별인출권(SDR)은 1969년 IMF가 창설한 국제 준비자산이다\nㄹ. IMF에서 회원국의 투표권은 쿼터와 무관하게 국가별로 동일하다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ"], "answer": 2, "explanation": "IMF의 투표권은 출자 비율인 쿼터에 연동되어 있어요.", "prof": "정답은 2번이에요. IMF의 투표권은 출자 비율인 쿼터에 연동되어 있어요. 그래서 ㄹ이 틀리고, 트리핀 딜레마, 내장된 자유주의, SDR에 대한 설명은 모두 정확해요."}, {"id": "q094", "category": "국제정치경제", "difficulty": "상", "question": "불가능한 삼위일체(impossible trinity)에 대한 설명으로 옳은 것은?", "choices": ["고정환율제와 자본 이동의 자유를 택하면 통화정책의 독립성은 그대로 유지된다", "세 가지 목표는 적절한 정책 조합으로 항상 동시에 달성될 수 있다", "변동환율제를 택하면 환율 안정과 통화정책 독립을 동시에 얻을 수 있다", "자유로운 자본 이동, 환율 안정, 독립적 통화정책 가운데 동시에 달성할 수 있는 것은 두 가지뿐이다"], "answer": 4, "explanation": "먼델-플레밍 모형에서 도출된 이 명제는 세 목표 가운데 두 가지만 동시에 가능하다는 것이에요.", "prof": "정답은 4번이에요. 먼델-플레밍 모형에서 도출된 이 명제는 세 목표 가운데 두 가지만 동시에 가능하다는 것이에요. 고정환율과 자본 자유화를 택하면 통화정책 자율성을 포기해야 해요."}, {"id": "q095", "category": "국제정치경제", "difficulty": "중", "question": "GATT와 WTO에 대한 설명으로 옳은 것은?", "choices": ["도하개발의제는 2001년에 시작되어 2008년에 전면 타결되었다", "GATT는 서비스 무역과 지식재산권까지 포괄하는 협정이었다", "GATT는 1947년 서명되어 1948년 발효되었고 WTO는 우루과이 라운드의 결과로 1995년 출범하였다", "WTO는 1947년 국제무역기구(ITO)가 발효되면서 곧바로 출범하였다"], "answer": 3, "explanation": "GATT는 상품 무역 중심의 잠정적 협정이었고, WTO는 우루과이 라운드(1986~94)의 결과로 1995년 출범한 상설 기구예요.", "prof": "정답은 3번이에요. GATT는 상품 무역 중심의 잠정적 협정이었고, WTO는 우루과이 라운드(1986~94)의 결과로 1995년 출범한 상설 기구예요. 도하 라운드는 2001년 출범했지만 전면 타결에 이르지 못했어요."}, {"id": "q096", "category": "국제정치경제", "difficulty": "상", "question": "WTO의 원칙과 제도에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 최혜국 대우 원칙은 한 회원국에 부여한 무역상 이익을 다른 모든 회원국에 동일하게 부여하는 것이다\nㄴ. 내국민 대우 원칙은 수입품에 대해 동종의 국내 제품과 동등한 대우를 하도록 하는 것이다\nㄷ. 지역무역협정은 일정한 요건 아래 최혜국 대우 원칙의 예외로 허용된다\nㄹ. WTO 분쟁해결기구의 상소기구는 2019년 말 이후에도 위원 임명에 문제가 없이 정상 작동하였다", "choices": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ", "ㄹ"], "answer": 4, "explanation": "미국이 위원 임명에 반대하면서 2019년 말 이후 상소기구는 정족수를 채우지 못해 사실상 기능이 중단되었어요.", "prof": "정답은 4번이에요. 미국이 위원 임명에 반대하면서 2019년 말 이후 상소기구는 정족수를 채우지 못해 사실상 기능이 중단되었어요. 따라서 ㄹ이 틀려요. 앞의 세 설명은 WTO 원칙에 대한 정확한 서술이에요."}, {"id": "q097", "category": "국제정치경제", "difficulty": "상", "question": "WTO 분쟁해결절차에 대한 설명으로 옳은 것은?", "choices": ["패널 보고서는 역총의(negative consensus) 방식으로 채택되어 사실상 자동으로 채택된다", "패널 판정의 이행은 군사적 제재를 통해 강제된다", "패널 보고서의 채택에는 모든 회원국의 만장일치 찬성이 필요하다", "패널 판정에 대해서는 어떤 경우에도 재심을 청구할 수 없다"], "answer": 1, "explanation": "WTO는 GATT와 달리 패널 보고서를 반대 합의가 없는 한 자동 채택하는 역총의제를 도입했어요.", "prof": "정답은 1번이에요. WTO는 GATT와 달리 패널 보고서를 반대 합의가 없는 한 자동 채택하는 역총의제를 도입했어요. 이행 강제 수단은 보복관세 같은 무역 조치이며 군사적 제재가 아니에요."}, {"id": "q098", "category": "국제정치경제", "difficulty": "중", "question": "우루과이 라운드(1986~1994)의 결과에 대한 설명으로 옳은 것은?", "choices": ["농업 분야는 협상 대상에서 제외되었다", "서비스 무역(GATS), 무역 관련 지식재산권(TRIPS), 무역 관련 투자조치(TRIMS) 등이 새로 규율 대상에 포함되었다", "서비스와 지식재산권은 이후 도쿄 라운드에서 비로소 다루어졌다", "처음으로 상품 관세 인하 협상이 이루어진 다자 라운드였다"], "answer": 2, "explanation": "우루과이 라운드는 농업과 섬유를 협상에 넣고, 서비스와 지식재산권, 투자조치를 새롭게 다뤘다는 점에서 이전 라운드와 달라요.", "prof": "정답은 2번이에요. 우루과이 라운드는 농업과 섬유를 협상에 넣고, 서비스와 지식재산권, 투자조치를 새롭게 다뤘다는 점에서 이전 라운드와 달라요. 관세 인하는 GATT 초기 라운드부터 이어진 주제예요."}, {"id": "q099", "category": "국제정치경제", "difficulty": "상", "question": "지역경제통합의 단계에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 자유무역지대는 역내 관세를 철폐하되 역외에 대한 관세는 각국이 독자적으로 유지한다\nㄴ. 관세동맹은 역내 관세를 철폐하고 역외에 공동 관세를 부과한다\nㄷ. 공동시장은 관세동맹에 더해 노동과 자본 등 생산요소의 자유로운 이동을 보장한다\nㄹ. 경제동맹은 공동시장 단계보다 앞선 초기 단계이다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "발라사가 정리한 통합 단계는 자유무역지대, 관세동맹, 공동시장, 경제동맹, 완전한 경제통합 순이에요.", "prof": "정답은 3번이에요. 발라사가 정리한 통합 단계는 자유무역지대, 관세동맹, 공동시장, 경제동맹, 완전한 경제통합 순이에요. 경제동맹은 공동시장 다음 단계이므로 ㄹ만 틀리고 옳은 것은 3개예요."}, {"id": "q100", "category": "국제정치경제", "difficulty": "중", "question": "유럽통합의 역사에 대한 설명으로 옳은 것은?", "choices": ["1992년 마스트리히트 조약으로 유럽연합이 출범하였고(1993년 발효), 유로는 1999년 도입되어 2002년 지폐와 동전이 유통되었다", "1957년 로마조약으로 유로화가 도입되었다", "솅겐 협정으로 1957년에 역내 국경 통제가 폐지되었다", "리스본 조약은 2002년에 발효되었다"], "answer": 1, "explanation": "마스트리히트 조약은 경제통화동맹과 공동외교안보정책의 틀을 마련했고, 유로는 1999년 도입, 2002년 실물 유통되었어요.", "prof": "정답은 1번이에요. 마스트리히트 조약은 경제통화동맹과 공동외교안보정책의 틀을 마련했고, 유로는 1999년 도입, 2002년 실물 유통되었어요. 리스본 조약은 2009년 발효, 솅겐 협정은 1985년 체결되어 1995년 시행되었어요."}, {"id": "q101", "category": "국제정치경제", "difficulty": "중", "question": "브렉시트에 대한 설명으로 옳은 것은?", "choices": ["영국은 2016년 국민투표를 거쳐 2020년 1월 31일 EU에서 공식 탈퇴하였다", "영국은 2019년 3월 29일에 공식 탈퇴를 완료하였다", "영국은 유로존에 가입한 상태에서 EU를 탈퇴하였다", "국민투표는 2013년에 실시되었다"], "answer": 1, "explanation": "영국은 2016년 6월 국민투표에서 탈퇴를 선택했고, 협상과 탈퇴 시기 연장을 거쳐 2020년 1월 31일 공식 탈퇴했어요.", "prof": "정답은 1번이에요. 영국은 2016년 6월 국민투표에서 탈퇴를 선택했고, 협상과 탈퇴 시기 연장을 거쳐 2020년 1월 31일 공식 탈퇴했어요. 영국은 유로를 도입한 적이 없어요."}, {"id": "q102", "category": "국제정치경제", "difficulty": "상", "question": "라울 프레비시(Raúl Prebisch)와 한스 싱어(Hans Singer)의 주장으로 옳은 것은?", "choices": ["일차산품 수출국의 교역조건은 장기적으로 개선되는 경향이 있다", "자유무역은 모든 국가에 균등한 이익을 준다", "수입대체 산업화는 비효율적이므로 개도국이 피해야 한다", "일차산품 수출국의 교역조건이 공산품 수출국에 비해 장기적으로 악화되는 경향이 있다"], "answer": 4, "explanation": "프레비시-싱어 가설은 개도국의 교역조건 악화를 지적하며 수입대체 산업화 정책을 뒷받침하는 논거가 되었어요.", "prof": "정답은 4번이에요. 프레비시-싱어 가설은 개도국의 교역조건 악화를 지적하며 수입대체 산업화 정책을 뒷받침하는 논거가 되었어요. 비교우위론에 입각한 자유무역 낙관론과 대비돼요."}, {"id": "q103", "category": "국제정치경제", "difficulty": "상", "question": "동아시아 발전국가에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 찰머스 존슨은 일본 통산성(MITI)이 주도한 산업정책을 분석하였다\nㄴ. 앨리스 앰스덴은 한국의 산업화를 후발 산업화의 관점에서 분석하였다\nㄷ. 로버트 웨이드는 대만의 정부가 시장을 이끌며 산업정책을 펼쳤다고 분석하였다\nㄹ. 발전국가는 시장 개입을 최소화하는 자유방임을 원칙으로 한다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explanation": "발전국가론은 국가가 산업정책으로 시장을 적극 이끈 점에 주목해요.", "prof": "정답은 2번이에요. 발전국가론은 국가가 산업정책으로 시장을 적극 이끈 점에 주목해요. 그래서 자유방임 원칙이라는 ㄹ이 틀려요. 존슨, 앰스덴, 웨이드는 모두 이 논의를 대표하는 학자예요."}, {"id": "q104", "category": "국제정치경제", "difficulty": "중", "question": "수전 스트레인지(Susan Strange)의 구조적 권력 개념에 대한 설명으로 옳은 것은?", "choices": ["구조적 권력을 군사, 외교, 문화, 이념의 네 가지로 구분하였다", "구조적 권력은 국가만이 가질 수 있다고 보았다", "구조적 권력을 안보, 생산, 금융, 지식 구조에서 행사하는 권력으로 구분하였다", "권력은 오직 국가 간 직접적 강제를 통해서만 행사된다고 보았다"], "answer": 3, "explanation": "스트레인지는 『국가와 시장』에서 국제정치경제의 권력을 네 가지 구조로 설명했어요.", "prof": "정답은 3번이에요. 스트레인지는 『국가와 시장』에서 국제정치경제의 권력을 네 가지 구조로 설명했어요. 권력이 국가에만 있지 않고 시장과 비국가 행위자에게도 있다는 점이 특징이에요."}, {"id": "q105", "category": "국제정치경제", "difficulty": "중", "question": "워싱턴 컨센서스에 대한 설명으로 옳은 것은?", "choices": ["윌리엄슨이 1989년 라틴아메리카에 대한 정책 처방을 요약한 개념으로 재정 규율, 무역 자유화, 민영화 등을 포함한다", "사회주의 계획경제로의 이행을 권고하였다", "1944년 브레턴우즈 회의에서 합의된 정책 노선이다", "국가 주도의 산업정책 강화와 자본통제를 권고하였다"], "answer": 1, "explanation": "윌리엄슨이 정리한 워싱턴 컨센서스는 재정 건전성, 시장 개방, 민영화, 규제 완화를 골자로 하는 신자유주의적 처방이에요.", "prof": "정답은 1번이에요. 윌리엄슨이 정리한 워싱턴 컨센서스는 재정 건전성, 시장 개방, 민영화, 규제 완화를 골자로 하는 신자유주의적 처방이에요. 이후 IMF와 세계은행 구조조정 프로그램에 큰 영향을 주었어요."}, {"id": "q106", "category": "국제정치경제", "difficulty": "중", "question": "1990년대 후반 아시아 금융위기와 이후 대응에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 1997년 7월 태국 바트화 절하를 계기로 위기가 확산되기 시작하였다\nㄴ. 한국은 1997년 12월 IMF와 구제금융 지원에 합의하였다\nㄷ. 치앙마이 이니셔티브는 2008년 글로벌 금융위기 이후에 처음 합의되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ×", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 1, "explanation": "치앙마이 이니셔티브는 2000년 ASEAN+3가 통화스와프 네트워크를 만들기로 한 것으로 1997년 위기의 교훈에서 나왔어요.", "prof": "정답은 1번이에요. 치앙마이 이니셔티브는 2000년 ASEAN+3가 통화스와프 네트워크를 만들기로 한 것으로 1997년 위기의 교훈에서 나왔어요. 2008년 이후에는 이를 다자화(CMIM)하는 방향으로 발전했어요."}, {"id": "q107", "category": "국제정치경제", "difficulty": "중", "question": "G20 정상회의에 대한 설명으로 옳은 것은?", "choices": ["1999년 G20 재무장관회의가 정상회의로 승격되면서 처음 열렸다", "G20 정상회의는 G7의 후속 기구로 G7 회원국만 참여한다", "2008년 글로벌 금융위기를 계기로 G20 정상회의가 처음 열렸고 2010년 서울에서 다섯 번째 회의가 개최되었다", "2010년 서울 회의는 G20 정상회의의 세 번째 회의였다"], "answer": 3, "explanation": "G20 정상회의는 2008년 워싱턴에서 처음 열렸고 이후 런던, 피츠버그, 토론토를 거쳐 2010년 서울에서 다섯 번째로 열렸어요.", "prof": "정답은 3번이에요. G20 정상회의는 2008년 워싱턴에서 처음 열렸고 이후 런던, 피츠버그, 토론토를 거쳐 2010년 서울에서 다섯 번째로 열렸어요. 한국은 아시아에서 처음 의장국이 되었어요."}, {"id": "q108", "category": "국제정치경제", "difficulty": "중", "question": "플라자 합의(1985)에 대한 설명으로 옳은 것은?", "choices": ["금 가격을 다시 고정하기 위한 합의였다", "G7이 엔화 약세를 유도하기 위해 합의하였다", "달러 가치를 높이기 위해 각국이 달러를 매입하기로 합의하였다", "G5가 달러 강세를 시정하기 위해 협조 개입에 합의하였고 이후 엔화 가치가 크게 상승하였다"], "answer": 4, "explanation": "플라자 합의는 미국의 무역적자 해소를 위해 G5가 달러 가치 하락을 유도하기로 한 협조 개입이에요.", "prof": "정답은 4번이에요. 플라자 합의는 미국의 무역적자 해소를 위해 G5가 달러 가치 하락을 유도하기로 한 협조 개입이에요. 이후 엔화가 급등한 것이 일본 경제에 큰 영향을 주었어요."}, {"id": "q109", "category": "국제정치경제", "difficulty": "중", "question": "한국의 경제 외교에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 한국은 1967년에 GATT에 가입하였다\nㄴ. 한국은 1996년에 OECD에 가입하였다\nㄷ. 한국은 2010년에 OECD 개발원조위원회(DAC)에 가입하였다\nㄹ. 한국은 2012년에 칠레와 첫 FTA를 체결하였다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ"], "answer": 2, "explanation": "한국은 칠레와 2003년 FTA를 체결하고 2004년에 발효했어요.", "prof": "정답은 2번이에요. 한국은 칠레와 2003년 FTA를 체결하고 2004년에 발효했어요. 그래서 ㄹ이 틀려요. 나머지 세 가입 연도는 정확해요."}, {"id": "q110", "category": "국제정치경제", "difficulty": "상", "question": "한국의 FTA에 대한 설명으로 옳은 것은?", "choices": ["한중 FTA는 2012년에 발효되었다", "한국은 2004년 칠레와의 FTA를 처음 발효시켰고 한-EU FTA는 2011년 7월 잠정 발효하였다", "한-ASEAN FTA는 한국이 체결한 최초의 FTA이다", "한미 FTA는 2007년에 발효되었다"], "answer": 2, "explanation": "한국의 첫 FTA는 칠레와의 FTA(2004년 발효)이고, 한-EU FTA는 2011년 7월 잠정 발효했어요.", "prof": "정답은 2번이에요. 한국의 첫 FTA는 칠레와의 FTA(2004년 발효)이고, 한-EU FTA는 2011년 7월 잠정 발효했어요. 한미 FTA는 2007년에 서명되고 2012년에 발효되었고, 한중 FTA는 2015년에 발효되었어요."}, {"id": "q111", "category": "국제정치경제", "difficulty": "중", "question": "역내포괄적경제동반자협정(RCEP)에 대한 설명으로 옳은 것은?", "choices": ["2018년에 발효되었다", "미국이 참여한 대규모 자유무역협정이다", "인도가 창립 회원국으로 참여하였다", "ASEAN 10개국과 한국, 중국, 일본, 호주, 뉴질랜드가 참여하며 2022년 1월 발효하였다"], "answer": 4, "explanation": "RCEP은 아세안 10개국과 한중일, 호주, 뉴질랜드 등 15개국으로 출범했고 인도는 협상 도중 불참을 선언했어요.", "prof": "정답은 4번이에요. RCEP은 아세안 10개국과 한중일, 호주, 뉴질랜드 등 15개국으로 출범했고 인도는 협상 도중 불참을 선언했어요. 2022년 1월 발효했고 한국에는 2022년 2월에 발효되었어요."}, {"id": "q112", "category": "국제정치경제", "difficulty": "중", "question": "미국-멕시코-캐나다 협정(USMCA)에 대한 설명으로 옳은 것은?", "choices": ["NAFTA는 2020년에 발효되었다", "미국이 탈퇴한 뒤 캐나다와 멕시코만 체결하였다", "NAFTA를 대체하여 2020년 7월 발효하였으며 자동차 원산지 규정을 강화하였다", "자동차 원산지 규정을 NAFTA보다 완화하였다"], "answer": 3, "explanation": "USMCA는 트럼프 행정부 때 NAFTA를 재협상해 2020년 7월 발효했고 역내 부가가치 비율 등 자동차 원산지 규정을 강화한 점이 특징이에요.", "prof": "정답은 3번이에요. USMCA는 트럼프 행정부 때 NAFTA를 재협상해 2020년 7월 발효했고 역내 부가가치 비율 등 자동차 원산지 규정을 강화한 점이 특징이에요. NAFTA는 1994년에 발효했어요."}, {"id": "q113", "category": "국제정치경제", "difficulty": "상", "question": "리카도의 비교우위론에 대한 설명으로 옳은 것은?", "choices": ["한 나라가 모든 상품에서 절대우위를 가지더라도 상대적으로 더 효율적인 상품에 특화해 교역하면 양국이 이익을 얻는다", "비교우위론은 보호무역을 주된 정책 처방으로 제시한다", "교역은 절대우위가 있는 국가에만 이익이 된다", "비교우위는 생산요소의 부존량만으로 결정되며 기술과는 무관하다"], "answer": 1, "explanation": "리카도는 기회비용의 관점에서 상대적으로 효율적인 상품에 특화하는 것이 양국에 이익이 된다고 설명했어요.", "prof": "정답은 1번이에요. 리카도는 기회비용의 관점에서 상대적으로 효율적인 상품에 특화하는 것이 양국에 이익이 된다고 설명했어요. 요소 부존으로 설명하는 것은 헥셔-올린 이론이에요."}, {"id": "q114", "category": "국제정치경제", "difficulty": "중", "question": "국제정치경제의 주요 시각에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 프리드리히 리스트는 유치산업 보호를 강조한 경제적 민족주의의 대표적 사상가이다\nㄴ. 애덤 스미스는 『국부론』에서 분업과 시장의 자유를 강조하였다\nㄷ. 마르크스주의 접근은 자본주의 세계경제 속의 계급 갈등과 착취 구조에 주목한다\nㄹ. 경제적 민족주의는 국가의 경제 개입을 부정하고 시장의 자기 조정만을 신뢰한다", "choices": ["ㄱ, ㄹ", "ㄴ, ㄹ", "ㄷ, ㄹ", "ㄹ"], "answer": 4, "explanation": "경제적 민족주의는 국가 이익을 위해 정부가 경제에 적극 개입해야 한다고 보는 시각이에요.", "prof": "정답은 4번이에요. 경제적 민족주의는 국가 이익을 위해 정부가 경제에 적극 개입해야 한다고 보는 시각이에요. 그래서 시장의 자기 조정만 신뢰한다는 ㄹ이 틀려요."}, {"id": "q115", "category": "국제정치경제", "difficulty": "중", "question": "석유위기에 대한 설명으로 옳은 것은?", "choices": ["1979년 이란 혁명으로 제1차 석유위기가 발생하였다", "1973년 제4차 중동전쟁 중 OAPEC이 석유 금수와 감산을 단행하여 제1차 석유위기가 발생하였다", "OPEC은 1973년에 설립되었다", "석유위기 이후 서방 소비국의 석유 수입 가격은 지속적으로 하락하였다"], "answer": 2, "explanation": "제1차 석유위기는 1973년 OAPEC의 금수와 감산으로, 제2차는 1979년 이란 혁명으로 발생했어요.", "prof": "정답은 2번이에요. 제1차 석유위기는 1973년 OAPEC의 금수와 감산으로, 제2차는 1979년 이란 혁명으로 발생했어요. OPEC은 1960년에 설립되었어요."}, {"id": "q116", "category": "국제정치경제", "difficulty": "상", "question": "무역구제 제도에 대한 설명으로 옳은 것은?", "choices": ["세이프가드는 상대국의 불공정 무역관행을 입증해야만 발동할 수 있다", "상계관세는 부당한 저가 판매를, 반덤핑관세는 정부 보조금을 대상으로 한다", "반덤핑관세는 수출국의 부당한 저가 판매로 자국 산업이 피해를 입을 때, 상계관세는 수출국 정부의 보조금이 문제일 때 부과된다", "모든 무역구제 조치는 WTO 협정상 허용되지 않는다"], "answer": 3, "explanation": "반덤핑관세와 상계관세는 각각 덤핑과 보조금에 대응하는 조치이고, 세이프가드는 불공정 행위가 없어도 수입 급증으로 심각한 피해가 있을 때 임시로 발동하는 조치예요.", "prof": "정답은 3번이에요. 반덤핑관세와 상계관세는 각각 덤핑과 보조금에 대응하는 조치이고, 세이프가드는 불공정 행위가 없어도 수입 급증으로 심각한 피해가 있을 때 임시로 발동하는 조치예요."}, {"id": "q117", "category": "국제정치경제", "difficulty": "상", "question": "일대일로(一帶一路) 구상에 대한 설명으로 옳은 것은?", "choices": ["2008년 금융위기 직후 미국이 제안한 구상이다", "2018년에 처음 제안되었다", "시진핑 주석이 2013년 중앙아시아에서 실크로드 경제벨트를, 동남아시아에서 21세기 해상 실크로드를 제안한 것이 시작이다", "대서양을 연결하는 인프라 사업이다"], "answer": 3, "explanation": "일대일로는 2013년 시진핑이 육상과 해상 실크로드를 제안하며 시작되었어요.", "prof": "정답은 3번이에요. 일대일로는 2013년 시진핑이 육상과 해상 실크로드를 제안하며 시작되었어요. 아시아인프라투자은행(AIIB) 등과 연계해 인프라 투자를 확대하고 있어요."}, {"id": "q118", "category": "국제정치경제", "difficulty": "중", "question": "BRICS에 대한 설명으로 옳은 것은?", "choices": ["BRICS 신개발은행은 1990년대에 설립 합의되었다", "첫 정상회의부터 남아공을 포함한 5개국이 참여하였다", "2001년 첫 BRICs 정상회의가 열리며 공식 출범하였다", "BRIC 4개국의 첫 정상회의는 2009년 러시아 예카테린부르크에서 열렸고 이후 남아프리카공화국이 합류하였다"], "answer": 4, "explanation": "BRIC이라는 용어는 2001년 투자은행 보고서에서 나왔고 정상회의는 2009년에 처음 열렸어요.", "prof": "정답은 4번이에요. BRIC이라는 용어는 2001년 투자은행 보고서에서 나왔고 정상회의는 2009년에 처음 열렸어요. 남아공은 2010년 합류했고 신개발은행은 2014년에 설립이 합의되었어요."}, {"id": "q119", "category": "국제정치경제", "difficulty": "상", "question": "세계화 논쟁에 대한 설명으로 옳은 것은?", "choices": ["과세계화론은 세계화가 국경의 의미를 오히려 강화한다고 본다", "헬드와 맥그루 등은 세계화 논쟁을 과세계화론, 회의론, 변환론으로 구분하였다", "회의론은 세계화가 국가 주권을 완전히 해체했다고 본다", "변환론은 세계화가 실체가 없는 허구라고 본다"], "answer": 2, "explanation": "과세계화론은 세계화로 국가 역할이 급감한다고 보고, 회의론은 세계화를 과장된 것으로 보며, 변환론은 국가의 역할이 변화하
