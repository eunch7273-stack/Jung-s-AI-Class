며 재편된다고 봐요.", "prof": "정답은 2번이에요. 과세계화론은 세계화로 국가 역할이 급감한다고 보고, 회의론은 세계화를 과장된 것으로 보며, 변환론은 국가의 역할이 변화하며 재편된다고 봐요."}, {"id": "q120", "category": "국제정치경제", "difficulty": "중", "question": "지역 협력체에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. ASEAN은 1967년 방콕 선언을 통해 창설되었다\nㄴ. APEC은 1989년에 출범하였다\nㄷ. 메르코수르는 1991년 아순시온 조약으로 출범하였다\nㄹ. NAFTA는 EU와 같이 단일 통화를 도입하였다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ"], "answer": 2, "explanation": "NAFTA는 자유무역협정이며 단일 통화를 도입한 적이 없어요.", "prof": "정답은 2번이에요. NAFTA는 자유무역협정이며 단일 통화를 도입한 적이 없어요. 단일 통화를 도입한 지역 통합체는 EU 일부 회원국의 유로존이에요. 앞의 세 서술은 정확해요."}, {"id": "q121", "category": "국제기구·국제법", "difficulty": "중", "question": "UN 안전보장이사회의 표결에 대한 설명으로 옳은 것은?", "choices": ["실질사항은 9개 이사국 이상의 찬성이 필요하며 상임이사국이 반대표를 던지지 않아야 하고 기권은 거부권 행사로 보지 않는다", "상임이사국의 기권도 거부권 행사로 간주되어 결의가 부결된다", "절차사항도 상임이사국의 거부권 대상이 된다", "결의 채택에는 15개 이사국 중 과반수인 8개국의 찬성이면 충분하다"], "answer": 1, "explanation": "안보리의 실질사항은 상임이사국 전원의 동의라는 표현 때문에 오해하기 쉬운데, 실제로는 9개국 찬성에 상임이사국의 반대가 없으면 돼요.", "prof": "정답은 1번이에요. 안보리의 실질사항은 상임이사국 전원의 동의라는 표현 때문에 오해하기 쉬운데, 실제로는 9개국 찬성에 상임이사국의 반대가 없으면 돼요. 기권은 관행상 거부권이 아니고, 절차사항은 거부권이 적용되지 않아요."}, {"id": "q122", "category": "국제기구·국제법", "difficulty": "상", "question": "'평화를 위한 단결(Uniting for Peace)' 결의에 대한 설명으로 옳은 것은?", "choices": ["1990년 걸프전 당시 안보리가 채택한 결의이다", "1950년 안보리가 총회에 군사 강제조치를 직접 명령할 수 있게 한 결의이다", "1950년 총회가 안보리의 거부권 때문에 임무 수행이 막힐 때 집단조치를 권고할 수 있게 한 결의이다", "총회가 군사 강제조치를 법적 구속력 있게 결정하도록 한 결의이다"], "answer": 3, "explanation": "총회 결의 377(V)는 한국전쟁 중 소련의 거부권 때문에 안보리가 마비되었을 때 총회가 개입할 수 있도록 한 장치예요.", "prof": "정답은 3번이에요. 총회 결의 377(V)는 한국전쟁 중 소련의 거부권 때문에 안보리가 마비되었을 때 총회가 개입할 수 있도록 한 장치예요. 총회의 결정은 원칙적으로 권고적 효력만 가져요."}, {"id": "q123", "category": "국제기구·국제법", "difficulty": "상", "question": "UN의 주요 기관에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 안전보장이사회 비상임이사국의 임기는 2년이며 즉시 연임할 수 없다\nㄴ. 국제사법재판소는 15명의 재판관으로 구성된다\nㄷ. 신탁통치이사회는 1994년 팔라우의 독립 이후 활동을 중단하였다\nㄹ. 총회의 결의는 원칙적으로 모든 회원국에 법적 구속력을 가지며 중요 문제도 단순 과반수로 결정된다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explanation": "총회의 결의는 원칙적으로 권고적 효력을 가지며, 중요 문제는 출석하고 투표한 회원국의 3분의 2 찬성이 필요해요.", "prof": "정답은 2번이에요. 총회의 결의는 원칙적으로 권고적 효력을 가지며, 중요 문제는 출석하고 투표한 회원국의 3분의 2 찬성이 필요해요. 그래서 ㄹ이 틀리고, 나머지 세 서술은 정확해요."}, {"id": "q124", "category": "국제기구·국제법", "difficulty": "중", "question": "UN 총회에 대한 설명으로 옳은 것은?", "choices": ["중요 문제는 출석하여 투표한 회원국 3분의 2의 찬성으로 결정되며 각 회원국은 1표를 가진다", "표결에서 상임이사국 5개국의 동의가 반드시 필요하다", "회원국의 투표권은 분담금 비율에 비례한다", "안보리의 결정을 총회가 번복할 수 있다"], "answer": 1, "explanation": "총회는 1국 1표 원칙으로 운영되고 중요 문제는 3분의 2 다수결이에요.", "prof": "정답은 1번이에요. 총회는 1국 1표 원칙으로 운영되고 중요 문제는 3분의 2 다수결이에요. 투표권이 분담금에 비례하는 것은 IMF 같은 기구의 방식이고, 총회가 안보리 결정을 번복할 수는 없어요."}, {"id": "q125", "category": "국제기구·국제법", "difficulty": "중", "question": "한국과 UN에 대한 설명으로 옳은 것은?", "choices": ["한국은 1948년 UN 창설과 함께 회원국이 되었다", "한국은 1973년에 북한보다 먼저 UN에 가입하였다", "1991년에는 북한만 UN에 가입하였다", "남한과 북한은 1991년 9월 제46차 UN 총회에서 동시에 가입하였다"], "answer": 4, "explanation": "남북한은 1991년 제46차 총회에서 동시에 가입했어요.", "prof": "정답은 4번이에요. 남북한은 1991년 제46차 총회에서 동시에 가입했어요. 이 가입은 남북 동시 가입을 반대하던 입장이 바뀌면서 가능해졌다는 점도 알아 두세요."}, {"id": "q126", "category": "국제기구·국제법", "difficulty": "중", "question": "UN 사무총장에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 사무총장은 안보리의 권고에 따라 총회가 임명한다\nㄴ. 사무총장의 임기는 5년이며 관행상 연임이 가능하다\nㄷ. 반기문은 2007년부터 2016년까지 사무총장을 지냈다\nㄹ. 사무총장은 총회가 단독으로 선출하며 안보리는 관여하지 않는다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "사무총장은 안보리 권고와 총회 임명이라는 이중 절차를 거쳐요.", "prof": "정답은 3번이에요. 사무총장은 안보리 권고와 총회 임명이라는 이중 절차를 거쳐요. 그래서 ㄹ이 틀리고 옳은 것은 3개예요. 반기문 전 총장은 2007년 1월부터 2016년 12월까지 재임했어요."}, {"id": "q127", "category": "국제기구·국제법", "difficulty": "상", "question": "국제사법재판소(ICJ)의 관할에 대한 설명으로 옳은 것은?", "choices": ["판결에 불복하는 당사국은 상소할 수 있다", "안보리 상임이사국에 대해서는 강제관할권이 인정된다", "개인과 비정부기구도 쟁송 사건의 당사자가 될 수 있다", "재판 관할은 당사국의 동의에 기초하며 쟁송 사건의 당사자는 국가에 한정된다"], "answer": 4, "explanation": "ICJ는 국가의 동의가 있어야 관할을 가지며 개인은 당사자가 될 수 없어요.", "prof": "정답은 4번이에요. ICJ는 국가의 동의가 있어야 관할을 가지며 개인은 당사자가 될 수 없어요. 판결은 종국적이며 상소는 불가능하고, 재심만 제한적으로 가능해요."}, {"id": "q128", "category": "국제기구·국제법", "difficulty": "상", "question": "국제사법재판소 재판관 선출에 대한 설명으로 옳은 것은?", "choices": ["재판관은 15명이며 임기 9년이고 총회와 안보리에서 각각 절대 다수의 표를 얻어야 선출된다", "5개 상임이사국이 각각 1명의 재판관을 자동으로 지명한다", "재판관은 총회에서만 선출되며 안보리는 관여하지 않는다", "재판관의 임기는 6년이며 3년마다 전원 교체된다"], "answer": 1, "explanation": "ICJ 재판관은 임기 9년이고 3년마다 3분의 1씩 개선돼요.", "prof": "정답은 1번이에요. ICJ 재판관은 임기 9년이고 3년마다 3분의 1씩 개선돼요. 총회와 안보리가 별도로 투표하며, 이 과정에서 상임이사국에도 거부권이 적용되지 않아요."}, {"id": "q129", "category": "국제기구·국제법", "difficulty": "상", "question": "국제사법재판소 규정 제38조의 법원(法源)에 대한 설명으로 옳은 것은?", "choices": ["사법판결과 학설이 가장 우선하는 1차 법원이다", "총회 결의가 법적 구속력을 가지는 1차 법원이다", "조약, 국제관습법, 법의 일반원칙이 법원이며 사법판결과 학설은 보조수단이다", "법의 일반원칙은 보조수단에 해당한다"], "answer": 3, "explanation": "국제법의 1차 법원은 조약, 국제관습법, 법의 일반원칙이에요.", "prof": "정답은 3번이에요. 국제법의 1차 법원은 조약, 국제관습법, 법의 일반원칙이에요. 판례와 학설은 법칙을 확인하는 보조수단이고, 총회 결의는 원칙적으로 권고적 효력만 가져요."}, {"id": "q130", "category": "국제기구·국제법", "difficulty": "중", "question": "국제관습법의 성립에 대한 설명으로 옳은 것은?", "choices": ["일반적이고 일관된 국가관행과 그것이 법적 의무라는 확신(opinio juris)이 있어야 한다", "국가관행 없이 법적 확신만으로도 충분하다", "모든 국가의 명시적 동의가 있어야 성립한다", "조약이 체결된 이후에만 성립할 수 있다"], "answer": 1, "explanation": "국제관습법은 국가관행과 법적 확신이라는 두 요소로 성립해요.", "prof": "정답은 1번이에요. 국제관습법은 국가관행과 법적 확신이라는 두 요소로 성립해요. 모든 국가의 명시적 동의는 필요하지 않고, 관행 없는 확신만으로도 성립하지 않아요."}, {"id": "q131", "category": "국제기구·국제법", "difficulty": "상", "question": "조약법에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 1969년 비엔나 조약법 협약은 조약을 신의성실하게 이행해야 한다는 원칙(pacta sunt servanda)을 규정한다\nㄴ. 강행규범(jus cogens)과 충돌하는 조약은 무효이다\nㄷ. 유보가 조약의 대상과 목적에 양립하지 않으면 허용되지 않는다\nㄹ. 조약은 제3국의 동의가 없어도 원칙적으로 제3국에 의무를 부과할 수 있다", "choices": ["ㄱ, ㄷ, ㄹ", "ㄱ, ㄹ", "ㄴ, ㄷ, ㄹ", "ㄹ"], "answer": 4, "explanation": "조약은 당사국에만 구속력을 가지고 제3국에는 동의 없이 의무를 부과하지 못해요.", "prof": "정답은 4번이에요. 조약은 당사국에만 구속력을 가지고 제3국에는 동의 없이 의무를 부과하지 못해요. 그래서 ㄹ이 틀려요. 앞의 세 설명은 조약법 협약의 주요 내용을 정확히 짚었어요."}, {"id": "q132", "category": "국제기구·국제법", "difficulty": "중", "question": "외교관계에 관한 비엔나협약(1961)에 대한 설명으로 옳은 것은?", "choices": ["접수국은 필요한 경우 파견국의 동의 없이 외교공관에 진입할 수 있다", "접수국은 이유를 제시하지 않고 언제든 외교관에 대해 기피인물(persona non grata)을 통보할 수 있다", "대사의 부임에는 접수국의 사전 동의인 아그레망이 필요하지 않다", "외교관은 중대한 범죄를 저질러도 형사재판 면제를 받지 못한다"], "answer": 2, "explanation": "접수국은 이유를 밝히지 않고 기피인물을 선언할 수 있고, 파견국은 이에 따라 소환하거나 직무를 종료시켜요.", "prof": "정답은 2번이에요. 접수국은 이유를 밝히지 않고 기피인물을 선언할 수 있고, 파견국은 이에 따라 소환하거나 직무를 종료시켜요. 공관은 불가침이고 외교관의 형사재판 면제는 원칙적으로 인정되며, 사절단장은 아그레망이 필요해요."}, {"id": "q133", "category": "국제기구·국제법", "difficulty": "중", "question": "국가 승인에 대한 설명으로 옳은 것은?", "choices": ["국가 승인은 국제법상 모든 국가의 법적 의무이다", "선언적 효과설은 국가 요건을 갖추면 승인과 무관하게 국가가 성립하며 승인은 이를 확인하는 행위라고 본다", "몬테비데오 협약은 타국의 승인을 국가의 요건으로 규정한다", "창설적 효과설은 승인이 없어도 국가가 성립한다고 본다"], "answer": 2, "explanation": "몬테비데오 협약은 영구적 주민, 일정한 영토, 정부, 타국과 관계를 맺을 능력을 국가 요건으로 제시해요.", "prof": "정답은 2번이에요. 몬테비데오 협약은 영구적 주민, 일정한 영토, 정부, 타국과 관계를 맺을 능력을 국가 요건으로 제시해요. 창설적 효과설은 승인이 국가 성립의 요건이라고 보고, 선언적 효과설은 승인을 확인 행위로 봐요."}, {"id": "q134", "category": "국제기구·국제법", "difficulty": "상", "question": "UN 해양법협약(UNCLOS)에 대한 설명으로 옳은 것은?", "choices": ["영해는 기선으로부터 12해리, 접속수역은 24해리, 배타적 경제수역은 200해리까지 설정할 수 있다", "배타적 경제수역은 24해리까지 설정할 수 있다", "영해는 3해리까지로 제한된다", "영해는 기선으로부터 200해리까지 인정된다"], "answer": 1, "explanation": "UNCLOS는 영해 12해리, 접속수역 24해리, 배타적 경제수역 200해리를 규정해요.", "prof": "정답은 1번이에요. UNCLOS는 영해 12해리, 접속수역 24해리, 배타적 경제수역 200해리를 규정해요. 1982년 채택, 1994년 발효되었고 미국은 비준하지 않았어요."}, {"id": "q135", "category": "국제기구·국제법", "difficulty": "상", "question": "무해통항권에 대한 설명으로 옳은 것은?", "choices": ["무해통항권은 배타적 경제수역에서만 인정된다", "연안국은 어떤 경우에도 영해에서 무해통항을 일시적으로도 정지할 수 없다", "잠수함도 무해통항 중에 수중에서 국기를 게양하지 않고 항행할 수 있다", "외국 선박은 연안국의 평화, 질서, 안전을 해치지 않는 한 영해를 무해통항할 수 있다"], "answer": 4, "explanation": "무해통항은 영해에서 인정되는 권리이고, 연안국은 안전상 필요한 경우 일정 구역에서 일시적으로 정지할 수 있어요.", "prof": "정답은 4번이에요. 무해통항은 영해에서 인정되는 권리이고, 연안국은 안전상 필요한 경우 일정 구역에서 일시적으로 정지할 수 있어요. 잠수함은 수면 위로 부상해 국기를 게양해야 해요."}, {"id": "q136", "category": "국제기구·국제법", "difficulty": "중", "question": "국제인권 규범에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 세계인권선언은 1948년 12월 UN 총회에서 채택되었다\nㄴ. 국제인권규약은 1966년 채택되어 자유권규약과 사회권규약으로 구성된다\nㄷ. 유엔인권이사회는 2006년 인권위원회를 대체하여 설립되었다\nㄹ. 보편적 정례 검토(UPR)는 일부 국가만을 대상으로 한다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "보편적 정례 검토는 모든 UN 회원국의 인권 상황을 주기적으로 검토하는 제도예요.", "prof": "정답은 1번이에요. 보편적 정례 검토는 모든 UN 회원국의 인권 상황을 주기적으로 검토하는 제도예요. 그래서 ㄹ이 틀려요. 앞의 세 서술은 인권 규범의 연혁에 대한 정확한 서술이에요."}, {"id": "q137", "category": "국제기구·국제법", "difficulty": "중", "question": "보호책임(R2P)에 대한 설명으로 옳은 것은?", "choices": ["모든 인권 침해에 대한 군사 개입을 정당화하는 원칙이다", "국가가 책임을 지기 전에 국제사회가 먼저 군사 개입을 할 수 있다는 원칙이다", "2005년 세계정상회의 성과문서에서 채택되었으며 집단살해 등으로부터 주민을 보호할 일차적 책임은 해당 국가에 있다", "1999년 코소보 공습 직후 법적 구속력 있는 조약으로 채택되었다"], "answer": 3, "explanation": "보호책임은 일차적으로 국가의 책임이고, 국가가 이를 이행하지 못하거나 원하지 않을 때 국제사회가 단계적으로 개입하는 구조예요.", "prof": "정답은 3번이에요. 보호책임은 일차적으로 국가의 책임이고, 국가가 이를 이행하지 못하거나 원하지 않을 때 국제사회가 단계적으로 개입하는 구조예요. 군사 개입은 안보리 승인 등 엄격한 조건이 따라요."}, {"id": "q138", "category": "국제기구·국제법", "difficulty": "상", "question": "UN 평화유지활동(PKO)에 대한 설명으로 옳은 것은?", "choices": ["PKO는 분쟁 당사자의 동의 없이도 배치하는 것이 원칙이다", "PKO 병력은 UN이 상시 보유하는 상비군으로 구성된다", "PKO는 UN 헌장 제7장이 명시적으로 규정한 제도이다", "전통적 PKO의 기본 원칙은 분쟁 당사자의 동의, 공정성, 자위와 임무 수행 외의 무력 불사용이다"], "answer": 4, "explanation": "전통적 PKO는 동의, 공정성, 자위 외 무력 불사용이라는 세 원칙에 따르며, 헌장에 명시되지 않아 '6장 반'으로 불려요.", "prof": "정답은 4번이에요. 전통적 PKO는 동의, 공정성, 자위 외 무력 불사용이라는 세 원칙에 따르며, 헌장에 명시되지 않아 '6장 반'으로 불려요. 병력은 회원국이 자발적으로 제공해요."}, {"id": "q139", "category": "국제기구·국제법", "difficulty": "중", "question": "국제형사재판소(ICC)에 대한 설명으로 옳은 것은?", "choices": ["ICC는 국가의 형사 관할에 우선하여 관할권을 행사한다", "관할 범죄에는 해적행위와 마약 거래가 포함된다", "로마규정은 1998년 채택되어 2002년 발효하였고 집단살해죄, 인도에 반한 죄, 전쟁범죄, 침략범죄를 관할한다", "ICC는 UN 안보리의 산하 보조기관이다"], "answer": 3, "explanation": "ICC는 독립된 상설 재판소로서 네 가지 핵심 범죄를 다뤄요.", "prof": "정답은 3번이에요. ICC는 독립된 상설 재판소로서 네 가지 핵심 범죄를 다뤄요. 국가가 수사나 기소를 할 의사나 능력이 없을 때만 개입하는 보충성 원칙이 적용돼요."}, {"id": "q140", "category": "국제기구·국제법", "difficulty": "상", "question": "국제형사재판에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 구유고 국제형사재판소(ICTY, 1993)와 르완다 국제형사재판소(ICTR, 1994)는 안보리 결의로 설립되었다\nㄴ. ICC는 보충성 원칙에 따라 국가가 수사와 기소 의사나 능력이 없을 때 관할권을 행사한다\nㄷ. 미국, 러시아, 중국은 로마규정의 당사국이다\nㄹ. 한국은 2002년에 로마규정을 비준하였다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 3, "explanation": "미국은 서명 후 철회했고 러시아도 서명 후 철회했으며 중국은 서명하지 않았어요.", "prof": "정답은 3번이에요. 미국은 서명 후 철회했고 러시아도 서명 후 철회했으며 중국은 서명하지 않았어요. 그래서 ㄷ이 틀려요. 나머지는 임시재판소의 설립 근거, 보충성 원칙, 한국의 비준에 대한 정확한 서술이에요."}, {"id": "q141", "category": "국제기구·국제법", "difficulty": "중", "question": "북대서양조약기구(NATO)에 대한 설명으로 옳은 것은?", "choices": ["창설 당시 회원국은 20개국이었다", "1949년 12개국이 북대서양조약을 체결하여 창설되었고 제5조에 집단방위 조항이 있다", "제5조는 공격받은 동맹국에 대해 모든 회원국이 자동으로 군사력을 투입할 의무를 명시한다", "핀란드와 스웨덴은 모두 2000년대에 가입하였다"], "answer": 2, "explanation": "제5조는 필요하다고 판단하는 조치를 취하겠다는 방식이라 자동 군사개입은 아니에요.", "prof": "정답은 2번이에요. 제5조는 필요하다고 판단하는 조치를 취하겠다는 방식이라 자동 군사개입은 아니에요. 핀란드는 2023년, 스웨덴은 2024년에 가입했어요."}, {"id": "q142", "category": "국제기구·국제법", "difficulty": "중", "question": "지역기구에 대한 설명으로 옳은 것은?", "choices": ["아프리카연합(AU)은 2002년 아프리카통일기구(OAU)를 계승하여 출범하였다", "아랍연맹은 1990년에 창설되었다", "상하이협력기구(SCO)는 1949년에 설립되었다", "아프리카연합은 1963년에 출범하였다"], "answer": 1, "explanation": "AU는 2002년에 OAU를 대체하며 출범했어요.", "prof": "정답은 1번이에요. AU는 2002년에 OAU를 대체하며 출범했어요. 상하이협력기구는 2001년, 아랍연맹은 1945년에 설립되었어요."}, {"id": "q143", "category": "국제기구·국제법", "difficulty": "상", "question": "국제기구의 국제법상 지위에 대한 설명으로 옳은 것은?", "choices": ["ICJ는 UN이 국제법의 주체가 될 수 없다고 판단하였다", "국제기구는 조약을 체결할 능력이 전혀 없다", "국제기구의 법인격은 모든 회원국의 동의가 있어야만 인정된다", "ICJ는 1949년 권고적 의견에서 UN이 국제법상 법인격을 가지며 임무 수행에 필요한 범위의 권한을 가진다고 보았다"], "answer": 4, "explanation": "1949년 '손해배상 사건' 권고적 의견은 UN의 법인격과 묵시적 권한을 인정한 선례로 중요해요.", "prof": "정답은 4번이에요. 1949년 '손해배상 사건' 권고적 의견은 UN의 법인격과 묵시적 권한을 인정한 선례로 중요해요."}, {"id": "q144", "category": "국제기구·국제법", "difficulty": "중", "question": "국가의 형사 관할권에 대한 설명으로 옳은 것은?", "choices": ["속인주의는 외국인이 외국에서 저지른 모든 범죄에 적용된다", "속지주의는 범죄 발생 영토를 기준으로, 속인주의는 범죄인의 국적을 기준으로 관할권을 행사한다", "보편주의는 자국민이 피해를 입은 경우에만 관할권을 인정한다", "보호주의는 자국 영토 내에서 발생한 범죄에만 적용된다"], "answer": 2, "explanation": "속지주의와 속인주의는 가장 기본적인 관할 근거예요.", "prof": "정답은 2번이에요. 속지주의와 속인주의는 가장 기본적인 관할 근거예요. 보편주의는 해적이나 집단살해 같은 중대한 범죄에 대한 관할이고, 보호주의는 자국의 중대한 국가 이익을 해치는 범죄를 대상으로 해요."}, {"id": "q145", "category": "국제기구·국제법", "difficulty": "중", "question": "국제 공역과 공유 영역에 대한 조약으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 남극조약(1959)은 남극의 평화적 이용을 규정하고 영유권 주장을 동결하였다\nㄴ. 우주조약(1967)은 천체에 대한 국가의 영유를 금지하였다\nㄷ. UNCLOS의 심해저 제도는 심해저와 그 자원을 인류의 공동유산으로 규정한다\nㄹ. 우주조약은 우주에서의 모든 군사 활동을 전면 금지한다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "우주조약은 궤도와 천체에 대량살상무기를 배치하는 것을 금지하고, 천체의 군사적 이용을 제한하지만 모든 군사 활동을 전면 금지하지는 않아요.", "prof": "정답은 1번이에요. 우주조약은 궤도와 천체에 대량살상무기를 배치하는 것을 금지하고, 천체의 군사적 이용을 제한하지만 모든 군사 활동을 전면 금지하지는 않아요. 그래서 ㄹ이 틀려요."}, {"id": "q146", "category": "국제기구·국제법", "difficulty": "상", "question": "국가책임에 대한 설명으로 옳은 것은?", "choices": ["사인의 행위는 어떤 경우에도 국가에 귀속되지 않는다", "국제의무 위반인 행위가 국가에 귀속되면 국가책임이 성립하며 위반국은 중지, 재발방지, 배상의 의무를 진다", "위법행위를 한 국가는 배상만 하면 되고 중지 의무는 없다", "국가책임은 고의가 입증되어야만 성립한다"], "answer": 2, "explanation": "국가책임은 국제위법행위가 국가에 귀속되고 국제의무 위반이 있으면 성립하며 반드시 고의를 요하지 않아요.", "prof": "정답은 2번이에요. 국가책임은 국제위법행위가 국가에 귀속되고 국제의무 위반이 있으면 성립하며 반드시 고의를 요하지 않아요. 사인의 행위도 국가가 통제하거나 지시한 경우 귀속될 수 있어요."}, {"id": "q147", "category": "국제기구·국제법", "difficulty": "중", "question": "유엔환경계획(UNEP)에 대한 설명으로 옳은 것은?", "choices": ["UN의 독립된 전문기구이다", "UN 안전보장이사회 산하의 기구이다", "1972년 스톡홀름 인간환경회의의 결과로 설립된 UN의 환경 관련 기구이다", "1992년 리우 정상회의의 결과로 설립되었다"], "answer": 3, "explanation": "UNEP은 1972년 스톡홀름 회의에서 설립이 결정된 총회 산하 계획으로, 독립된 전문기구가 아니에요.", "prof": "정답은 3번이에요. UNEP은 1972년 스톡홀름 회의에서 설립이 결정된 총회 산하 계획으로, 독립된 전문기구가 아니에요. 리우 정상회의는 1992년에 열렸어요."}, {"id": "q148", "category": "국제기구·국제법", "difficulty": "중", "question": "UN과 국제법 기구에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. UN 헌장 제51조는 무력공격이 발생한 경우 개별적 또는 집단적 자위권을 인정한다\nㄴ. 국제사법재판소는 네덜란드 헤이그에 소재한다\nㄷ. 경제사회이사회는 안전보장이사회 산하 기관이다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 1, "explanation": "경제사회이사회는 UN 헌장이 정한 독립된 주요 기관이지 안보리 산하 기관이 아니에요.", "prof": "정답은 1번이에요. 경제사회이사회는 UN 헌장이 정한 독립된 주요 기관이지 안보리 산하 기관이 아니에요. 제51조와 ICJ 소재지에 대한 서술은 정확해요."}, {"id": "q149", "category": "국제기구·국제법", "difficulty": "하", "question": "국제기구의 본부 소재지에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 세계무역기구(WTO)의 본부는 스위스 제네바에 있다\nㄴ. 국제통화기금(IMF)의 본부는 뉴욕에 있다\nㄷ. UN 본부는 미국 뉴욕에 있다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 2, "explanation": "IMF 본부는 미국 워싱턴 D.C.에 있어요.", "prof": "정답은 2번이에요. IMF 본부는 미국 워싱턴 D.C.에 있어요. WTO는 제네바, UN은 뉴욕에 본부가 있어요."}, {"id": "q150", "category": "국제기구·국제법", "difficulty": "하", "question": "UN 헌장이 규정한 UN의 주요 기관에 해당하지 않는 것은?", "choices": ["신탁통치이사회", "경제사회이사회", "국제사법재판소", "국제노동기구(ILO)"], "answer": 4, "explanation": "UN의 주요 기관은 총회, 안전보장이사회, 경제사회이사회, 신탁통치이사회, 국제사법재판소, 사무국이에요.", "prof": "정답은 4번이에요. UN의 주요 기관은 총회, 안전보장이사회, 경제사회이사회, 신탁통치이사회, 국제사법재판소, 사무국이에요. 국제노동기구는 UN 전문기구로 별도의 국제기구예요."}, {"id": "q151", "category": "국제정치사", "difficulty": "중", "question": "1648년 베스트팔렌 조약에 대한 설명으로 옳은 것은?", "choices": ["7년 전쟁을 종결시킨 조약이다", "국제연맹 창설의 근거가 되었다", "30년 전쟁을 종결시켰으며 이후 주권국가 중심 국제질서의 출발점으로 평가된다", "나폴레옹 전쟁 이후의 유럽 질서를 규정하였다"], "answer": 3, "explanation": "베스트팔렌 조약은 30년 전쟁의 결과물이에요.", "prof": "정답은 3번이에요. 베스트팔렌 조약은 30년 전쟁의 결과물이에요. 국가 주권과 영토 존중이라는 원칙의 상징으로 흔히 언급돼요. 다만 이 조약이 곧바로 근대 국가체제를 만들었다는 평가에는 비판도 있어요."}, {"id": "q152", "category": "국제정치사", "difficulty": "중", "question": "빈 체제(1815)에 대한 설명으로 옳은 것은?", "choices": ["미국과 일본이 주도한 아시아 질서이다", "민족주의와 자유주의의 확산을 적극 지원하였다", "30년 전쟁의 종결을 위해 수립되었다", "나폴레옹 전쟁 이후 보수적 질서 회복과 세력균형을 목표로 한 유럽협조체제를 형성하였다"], "answer": 4, "explanation": "빈 회의는 메테르니히가 주도하였고, 프랑스 혁명 이전의 정통성 회복과 세력균형을 지향했어요.", "prof": "정답은 4번이에요. 빈 회의는 메테르니히가 주도하였고, 프랑스 혁명 이전의 정통성 회복과 세력균형을 지향했어요. 이후 유럽협조체제로 불리는 강대국 협의 관행이 이어졌어요."}, {"id": "q153", "category": "국제정치사", "difficulty": "중", "question": "비스마르크 외교에 대한 설명으로 옳은 것은?", "choices": ["세계정책(Weltpolitik)을 추진하여 식민지 확장을 우선시하였다", "영국과의 해군 확장 경쟁을 주도하였다", "독일 통일 이후 동맹 체제를 통해 프랑스를 고립시키고 유럽의 현상 유지를 도모하였다", "삼국협상을 구축한 주역이다"], "answer": 3, "explanation": "비스마르크는 3제동맹과 독오동맹 등을 통해 프랑스를 고립시키려 했어요.", "prof": "정답은 3번이에요. 비스마르크는 3제동맹과 독오동맹 등을 통해 프랑스를 고립시키려 했어요. 세계정책은 빌헬름 2세 시기의 노선이고, 삼국협상은 독일에 대응해 형성되었어요."}, {"id": "q154", "category": "국제정치사", "difficulty": "중", "question": "제1차 세계대전의 발발에 대한 설명으로 옳은 것은?", "choices": ["1914년 사라예보 사건을 계기로 동맹 체제를 따라 전쟁이 확산되었다", "1905년 모로코 사건으로 직접 발발하였다", "1919년 베르사유 조약 이후 시작되었다", "미국의 참전으로 시작되었다"], "answer": 1, "explanation": "사라예보에서 오스트리아 황태자가 암살된 것이 직접 계기였어요.", "prof": "정답은 1번이에요. 사라예보에서 오스트리아 황태자가 암살된 것이 직접 계기였어요. 이는 복잡한 동맹과 군비경쟁이 얽혀 전쟁이 확대되는 사례로 자주 언급돼요."}, {"id": "q155", "category": "국제정치사", "difficulty": "상", "question": "윌슨의 14개조 평화원칙에 포함되지 않은 것은?", "choices": ["공개외교", "국제 평화기구 창설", "민족자결주의", "모든 식민지에 대한 즉각적인 독립 부여"], "answer": 4, "explanation": "윌슨은 공개외교, 항해의 자유, 군비 축소, 민족자결, 국제연맹 창설 등을 제안했어요.", "prof": "정답은 4번이에요. 윌슨은 공개외교, 항해의 자유, 군비 축소, 민족자결, 국제연맹 창설 등을 제안했어요. 모든 식민지의 즉각 독립은 포함되지 않았고 식민지 문제의 조정 정도만 언급했어요."}, {"id": "q156", "category": "국제정치사", "difficulty": "중", "question": "국제연맹에 대한 설명으로 옳은 것은?", "choices": ["미국이 주도하여 가입하였고 군사 강제력이 강했다", "제1차 세계대전 후 창설되었으나 미국이 가입하지 않았고 의사결정은 만장일치를 원칙으로 하였다", "제2차 세계대전 이후에 창설되었다", "안전보장이사회가 상임이사국의 거부권으로 운영되었다"], "answer": 2, "explanation": "연맹은 1920년에 출범했으나 미국 상원이 베르사유 조약을 비준하지 않아 미국이 불참했어요.", "prof": "정답은 2번이에요. 연맹은 1920년에 출범했으나 미국 상원이 베르사유 조약을 비준하지 않아 미국이 불참했어요. 집단안보의 이상을 구현하려 했지만 만장일치 원칙 등으로 실효성이 낮았다는 평가를 받아요."}, {"id": "q157", "category": "국제정치사", "difficulty": "상", "question": "제1차 대전 이후 질서에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 베르사유 조약은 독일에 전쟁책임 조항과 배상 의무를 부과하였다\nㄴ. 워싱턴 체제는 태평양 지역의 현상 유지와 해군력 제한을 규정하였다\nㄷ. 로카르노 조약은 서유럽의 국경 안정을 위한 협정이었다\nㄹ. 켈로그-브리앙 조약은 전쟁 수단 포기를 선언하여 실효성 있는 강제수단을 갖추었다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "켈로그-브리앙 조약은 전쟁의 포기를 선언했지만 위반에 대한 강제 장치가 없었어요.", "prof": "정답은 1번이에요. 켈로그-브리앙 조약은 전쟁의 포기를 선언했지만 위반에 대한 강제 장치가 없었어요. 그래서 ㄹ이 틀려요. 앞의 세 서술은 전간기 질서의 성격을 정확히 짚었어요."}, {"id": "q158", "category": "국제정치사", "difficulty": "중", "question": "전간기 위기에 대한 설명으로 옳은 것은?", "choices": ["1939년 독소불가침 조약은 독일과 소련이 군사동맹을 맺은 것이다", "1938년 뮌헨 협정은 독일의 팽창을 억제하는 데 성공하였다", "1931년 만주사변과 1935년 이탈리아의 에티오피아 침공은 국제연맹의 집단안보 한계를 드러냈다", "1930년대에는 국제연맹이 실효적 제재로 침략을 막아냈다"], "answer": 3, "explanation": "만주사변과 에티오피아 침공은 연맹의 대응이 미약했음을 보여주는 사례예요.", "prof": "정답은 3번이에요. 만주사변과 에티오피아 침공은 연맹의 대응이 미약했음을 보여주는 사례예요. 뮌헨 협정은 유화정책의 사례로 평가되고, 독소불가침 조약은 군사동맹이 아니에요."}, {"id": "q159", "category": "국제정치사", "difficulty": "중", "question": "제2차 세계대전 중의 연합국 회담에 대한 설명으로 옳은 것은?", "choices": ["포츠담 회담은 연합국이 독일에 항복하기 전에 열렸다", "카이로 선언은 한국의 독립을 적절한 시기에 보장한다는 내용을 포함하였다", "테헤란 회담은 UN 헌장을 채택하였다", "얄타 회담은 한국의 즉각 독립을 합의하였다"], "answer": 2, "explanation": "카이로 선언(1943)은 '적당한 시기에 한국을 자유독립시킬 것'을 명시했어요.", "prof": "정답은 2번이에요. 카이로 선언(1943)은 '적당한 시기에 한국을 자유독립시킬 것'을 명시했어요. 포츠담 선언은 카이로 선언의 이행을 재확인했어요."}, {"id": "q160", "category": "국제정치사", "difficulty": "중", "question": "브레턴우즈 체제와 전후 질서에 대한 설명으로 옳은 것은?", "choices": ["1944년 합의된 체제는 변동환율제를 채택하였다", "1944년 브레턴우즈 회의에서 WTO가 설립되었다", "브레턴우즈 체제는 소련이 주도하였다", "1944년 브레턴우즈 회의에서 IMF와 세계은행(IBRD) 설립이 합의되었다"], "answer": 4, "explanation": "브레턴우즈 회의는 IMF와 IBRD를 설립하고 달러를 금에 연동하는 고정환율 체제를 마련했어요.", "prof": "정답은 4번이에요. 브레턴우즈 회의는 IMF와 IBRD를 설립하고 달러를 금에 연동하는 고정환율 체제를 마련했어요. WTO는 1995년에 출범했어요."}, {"id": "q161", "category": "국제정치사", "difficulty": "중", "question": "냉전 초기의 정책에 대한 설명으로 옳은 것은?", "choices": ["바르샤바 조약기구는 1949년에 창설되었다", "NATO는 소련이 창설한 군사동맹이다", "마셜 플랜은 소련과 동유럽에 대한 군사 원조이다", "트루먼 독트린(1947)은 그리스와 터키에 대한 원조를 통해 공산주의 확산을 봉쇄하려 하였다"], "answer": 4, "explanation": "트루먼 독트린은 봉쇄정책의 출발점으로 평가돼요.", "prof": "정답은 4번이에요. 트루먼 독트린은 봉쇄정책의 출발점으로 평가돼요. 마셜 플랜은 서유럽 경제 재건 원조였고, 바르샤바 조약기구는 1955년에 창설되었어요."}, {"id": "q162", "category": "국제정치사", "difficulty": "상", "question": "조지 케넌의 '봉쇄' 구상에 대한 설명으로 옳은 것은?", "choices": ["소련과의 즉각적인 군사 충돌을 주장하였다", "1947년 'X'라는 필명으로 발표한 글에서 소련의 팽창에 대한 장기적이고 인내심 있는 봉쇄를 주장하였다", "소련과의 전면적 화해를 제안하였다", "전 세계에 걸친 군사적 봉쇄를 일관되게 주장하였다"], "answer": 2, "explanation": "케넌은 정치경제적 수단을 통한 봉쇄를 구상했어요.", "prof": "정답은 2번이에요. 케넌은 정치경제적 수단을 통한 봉쇄를 구상했어요. 이후 미국의 정책이 군사 중심으로 흐르자 이에 비판적이었다는 점도 언급돼요."}, {"id": "q163", "category": "국제정치사", "difficulty": "상", "question": "냉전기 주요 사건에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1948년 베를린 봉쇄는 서방의 공수작전(airlift)으로 대응되었다\nㄴ. 1950년 한국전쟁에 중국이 개입하였다\nㄷ. 1956년 헝가리 봉기는 소련군의 개입으로 진압되었다\nㄹ. 1962년 쿠바 미사일 위기는 소련이 미국과의 전쟁을 개시하는 것으로 끝났다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ"], "answer": 2, "explanation": "쿠바 미사일 위기는 협상으로 해결되었어요.", "prof": "정답은 2번이에요. 쿠바 미사일 위기는 협상으로 해결되었어요. 소련이 미사일을 철수하고 미국이 쿠바 침공을 하지 않기로 약속하였어요. 그래서 ㄹ이 틀려요."}, {"id": "q164", "category": "국제정치사", "difficulty": "중", "question": "쿠바 미사일 위기(1962)에 대한 설명으로 옳은 것은?", "choices": ["미국이 해상 봉쇄(격리)를 선언하고 소련이 미사일 철수를 합의하면서 위기가 해소되었다", "핵전쟁이 발발하여 미국이 승리하였다", "미국이 쿠바를 침공하여 종결되었다", "중국이 중재하여 합의하였다"], "answer": 1, "explanation": "케네디와 흐루쇼프의 협상으로 위기가 해소되었어요.", "prof": "정답은 1번이에요. 케네디와 흐루쇼프의 협상으로 위기가 해소되었어요. 이후 직통전화 설치와 부분적 핵실험 금지조약 등 긴장 완화 조치가 이어졌어요."}, {"id": "q165", "category": "국제정치사", "difficulty": "중", "question": "데탕트에 대한 설명으로 옳은 것은?", "choices": ["1980년대 초 레이건이 데탕트를 주도하였다", "1950년대에 쿠바 미사일 위기로 시작되었다", "1970년대 미소 간 긴장 완화로 SALT I과 ABM 조약이 체결되었다", "소련의 아프가니스탄 침공으로 데탕트가 더욱 강화되었다"], "answer": 3, "explanation": "1972년 닉슨과 브레즈네프가 SALT I과 ABM 조약에 서명했어요.", "prof": "정답은 3번이에요. 1972년 닉슨과 브레즈네프가 SALT I과 ABM 조약에 서명했어요. 소련의 아프가니스탄 침공(1979)은 데탕트의 쇠퇴 요인으로 평가돼요."}, {"id": "q166", "category": "국제정치사", "difficulty": "중", "question": "닉슨 독트린(1969)에 대한 설명으로 옳은 것은?", "choices": ["소련과의 군비경쟁을 확대한다는 선언이다", "아시아에서 미군을 전면 증강한다는 내용이다", "아시아 동맹국이 일차적으로 자국 방위를 책임지고 미국은 핵우산과 지원을 제공한다는 내용이다", "동맹국에 대한 모든 방위 공약을 철회한다는 선언이다"], "answer": 3, "explanation": "닉슨 독트린은 베트남전 이후 미국의 개입을 줄이는 방향이었어요.", "prof": "정답은 3번이에요. 닉슨 독트린은 베트남전 이후 미국의 개입을 줄이는 방향이었어요. 주한미군 감축으로 이어졌다는 점이 한국에 큰 영향을 주었어요."}, {"id": "q167", "category": "국제정치사", "difficulty": "중", "question": "미중 관계 개선에 대한 설명으로 옳은 것은?", "choices": ["1972년 닉슨의 중국 방문과 상하이 공동성명이 관계 개선의 계기가 되었고 1979년에 정식 수교하였다", "1972년에 정식 외교관계가 수립되었다", "1989년 천안문 사건 이후 수교하였다", "1950년 한국전쟁 직후에 미중이 정식 수교하였다"], "answer": 1, "explanation": "닉슨의 방중은 관계 정상화의 출발점이었고, 정식 수교는 카터 행정부 시기인 1979년에 이루어졌어요.", "prof": "정답은 1번이에요. 닉슨의 방중은 관계 정상화의 출발점이었고, 정식 수교는 카터 행정부 시기인 1979년에 이루어졌어요."}, {"id": "q168", "category": "국제정치사", "difficulty": "중", "question": "제3세계와 비동맹에 대한 설명으로 옳은 것은?", "choices": ["비동맹운동은 미국이 주도하였다", "비동맹운동은 NATO의 하위 조직이다", "반둥회의는 유럽 국가들이 주도하였다", "1955년 반둥회의는 아시아·아프리카 국가의 연대와 평화공존 원칙을 확인하였다"], "answer": 4, "explanation": "반둥회의는 이후 1961년 비동맹운동 출범으로 이어졌어요.", "prof": "정답은 4번이에요. 반둥회의는 이후 1961년 비동맹운동 출범으로 이어졌어요. 네루, 나세르, 티토, 수카르노 등이 주도했어요."}, {"id": "q169", "category": "국제정치사", "difficulty": "중", "question": "냉전기 국제정세에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 한국전쟁은 1950년에 발발하여 1953년 정전협정으로 휴전되었다\nㄴ. 1961년 베를린 장벽이 세워졌다\nㄷ. 1989년 베를린 장벽이 개방되었다\nㄹ. 1991년 소련이 해체되어 냉전이 공식적으로 종식되었다", "choices": ["1개", "2개", "3개", "4개"], "answer": 4, "explanation": "네 서술은 모두 정확해요.", "prof": "정답은 4번이에요. 네 서술은 모두 정확해요. 그래서 옳은 것은 4개예요. 시기가 겹치기 쉬운 사건이라 연도를 함께 암기해 두세요."}, {"id": "q170", "category": "국제정치사", "difficulty": "중", "question": "독일 통일에 대한 설명으로 옳은 것은?", "choices": ["통일 독일은 NATO 가입을 금지당하였다", "1991년 소련 해체 이후 통일되었다", "1990년 10월 3일 서독이 동독을 흡수하는 방식으로 통일되었고 '2+4 조약'이 국제적 조건을 정리하였다", "1989년에 통일 조약이 체결되었다"], "answer": 3, "explanation": "2+4 조약은 동서독과 미, 영, 프, 소가 체결했어요.", "prof": "정답은 3번이에요. 2+4 조약은 동서독과 미, 영, 프, 소가 체결했어요. 통일 독일은 NATO 회원국으로 남았어요."}, {"id": "q171", "category": "국제정치사", "difficulty": "중", "question": "소련 해체에 대한 설명으로 옳은 것은?", "choices": ["1989년에 소련이 해체되었다", "1991년 12월 소련이 해체되고 독립국가연합(CIS)이 형성되었다", "1985년 고르바초프의 취임과 함께 해체되었다", "소련은 해체 후 러시아 연방만 존속하였고 CIS는 형성되지 않았다"], "answer": 2, "explanation": "고르바초프의 개혁(페레스트로이카와 글라스노스트) 이후 1991년 말 해체되었어요.", "prof": "정답은 2번이에요. 고르바초프의 개혁(페레스트로이카와 글라스노스트) 이후 1991년 말 해체되었어요. 러시아는 소련의 국제법적 지위를 계승했어요."}, {"id": "q172", "category": "국제정치사", "difficulty": "중", "question": "탈냉전기 국제질서에 대한 설명으로 옳은 것은?", "choices": ["걸프전(1991)은 안보리 결의에 따라 다국적군이 이라크를 쿠웨이트에서 몰아낸 사례이다", "1991년 걸프전은 UN 승인 없이 미국이 단독으로 수행하였다", "1990년대에는 미국이 어떤 지역에도 개입하지 않았다", "2003년 이라크 전쟁은 안보리의 명시적 결의로 시작되었다"], "answer": 1, "explanation": "걸프전은 탈냉전기 집단안보가 작동한 사례로 평가돼요.", "prof": "정답은 1번이에요. 걸프전은 탈냉전기 집단안보가 작동한 사례로 평가돼요. 2003년 이라크 전쟁은 안보리의 명시적 승인 없이 이루어져 논란이 되었어요."}, {"id": "q173", "category": "국제정치사", "difficulty": "중", "question": "유럽통합에 대한 설명으로 옳은 것은?", "choices": ["1951년 유럽연합조약이 체결되었다", "1951년 유럽석탄철강공동체(ECSC)로 시작되어 1993년 마스트리히트 조약 발효로 EU가 출범하였다", "1957년 마스트리히트 조약으로 EU가 출범하였다", "EU는 1945년에 창설되었다"], "answer": 2, "explanation": "ECSC는 슈만 플랜에서 출발했어요.", "prof": "정답은 2번이에요. ECSC는 슈만 플랜에서 출발했어요. 1957년 로마조약으로 EEC가 설립되었고, 마스트리히트 조약(1992 서명, 1993 발효)으로 EU가 출범했어요."}, {"id": "q174", "category": "국제정치사", "difficulty": "중", "question": "9·11 테러(2001) 이후 국제정치에 대한 설명으로 옳은 것은?", "choices": ["미국은 '테러와의 전쟁'을 선언하고 2001년 아프가니스탄을 공격하였다", "NATO는 제5조를 한 번도 발동하지 않았다", "UN은 모든 군사행동을 금지하였다", "미국은 2001년 이라크를 먼저 공격하였다"], "answer": 1, "explanation": "NATO는 9·11 직후 사상 처음으로 제5조를 발동했어요.", "prof": "정답은 1번이에요. NATO는 9·11 직후 사상 처음으로 제5조를 발동했어요. 미국의 아프가니스탄 공격은 2001년 10월에 시작되었어요."}, {"id": "q175", "category": "국제정치사", "difficulty": "상", "question": "2008년 글로벌 금융위기 이후 국제질서에 대한 설명으로 옳은 것은?", "choices": ["G7이 정식 UN 기관으로 승격되었다", "WTO가 해체되었다", "G20이 정상회의로 격상되어 국제 경제 협력의 중심 협의체로 부상하였다", "IMF가 폐지되었다"], "answer": 3, "explanation": "금융위기 이후 2008년 워싱턴에서 G20 정상회의가 처음 열렸어요.", "prof": "정답은 3번이에요. 금융위기 이후 2008년 워싱턴에서 G20 정상회의가 처음 열렸어요. 2010년에는 서울에서 개최되었어요."}, {"id": "q176", "category": "국제정치사", "difficulty": "중", "question": "크림반도 병합(2014)에 대한 설명으로 옳은 것은?", "choices": ["국제사회가 이를 합법으로 인정하였다", "우크라이나가 러시아의 영토를 병합하였다", "러시아가 UN 안보리에서 제재를 받았다", "러시아가 우크라이나 크림반도를 병합하자 서방이 제재를 가하였고 러시아는 G8에서 배제되었다"], "answer": 4, "explanation": "러시아는 2014년 3월 병합을 선언했고 국제사회 다수가 불인정했어요.", "prof": "정답은 4번이에요. 러시아는 2014년 3월 병합을 선언했고 국제사회 다수가 불인정했어요. 러시아는 이후 G8 참여가 중단되었어요."}, {"id": "q177", "category": "국제정치사", "difficulty": "중", "question": "아시아 국제관계사에 대한 설명으로 옳은 것은?", "choices": ["1951년 조약으로 일본에 대한 점령이 강화되었다", "이 조약은 소련이 주도하였다", "1951년 샌프란시스코 강화조약은 일본의 주권 회복을 규정하였고 미일안보조약이 함께 체결되었다", "1951년 조약은 한국과 일본이 직접 체결하였다"], "answer": 3, "explanation": "샌프란시스코 강화조약은 1952년 발효하여 일본의 주권을 회복시켰어요.", "prof": "정답은 3번이에요. 샌프란시스코 강화조약은 1952년 발효하여 일본의 주권을 회복시켰어요. 한국은 연합국 지위를 인정받지 못해 서명국이 아니었어요."}, {"id": "q178", "category": "국제정치사", "difficulty": "중", "question": "국제정치사에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 유럽협조체제는 19세기 초 강대국 간 협의를 통해 질서를 유지하려 하였다\nㄴ. 제1차 세계대전은 1914년에 시작되어 1918년에 종결되었다\nㄷ. 제2차 세계대전은 1941년 일본의 진주만 공습으로 시작되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 2, "explanation": "제2차 세계대전은 1939년 독일의 폴란드 침공으로 시작되었어요.", "prof": "정답은 2번이에요. 제2차 세계대전은 1939년 독일의 폴란드 침공으로 시작되었어요. 진주만 공습(1941)은 미국의 참전을 이끈 사건이에요."}, {"id": "q179", "category": "국제정치사", "difficulty": "하", "question": "냉전기 사건에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 마셜 플랜은 서유럽 경제 재건을 위한 미국의 원조 계획이었다\nㄴ. 한국전쟁은 1950년에 발발하였다\nㄷ. 베트남전쟁은 1980년대에 종결되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 2, "explanation": "베트남전쟁은 1975년 사이공 함락으로 종결되었어요.", "prof": "정답은 2번이에요. 베트남전쟁은 1975년 사이공 함락으로 종결되었어요. 마셜 플랜과 한국전쟁에 대한 서술은 정확해요."}, {"id": "q180", "category": "국제정치사", "difficulty": "하", "question": "제2차 세계대전 직후 설립된 국제기구는?", "choices": ["국제연합(UN)", "국제연맹", "세계무역기구(WTO)", "유럽연합(EU)"], "answer": 1, "explanation": "UN은 1945년 10월에 공식 출범했어요.", "prof": "정답은 1번이에요. UN은 1945년 10월에 공식 출범했어요. 국제연맹은 제1차 세계대전 후, EU는 1993년, WTO는 1995년에 만들어졌어요."}, {"id": "q181", "category": "주요국 대외정책", "difficulty": "중", "question": "미국 외교정책의 전통에 대한 설명으로 옳은 것은?", "choices": ["먼로 독트린은 1945년 트루먼이 선언하였다", "먼로 독트린은 아시아 진출을 선언하였다", "먼로 독트린은 유럽과의 군사동맹을 체결하는 내용이었다", "먼로 독트린(1823)은 유럽의 서반구 간섭에 반대하고 미국의 유럽 문제 불개입을 표방하였다"], "answer": 4, "explanation": "먼로 독트린은 제임스 먼로 대통령이 1823년에 천명했어요.", "prof": "정답은 4번이에요. 먼로 독트린은 제임스 먼로 대통령이 1823년에 천명했어요. 이후 루스벨트 계론(1904) 등으로 변용되며 미국의 서반구 개입 논거로 쓰였어요."}, {"id": "q182", "category": "주요국 대외정책", "difficulty": "중", "question": "미국의 냉전기 대외정책에 대한 설명으로 옳은 것은?", "choices": ["닉슨 정부는 봉쇄를 폐기하고 소련과 전면전을 선언하였다", "케네디 정부는 대량보복전략을 새로 도입하였다", "트루먼 정부는 고립주의로 회귀하였다", "트루먼 정부는 봉쇄정책을 추진하였고 아이젠하워 정부는 대량보복전략을 채택하였다"], "answer": 4, "explanation": "아이젠하워 정부의 뉴룩 정책은 핵 억지에 크게 의존했어요.", "prof": "정답은 4번이에요. 아이젠하워 정부의 뉴룩 정책은 핵 억지에 크게 의존했어요. 케네디 정부는 이를 유연반응전략으로 대체했어요."}, {"id": "q183", "category": "주요국 대외정책", "difficulty": "중", "question": "미국의 대중 정책에 대한 설명으로 옳은 것은?", "choices": ["2010년대 후반 이후 미국은 중국을 전략적 경쟁자로 규정하고 무역과 기술 분야에서 경쟁을 강화하였다", "미국은 중국을 동맹국으로 규정하였다", "2018년 이후 미국은 중국에 대한 관세를 전면 폐지하였다", "미국은 중국과의 경제 교류를 전면 단절하였다"], "answer": 1, "explanation": "2017년 국가안보전략 이후 중국은 수정주의 세력으로 규정되었어요.", "prof": "정답은 1번이에요. 2017년 국가안보전략 이후 중국은 수정주의 세력으로 규정되었어요. 이후 관세와 수출통제를 중심으로 경쟁이 심화되었어요."}, {"id": "q184", "category": "주요국 대외정책", "difficulty": "상", "question": "미국의 인도·태평양 전략과 관련된 설명으로 옳은 것은?", "choices": ["쿼드는 미국, 중국, 일본, 한국이 참여한다", "쿼드는 NATO의 하위 조직이다", "쿼드(Quad)는 미국, 일본, 인도, 호주가 참여하는 협의체이다", "쿼드는 법적 구속력을 갖는 군사동맹이다"], "answer": 3, "explanation": "쿼드는 미·일·인·호의 안보 대화체로, 정식 군사동맹은 아니에요.", "prof": "정답은 3번이에요. 쿼드는 미·일·인·호의 안보 대화체로, 정식 군사동맹은 아니에요. 오커스(AUKUS)는 미국, 영국, 호주가 참여하는 3자 안보 파트너십이에요."}, {"id": "q185", "category": "주요국 대외정책", "difficulty": "중", "question": "중국의 대외정책에 대한 설명으로 옳은 것은?", "choices": ["덩샤오핑은 개혁개방 이후 도광양회를 대외정책의 기조로 삼았다", "위 설명이 모두 옳다", "1950년대 중국은 평화공존 5원칙을 제시하였다", "시진핑 집권 이후 중국은 일대일로를 제시하였다"], "answer": 3, "explanation": "평화공존 5원칙은 1954년 저우언라이와 네루가 공식화했어요.", "prof": "정답은 3번이에요. 평화공존 5원칙은 1954년 저우언라이와 네루가 공식화했어요. 도광양회는 힘을 숨기고 때를 기다린다는 기조이고, 시진핑 시기에는 일대일로(2013)와 같은 적극적 외교가 부각되었어요."}, {"id": "q186", "category": "주요국 대외정책", "difficulty": "중", "question": "중국의 일대일로(BRI)에 대한 설명으로 옳은 것은?", "choices": ["미국과 중국의 공동 프로젝트이다", "2013년 시진핑이 제안한 육상 및 해상 실크로드 구상으로 인프라 투자를 중심으로 한다", "2000년대 초 후진타오가 제안하였다", "군사동맹 체제로 규정되어 있다"], "answer": 2, "explanation": "일대일로는 육상 실크로드 경제벨트와 21세기 해상 실크로드를 합친 구상이에요.", "prof": "정답은 2번이에요. 일대일로는 육상 실크로드 경제벨트와 21세기 해상 실크로드를 합친 구상이에요. 채무 문제와 지정학적 영향력 확대에 대한 우려도 제기돼요."}, {"id": "q187", "category": "주요국 대외정책", "difficulty": "중", "question": "중국의 아시아인프라투자은행(AIIB)에 대한 설명으로 옳은 것은?", "choices": ["중국이 주도하여 2015년 말 공식 출범하였고 한국을 포함한 다수 국가가 참여하였다", "2015년 미국과 일본이 주도하여 설립되었다", "미국이 창립회원국으로 참여하였다", "AIIB는 군사협력 기구이다"], "answer": 1, "explanation": "AIIB는 중국 주도의 다자개발은행으로 2016년 1월 영업을 개시했어요.", "prof": "정답은 1번이에요. AIIB는 중국 주도의 다자개발은행으로 2016년 1월 영업을 개시했어요. 미국과 일본은 참여하지 않았어요."}, {"id": "q188", "category": "주요국 대외정책", "difficulty": "중", "question": "중국의 영토 및 해양 분쟁에 대한 설명으로 옳은 것은?", "choices": ["중재재판소는 중국의 주장을 전면 인정하였다", "ICJ가 2016년 남중국해 사건을 판결하였다", "중국은 중재재판 결과를 즉각 수용하였다", "2016년 남중국해 중재재판소는 중국의 구단선 주장에 대해 역사적 권원의 법적 근거가 없다고 판단하였다"], "answer": 4, "explanation": "필리핀이 제기한 사건에서 상설중재재판소가 판단했어요.", "prof": "정답은 4번이에요. 필리핀이 제기한 사건에서 상설중재재판소가 판단했어요. 중국은 이를 수용하지 않겠다고 밝혔어요."}, {"id": "q189", "category": "주요국 대외정책", "difficulty": "중", "question": "일본의 대외정책에 대한 설명으로 옳은 것은?", "choices": ["요시다 독트린은 소련과 동맹을 맺는 노선이었다", "요시다 독트린은 1990년대에 채택되었다", "요시다 독트린은 군사대국화를 목표로 하였다", "요시다 독트린은 경제 재건을 우선하고 안보는 미국에 의존하는 노선이었다"], "answer": 4, "explanation": "전후 일본은 평화헌법 아래 경무장·경제 중시 노선을 걸었어요.", "prof": "정답은 4번이에요. 전후 일본은 평화헌법 아래 경무장·경제 중시 노선을 걸었어요. 이후 점진적으로 안보 역할을 확대해 왔어요."}, {"id": "q190", "category": "주요국 대외정책", "difficulty": "상", "question": "일본의 안보 정책 변화에 대한 설명으로 옳은 것은?", "choices": ["일본은 자위대를 폐지하였다", "2014년 아베 내각은 헌법 해석을 변경하여 제한적인 집단적 자위권 행사를 용인하였다", "일본은 1990년대에 집단적 자위권을 전면 허용하였다", "2014년에 헌법 9조 개정이 이루어졌다"], "answer": 2, "explanation": "2014년의 각의 결정과 2015년의 안보법제 정비가 핵심이에요.", "prof": "정답은 2번이에요. 2014년의 각의 결정과 2015년의 안보법제 정비가 핵심이에요. 헌법 조문 자체는 개정되지 않았어요."}, {"id": "q191", "category": "주요국 대외정책", "difficulty": "중", "question": "한일 관계에 대한 설명으로 옳은 것은?", "choices": ["1965년에 일본이 식민지배의 불법성을 명시적으로 인정하였다", "1998년에 국교가 정상화되었다", "1965년 한일기본조약과 청구권 협정으로 국교가 정상화되었다", "1948년 정부 수립 직후 국교가 정상화되었다"], "answer": 3, "explanation": "국교 정상화는 박정희 정부 시기에 이루어졌어요.", "prof": "정답은 3번이에요. 국교 정상화는 박정희 정부 시기에 이루어졌어요. 식민지배의 합법·불법 문제에 대한 해석은 양국이 달랐어요."}, {"id": "q192", "category": "주요국 대외정책", "difficulty": "중", "question": "러시아의 대외정책에 대한 설명으로 옳은 것은?", "choices": ["푸틴 정부는 러시아의 영향권 회복과 다극 질서를 지향하며 NATO 확대에 반대해 왔다", "러시아는 1990년대에 EU 가입을 달성하였다", "푸틴 정부는 NATO 가입을 최우선 목표로 삼았다", "러시아는 BRICS에 가입한 적이 없다"], "answer": 1, "explanation": "러시아는 BRICS의 창설 멤버예요.", "prof": "정답은 1번이에요. 러시아는 BRICS의 창설 멤버예요. NATO 확대는 러시아가 안보 위협으로 간주하는 대표 사안이에요."}, {"id": "q193", "category": "주요국 대외정책", "difficulty": "상", "question": "러시아와 우크라이나 관련 설명으로 옳은 것은?", "choices": ["2022년 침공 당시 우크라이나는 NATO 회원국이었다", "2014년에 전면 침공이 개시되었다", "2022년 2월 러시아는 우크라이나에 대한 전면 침공을 개시하였다", "2022년 UN 총회는 침공을 규탄하는 결의를 채택하지 못하였다"], "answer": 3, "explanation": "2022년 3월 UN 총회는 압도적 다수로 침공을 규탄하는 결의를 채택했어요.", "prof": "정답은 3번이에요. 2022년 3월 UN 총회는 압도적 다수로 침공을 규탄하는 결의를 채택했어요. 우크라이나는 NATO 회원국이 아니에요."}, {"id": "q194", "category": "주요국 대외정책", "difficulty": "중", "question": "유럽연합(EU)의 대외정책에 대한 설명으로 옳은 것은?", "choices": ["EU 회원국은 외교정책 권한을 완전히 EU에 이양하였다", "EU는 공동외교안보정책(CFSP)을 운영하며 고위대표가 이를 총괄한다", "EU는 유럽연합조약에서 외교정책을 전면 배제하였다", "EU의 외교는 단일 군대를 통해서만 이루어진다"], "answer": 2, "explanation": "CFSP는 마스트리히트 조약으로 도입되었고 리스본 조약 이후 고위대표와 대외관계청(EEAS)이 운영돼요.", "prof": "정답은 2번이에요. CFSP는 마스트리히트 조약으로 도입되었고 리스본 조약 이후 고위대표와 대외관계청(EEAS)이 운영돼요. 외교정책은 여전히 회원국 협의가 중요해요."}, {"id": "q195", "category": "주요국 대외정책", "difficulty": "중", "question": "영국의 EU 탈퇴(브렉시트)에 대한 설명으로 옳은 것은?", "choices": ["2016년 국민투표 직후 즉시 탈퇴하였다", "2020년 영국은 EU 단일시장 안에 남았다", "영국은 유로존을 탈퇴하였다", "2016년 국민투표로 결정되어 2020년 1월 31일에 공식 탈퇴하였다"], "answer": 4, "explanation": "영국은 처음부터 유로화를 도입하지 않았어요.", "prof": "정답은 4번이에요. 영국은 처음부터 유로화를 도입하지 않았어요. 국민투표는 2016년 6월에 실시되었고 공식 탈퇴는 2020년 1월이에요."}, {"id": "q196", "category": "주요국 대외정책", "difficulty": "상", "question": "독일의 대외정책에 대한 설명으로 옳은 것은?", "choices": ["브란트의 동방정책은 동유럽 및 동독과의 관계 정상화를 통한 변화를 추구하였다", "독일은 중립을 선언하였다", "브란트의 동방정책은 동독 고립을 목표로 하였다", "독일은 냉전기에 NATO에 가입하지 않았다"], "answer": 1, "explanation": "동방정책은 '접근을 통한 변화'로 요약돼요.", "prof": "정답은 1번이에요. 동방정책은 '접근을 통한 변화'로 요약돼요. 이는 한국에서도 대북정책과 연관해 자주 논의되는 사례예요."}, {"id": "q197", "category": "주요국 대외정책", "difficulty": "중", "question": "프랑스의 외교에 대한 설명으로 옳은 것은?", "choices": ["프랑스는 1966년 NATO에서 완전히 탈퇴하였다", "드골은 1966년 NATO 통합군사령부에서 탈퇴하여 외교적 자율성을 추구하였다", "프랑스는 핵무기를 보유하지 않는다", "드골은 NATO에 가입하는 데 앞장섰다"], "answer": 2, "explanation": "프랑스는 NATO 회원국으로 남았지만 통합군사령부에서 탈퇴했어요.", "prof": "정답은 2번이에요. 프랑스는 NATO 회원국으로 남았지만 통합군사령부에서 탈퇴했어요. 2009년 사르코지 시기에 복귀했어요."}, {"id": "q198", "category": "주요국 대외정책", "difficulty": "중", "question": "인도의 외교정책에 대한 설명으로 옳은 것은?", "choices": ["냉전기 인도는 비동맹운동을 주도하였고 오늘날에는 다자 파트너십을 병행하는 전략적 자율성을 추구한다", "인도는 BRICS에 참여하지 않는다", "인도는 NPT에 가입한 핵보유국이다", "인도는 냉전기 미국과 동맹을 맺었다"], "answer": 1, "explanation": "인도는 1974년과 1998년 핵실험을 했고 NPT에는 가입하지 않았어요.", "prof": "정답은 1번이에요. 인도는 1974년과 1998년 핵실험을 했고 NPT에는 가입하지 않았어요. 쿼드와 BRICS에 모두 참여하고 있어요."}, {"id": "q199", "category": "주요국 대외정책", "difficulty": "중", "question": "한국 외교정책의 시기별 특징에 대한 설명으로 옳은 것은?", "choices": ["노태우 정부는 중국과 1972년에 수교하였다", "박정희 정부는 1990년에 소련과 수교하였다", "김대중 정부는 북방정책을 추진하였다", "노태우 정부는 북방정책으로 소련(1990), 중국(1992)과 수교하였다"], "answer": 4, "explanation": "북방정책은 탈냉전기에 공산권과 관계를 개선한 정책이에요.", "prof": "정답은 4번이에요. 북방정책은 탈냉전기에 공산권과 관계를 개선한 정책이에요. 한소 수교는 1990년, 한중 수교는 1992년에 이뤄졌어요."}, {"id": "q200", "category": "주요국 대외정책", "difficulty": "중", "question": "한국의 역대 정부 외교정책에 대한 설명으로 옳은 것은?", "choices": ["김대중 정부는 북한에 대한 제재 강화를 추진하였다", "김영삼 정부는 2000년 정상회담을 개최하였다", "김대중 정부는 햇볕정책으로 포용정책을 추진하고 2000년 남북정상회담을 개최하였다", "노무현 정부는 2000년 정상회담을 개최하였다"], "answer": 3, "explanation": "2000년 6·15 공동선언이 채택되었고, 2007년에는 노무현 정부에서 2차 정상회담이 열렸어요.", "prof": "정답은 3번이에요. 2000년 6·15 공동선언이 채택되었고, 2007년에는 노무현 정부에서 2차 정상회담이 열렸어요."}, {"id": "q201", "category": "주요국 대외정책", "difficulty": "상", "question": "한국의 대외정책 개념에 대한 설명으로 옳은 것은?", "choices": ["'균형자론'은 김영삼 정부가 제시하였다", "'균형자론'은 한미동맹 폐기를 주장한다", "'균형자론'은 노무현 정부가 제시한 동북아 균형자 구상을 가리킨다", "'균형자론'은 이명박 정부가 제시하였다"], "answer": 3, "explanation": "동북아 균형자론은 2005년 노무현 정부에서 제기되어 논란이 되었어요.", "prof": "정답은 3번이에요. 동북아 균형자론은 2005년 노무현 정부에서 제기되어 논란이 되었어요. 이명박 정부는 '글로벌 코리아', 박근혜 정부는 '신뢰프로세스'를 내세웠어요."}, {"id": "q202", "category": "주요국 대외정책", "difficulty": "중", "question": "한미동맹에 대한 설명으로 옳은 것은?", "choices": ["1953년 한미상호방위조약이 체결되어 1954년 발효하였다", "1950년에 한미상호방위조약이 체결되었다", "한미상호방위조약은 자동개입을 명시한다", "1960년대에 체결되었다"], "answer": 1, "explanation": "조약은 1953년 10월에 서명되었고 1954년 11월에 발효했어요.", "prof": "정답은 1번이에요. 조약은 1953년 10월에 서명되었고 1954년 11월에 발효했어요. 조약은 각자의 헌법 절차에 따라 행동한다는 방식이에요."}, {"id": "q203", "category": "주요국 대외정책", "difficulty": "중", "question": "한국과 주변국 관계에 대한 설명으로 옳은 것은?", "choices": ["한미 FTA는 2005년 발효되었다", "한미 FTA는 2012년에 발효되었고 한중 FTA는 2015년에 발효되었다", "한중 FTA는 2012년에 발효되었다", "한국은 일본과 FTA를 체결하였다"], "answer": 2, "explanation": "한미 FTA는 2012년 3월, 한중 FTA는 2015년 12월에 발효했어요.", "prof": "정답은 2번이에요. 한미 FTA는 2012년 3월, 한중 FTA는 2015년 12월에 발효했어요. 한일 FTA는 체결되지 않았어요."}, {"id": "q204", "category": "주요국 대외정책", "difficulty": "상", "question": "한국 외교사에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1965년 한일 국교 정상화는 베트남 파병 결정과 비슷한 시기에 추진되었다\nㄴ. 1991년 남북한은 UN에 동시 가입하였다\nㄷ. 2010년 한국은 G20 정상회의를 개최하였다\nㄹ. 1992년 한중 수교는 1990년 한소 수교보다 먼저 이루어졌다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ"], "answer": 1, "explanation": "한소 수교는 1990년, 한중 수교는 1992년이라 순서가 반대예요.", "prof": "정답은 1번이에요. 한소 수교는 1990년, 한중 수교는 1992년이라 순서가 반대예요. 그래서 ㄹ이 틀려요. 앞의 세 서술은 정확해요."}, {"id": "q205", "category": "주요국 대외정책", "difficulty": "중", "question": "한국의 대외정책에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 한국은 1996년 OECD에 가입하였다\nㄴ. 한국은 2010년 OECD 개발원조위원회(DAC)에 가입하였다\nㄷ. 한국은 1990년대에 NPT에서 탈퇴하였다\nㄹ. 한국은 2000년 ASEM을 서울에서 개최하였다", "choices": ["ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄷ"], "answer": 4, "explanation": "한국은 NPT 회원국으로 탈퇴한 적이 없어요.", "prof": "정답은 4번이에요. 한국은 NPT 회원국으로 탈퇴한 적이 없어요. 북한이 1993년 탈퇴를 선언했고 2003년 다시 탈퇴를 통보했어요. 그래서 ㄷ이 틀려요."}, {"id": "q206", "category": "주요국 대외정책", "difficulty": "상", "question": "동아시아 지역 협력에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. ASEAN은 1967년 방콕 선언으로 창설되었다\nㄴ. ASEAN+3은 ASEAN과 한국, 중국, 일본이 참여한다\nㄷ. APEC은 1989년에 출범하였다\nㄹ. 동아시아정상회의(EAS)에는 미국이 처음부터 참여하였다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "동아시아정상회의는 2005년 출범했고 미국과 러시아는 2011년부터 참여했어요.", "prof": "정답은 3번이에요. 동아시아정상회의는 2005년 출범했고 미국과 러시아는 2011년부터 참여했어요. 그래서 ㄹ이 틀리고 옳은 것은 3개예요."}, {"id": "q207", "category": "주요국 대외정책", "difficulty": "중", "question": "중국과 대만 관계에 대한 설명으로 옳은 것은?", "choices": ["대만은 UN 정회원국이다", "중국은 대만을 독립국으로 인정한다", "미국은 1979년 이후 대만과 정식 외교관계를 유지한다", "중국은 '하나의 중국' 원칙을 주장하며 대만 문제를 내정으로 규정한다"], "answer": 4, "explanation": "미국은 중국을 승인하며 대만과 비공식 관계를 이어가고 '대만관계법'을 두고 있어요.", "prof": "정답은 4번이에요. 미국은 중국을 승인하며 대만과 비공식 관계를 이어가고 '대만관계법'을 두고 있어요. 대만은 UN 회원국이 아니에요."}, {"id": "q208", "category": "주요국 대외정책", "difficulty": "중", "question": "BRICS에 대한 설명으로 옳은 것은?", "choices": ["BRICS는 NATO와 유사한 군사동맹이다", "브라질, 러시아, 인도, 중국, 남아프리카공화국 등 신흥국의 협의체로 확대되어 왔다", "BRICS는 유럽 국가들만으로 구성된다", "BRICS는 선진 7개국의 협의체이다"], "answer": 2, "explanation": "BRICS는 2009년 첫 정상회의를 열었고 이후 신개발은행(NDB) 등을 설립했어요.", "prof": "정답은 2번이에요. BRICS는 2009년 첫 정상회의를 열었고 이후 신개발은행(NDB) 등을 설립했어요. 회원국은 이후 확대되었어요."}, {"id": "q209", "category": "주요국 대외정책", "difficulty": "중", "question": "주요국 외교정책에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 먼로 독트린은 유럽의 서반구 간섭을 반대하였다\nㄴ. 드골은 프랑스를 NATO 통합군사령부에서 탈퇴시켰다\nㄷ. 일본은 2014년 헌법 9조를 개정하였다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ×"], "answer": 2, "explanation": "일본은 2014년 헌법 해석을 변경했고 조문을 개정하지는 않았어요.", "prof": "정답은 2번이에요. 일본은 2014년 헌법 해석을 변경했고 조문을 개정하지는 않았어요. 앞의 두 서술은 정확해요."}, {"id": "q210", "category": "주요국 대외정책", "difficulty": "하", "question": "한국과 주변국 수교에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 한일 수교는 1965년에 이루어졌다\nㄴ. 한중 수교는 1992년에 이루어졌다\nㄷ. 한소 수교는 1980년에 이루어졌다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 2, "explanation": "한소 수교는 1990년이에요.", "prof": "정답은 2번이에요. 한소 수교는 1990년이에요. 한일 수교와 한중 수교 연도는 정확해요."}, {"id": "q211", "category": "주요국 대외정책", "difficulty": "하", "question": "2013년 시진핑이 제시한 중국의 국제협력 구상은?", "choices": ["도광양회", "평화공존 5원칙", "일대일로", "양안관계 정상화"], "answer": 3, "explanation": "일대일로는 시진핑이 2013년 카자흐스탄과 인도네시아 방문 중 제시한 구상이에요.", "prof": "정답은 3번이에요. 일대일로는 시진핑이 2013년 카자흐스탄과 인도네시아 방문 중 제시한 구상이에요. 도광양회는 덩샤오핑 시기의 노선이에요."}, {"id": "q212", "category": "한반도·통일·북한", "difficulty": "중", "question": "1972년 7·4 남북공동성명에 대한 설명으로 옳은 것은?", "choices": ["자주, 평화, 민족대단결의 통일 3원칙에 합의하였다", "한반도 비핵화를 명시하였다", "남북한 UN 동시 가입을 합의하였다", "남북기본합의서와 함께 채택되었다"], "answer": 1, "explanation": "7·4 공동성명은 분단 이후 최초로 통일 원칙에 합의한 문서예요.", "prof": "정답은 1번이에요. 7·4 공동성명은 분단 이후 최초로 통일 원칙에 합의한 문서예요. 비핵화 공동선언은 1991년에 별도로 채택되었어요."}, {"id": "q213", "category": "한반도·통일·북한", "difficulty": "중", "question": "남북기본합의서(1991)에 대한 설명으로 옳은 것은?", "choices": ["한국이 단독으로 선포하였다", "북한의 핵 포기를 법적으로 강제하였다", "남북을 별개의 국가로 상호 인정하였다", "남북관계를 '나라와 나라 사이의 관계가 아닌 통일을 지향하는 과정에서 잠정적으로 형성되는 특수관계'로 규정하였다"], "answer": 4, "explanation": "남북기본합의서는 1991년 12월 채택되어 1992년 2월 발효했어요.", "prof": "정답은 4번이에요. 남북기본합의서는 1991년 12월 채택되어 1992년 2월 발효했어요. 상호 체제 인정과 불가침, 교류·협력을 담았어요."}, {"id": "q214", "category": "한반도·통일·북한", "difficulty": "중", "question": "한반도 비핵화 공동선언(1991)에 대한 설명으로 옳은 것은?", "choices": ["한국이 핵우산을 폐기한다는 내용이었다", "남북이 핵무기 공동 보유에 합의하였다", "남북이 핵무기의 시험, 제조, 생산, 접수, 보유, 저장, 배비, 사용을 하지 않기로 하였고 핵재처리 및 우라늄 농축시설을 보유하지 않기로 하였다", "북한이 우라늄 농축을 허용한다는 내용이었다"], "answer": 3, "explanation": "이 선언은 1992년 2월 발효했어요.", "prof": "정답은 3번이에요. 이 선언은 1992년 2월 발효했어요. 이후 북핵 문제가 불거지면서 사실상 이행되지 못했어요."}, {"id": "q215", "category": "한반도·통일·북한", "difficulty": "중", "question": "북한의 핵 문제에 대한 설명으로 옳은 것은?", "choices": ["2003년 북한은 NPT에 재가입하였다", "제네바 합의는 북한의 즉각적인 핵폐기를 규정하였다", "1994년 제네바 합의는 6자회담에서 체결되었다", "1993년 북한이 NPT 탈퇴를 선언하였다가 유보하였고 1994년 제네바 합의가 체결되었다"], "answer": 4, "explanation": "제네바 합의는 북미 양자 협상의 결과로, 경수로 제공과 중유 공급을 대가로 핵 동결을 규정했어요.", "prof": "정답은 4번이에요. 제네바 합의는 북미 양자 협상의 결과로, 경수로 제공과 중유 공급을 대가로 핵 동결을 규정했어요. 6자회담은 2003년에 시작되었어요."}, {"id": "q216", "category": "한반도·통일·북한", "difficulty": "상", "question": "6자회담에 대한 설명으로 옳은 것은?", "choices": ["2003년 시작되었고 한국, 북한, 미국, 중국, 일본, 러시아가 참여하였다", "2003년 시작되었고 한국, 미국, 일본, 중국, 러시아, 프랑스가 참여하였다", "1994년에 시작되었다", "UN이 의장을 맡았다"], "answer": 1, "explanation": "6자회담은 베이징에서 열렸어요.", "prof": "정답은 1번이에요. 6자회담은 베이징에서 열렸어요. 2005년 9·19 공동성명에서 북한의 핵 포기와 관계 정상화 등을 합의했어요."}, {"id": "q217", "category": "한반도·통일·북한", "difficulty": "중", "question": "9·19 공동성명(2005)에 대한 설명으로 옳은 것은?", "choices": ["북미가 군사동맹을 체결하였다", "북한이 모든 핵무기와 기존 핵계획을 포기하고 NPT와 IAEA 안전조치에 복귀하겠다고 공약하였다", "이 성명은 2018년에 발표되었다", "북한이 핵무기 보유를 공식 인정받았다"], "answer": 2, "explanation": "9·19 공동성명은 북한의 핵 포기와 관계 정상화, 경제협력, 평화체제 협상을 포괄했어요.", "prof": "정답은 2번이에요. 9·19 공동성명은 북한의 핵 포기와 관계 정상화, 경제협력, 평화체제 협상을 포괄했어요. 이후 BDA 문제 등으로 이행에 난항을 겪었어요."}, {"id": "q218", "category": "한반도·통일·북한", "difficulty": "중", "question": "북한의 핵실험에 대한 설명으로 옳은 것은?", "choices": ["북한은 2020년 제6차 핵실험을 실시하였다", "북한은 2006년 이전에 핵실험을 한 적이 있다", "북한은 1994년 제1차 핵실험을 실시하였다", "북한은 2006년 10월 제1차 핵실험을 실시하였고 이후 2017년까지 모두 여섯 차례 실시하였다"], "answer": 4, "explanation": "핵실험은 2006, 2009, 2013, 2016(1월과 9월), 2017년에 있었어요.", "prof": "정답은 4번이에요. 핵실험은 2006, 2009, 2013, 2016(1월과 9월), 2017년에 있었어요. 1994년은 제네바 합의가 체결된 해예요."}, {"id": "q219", "category": "한반도·통일·북한", "difficulty": "상", "question": "UN 안보리의 대북 제재에 대한 설명으로 옳은 것은?", "choices": ["안보리는 대북 제재를 2017년 이후 전면 해제하였다", "안보리는 2006년 이전에 대북 제재를 시작하였다", "안보리는 2006년 결의 1718호 이후 대북 제재를 강화해 왔다", "안보리 결의에는 중국이 모두 거부권을 행사하였다"], "answer": 3, "explanation": "1718호는 2006년 첫 핵실험에 대한 결의예요.", "prof": "정답은 3번이에요. 1718호는 2006년 첫 핵실험에 대한 결의예요. 2017년에는 2375호와 2397호가 채택되며 정유 제품 공급 제한 등이 강화됐어요."}, {"id": "q220", "category": "한반도·통일·북한", "difficulty": "중", "question": "2000년 6·15 남북공동선언에 대한 설명으로 옳은 것은?", "choices": ["통일 문제의 자주적 해결과 남측의 연합제와 북측의 낮은 단계의 연방제 공통성 인정 등을 합의하였다", "2000년 이전에 합의되었다", "남북이 핵 폐기에 합의하였다", "남북이 평화협정 체결에 합의하였다"], "answer": 1, "explanation": "6·15 공동선언은 김대중 대통령과 김정일 국방위원장이 평양에서 합의했어요.", "prof": "정답은 1번이에요. 6·15 공동선언은 김대중 대통령과 김정일 국방위원장이 평양에서 합의했어요. 이후 이산가족 상봉과 경제협력이 이어졌어요."}, {"id": "q221", "category": "한반도·통일·북한", "difficulty": "중", "question": "2007년 10·4 남북정상선언에 대한 설명으로 옳은 것은?", "choices": ["한반도 비핵화를 전면 폐기하였다", "서해 평화협력특별지대 구상을 명시적으로 배제하였다", "서해 평화협력특별지대 설치와 경제협력 확대 등을 포함하였다", "김대중과 김정일이 합의하였다"], "answer": 3, "explanation": "10·4 선언은 노무현 대통령과 김정일 국방위원장이 2007년 평양에서 채택했어요.", "prof": "정답은 3번이에요. 10·4 선언은 노무현 대통령과 김정일 국방위원장이 2007년 평양에서 채택했어요. 서해평화협력특별지대와 개성공단 확대 등이 담겼어요."}, {"id": "q222", "category": "한반도·통일·북한", "difficulty": "중", "question": "개성공단에 대한 설명으로 옳은 것은?", "choices": ["2010년 이후 확대 개편되었다", "2004년 시험 가동되어 2016년 2월 폐쇄되었다", "2000년에 처음 가동되었다", "2018년 이후 완전 재가동되었다"], "answer": 2, "explanation": "개성공단은 남북 경제협력의 상징이었어요.", "prof": "정답은 2번이에요. 개성공단은 남북 경제협력의 상징이었어요. 2016년 북한의 핵실험과 미사일 발사 이후 한국 정부가 전면 중단했어요."}, {"id": "q223", "category": "한반도·통일·북한", "difficulty": "중", "question": "금강산 관광에 대한 설명으로 옳은 것은?", "choices": ["1998년 시작되었으나 2008년 관광객 피격 사건 이후 중단되었다", "1989년에 시작되었다", "2018년 전면 재개되었다", "2000년대 후반에 처음 시작되었다"], "answer": 1, "explanation": "금강산 관광은 현대아산이 주도했어요.", "prof": "정답은 1번이에요. 금강산 관광은 현대아산이 주도했어요. 2008년 7월 관광객 피격 사건 이후 중단되었고 이후 재개되지 못했어요."}, {"id": "q224", "category": "한반도·통일·북한", "difficulty": "중", "question": "2018년 남북 및 북미 관계에 대한 설명으로 옳은 것은?", "choices": ["북미 정상회담은 판문점에서 처음 열렸다", "1월 판문점 선언이 채택되었다", "2018년 하노이에서 정상회담이 열렸다", "4월 판문점 선언이 채택되었고 6월 싱가포르에서 북미 정상회담이 열렸다"], "answer": 4, "explanation": "하노이 북미 정상회담은 2019년 2월에 열렸으나 합의 없이 종료되었어요.", "prof": "정답은 4번이에요. 하노이 북미 정상회담은 2019년 2월에 열렸으나 합의 없이 종료되었어요. 9월에는 평양공동선언과 군사 분야 합의서가 채택되었어요."}, {"id": "q225", "category": "한반도·통일·북한", "difficulty": "상", "question": "2018년 9·19 남북 군사합의에 대한 설명으로 옳은 것은?", "choices": ["2018년 4월에 채택되었다", "남북이 군사동맹을 체결하였다", "한반도 비핵화를 규정하였다", "군사분계선 일대에서의 적대행위 중단과 비행금지구역 설정 등을 담았다"], "answer": 4, "explanation": "9·19 군사합의는 평양공동선언의 부속합의서예요.", "prof": "정답은 4번이에요. 9·19 군사합의는 평양공동선언의 부속합의서예요. 이후 효력을 둘러싸고 논란이 있었어요."}, {"id": "q226", "category": "한반도·통일·북한", "difficulty": "중", "question": "한반도 평화체제에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 1953년 정전협정은 유엔군사령관, 조선인민군 최고사령관, 중국인민지원군 사령원이 서명하였다\nㄴ. 정전협정에는 한국 정부 대표가 서명자로 포함되어 있지 않다\nㄷ. 군사정전위원회와 중립국감독위원회가 정전체제를 관리하도록 규정되었다\nㄹ. 정전협정은 평화협정으로 이미 대체되었다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "정전협정은 평화협정으로 대체되지 않았고 법적으로는 여전히 정전 상태예요.", "prof": "정답은 1번이에요. 정전협정은 평화협정으로 대체되지 않았고 법적으로는 여전히 정전 상태예요. 그래서 ㄹ이 틀려요."}, {"id": "q227", "category": "한반도·통일·북한", "difficulty": "중", "question": "북한의 '주체사상'과 체제에 대한 설명으로 옳은 것은?", "choices": ["김일성은 1956년에 주체사상을 폐기하였다", "1972년 사회주의 헌법에서 주체사상이 국가의 지도이념으로 공식화되었다", "1948년 정부 수립과 함께 주체사상이 헌법에 명시되었다", "주체사상은 소련에서 도입되었다"], "answer": 2, "explanation": "1955년 김일성의 연설에서 주체가 제기되었고 1972년 헌법에서 공식화되었어요.", "prof": "정답은 2번이에요. 1955년 김일성의 연설에서 주체가 제기되었고 1972년 헌법에서 공식화되었어요. 이후 김정일 시기에는 선군정치가 강조되었어요."}, {"id": "q228", "category": "한반도·통일·북한", "difficulty": "중", "question": "김정일 시기 북한에 대한 설명으로 옳은 것은?", "choices": ["김정일 시기에 북한은 NPT에 재가입하였다", "김정일은 2000년대 초에 사망하였다", "선군정치를 표방하고 군을 국정 운영의 핵심으로 삼았다", "김정일 시기에 개혁개방과 시장화를 공식 노선으로 채택하였다"], "answer": 3, "explanation": "선군정치는 1990년대 후반 '고난의 행군' 시기를 거치며 강조되었어요.", "prof": "정답은 3번이에요. 선군정치는 1990년대 후반 '고난의 행군' 시기를 거치며 강조되었어요. 김정일은 2011년 12월에 사망했고 김정은이 후계했어요."}, {"id": "q229", "category": "한반도·통일·북한", "difficulty": "상", "question": "북한의 '두 국가론'에 대한 설명으로 옳은 것은?", "choices": ["한국이 제안한 통일 방안이다", "2023년 말 이후 북한이 남북을 '적대적 두 국가' 관계로 규정하며 통일 담론을 폐기한 입장이다", "2000년대 초 채택된 남북 합의의 핵심이다", "김일성 시대의 통일 정책의 연장이다"], "answer": 2, "explanation": "북한은 2023년 12월 전원회의와 2024년 초 최고인민회의 연설 등을 통해 이를 공식화했어요.", "prof": "정답은 2번이에요. 북한은 2023년 12월 전원회의와 2024년 초 최고인민회의 연설 등을 통해 이를 공식화했어요. 이후 통일 관련 기구와 상징물을 정리하는 조치가 이어졌어요."}, {"id": "q230", "category": "한반도·통일·북한", "difficulty": "중", "question": "한국의 통일 방안에 대한 설명으로 옳은 것은?", "choices": ["1970년대에 민족공동체통일방안이 처음 제시되었다", "1972년 7·4 공동성명이 통일 방안이다", "1960년대에 연합제 통일 방안이 처음 제시되었다", "1989년 한민족공동체통일방안이 제시되었고 1994년 민족공동체통일방안으로 발전하였다"], "answer": 4, "explanation": "1989년 노태우 정부가 한민족공동체통일방안을 발표했고 1994년 김영삼 정부가 이를 보완해 민족공동체통일방안으로 정리했어요.", "prof": "정답은 4번이에요. 1989년 노태우 정부가 한민족공동체통일방안을 발표했고 1994년 김영삼 정부가 이를 보완해 민족공동체통일방안으로 정리했어요. 화해협력, 남북연합, 통일국가 3단계 구조예요."}, {"id": "q231", "category": "한반도·통일·북한", "difficulty": "상", "question": "북한의 통일 방안에 대한 설명으로 옳은 것은?", "choices": ["1948년 고려연방제를 제안하였다", "1960년대에 낮은 단계 연방제를 제안하였다", "1980년 고려민주연방공화국 창립방안을 제시하였다", "2000년에 연방제를 완전히 폐기하였다"], "answer": 3, "explanation": "1980년 제6차 당대회에서 김일성이 고려민주연방공화국 방안을 제시했어요.", "prof": "정답은 3번이에요. 1980년 제6차 당대회에서 김일성이 고려민주연방공화국 방안을 제시했어요. 1991년에는 '느슨한 연방제'를 언급했고 이후 '낮은 단계의 연방제'로 이어졌어요."}, {"id": "q232", "category": "한반도·통일·북한", "difficulty": "중", "question": "독일 통일 사례가 한반도에 주는 시사점으로 옳은 것은?", "choices": ["서독의 동방정책과 경제 지원이 통일의 우호적 환경 조성에 기여하였다는 점이 자주 논의된다", "독일 통일은 동독이 서독을 흡수한 방식이다", "독일 통일은 무력에 의해 달성되었다", "독일 통일은 두 국가 체제의 영구 인정에서 비롯되었다"], "answer": 1, "explanation": "독일 통일은 동독이 서독 기본법에 편입되는 방식으로 이루어졌어요.", "prof": "정답은 1번이에요. 독일 통일은 동독이 서독 기본법에 편입되는 방식으로 이루어졌어요. 이를 흡수통일로 평가하며, 한반도에 그대로 적용하기에는 조건이 다르다는 의견도 많아요."}, {"id": "q233", "category": "한반도·통일·북한", "difficulty": "중", "question": "북한이탈주민에 대한 설명으로 옳은 것은?", "choices": ["2008년 이후 북한이탈주민 입국이 금지되었다", "1997년 북한이탈주민의 보호 및 정착지원에 관한 법률이 제정되었고 이후 하나원이 설립되었다", "북한이탈주민은 한국에서 정착 지원을 받을 수 없다", "하나원은 1999년에 폐쇄되었다"], "answer": 2, "explanation": "하나원(북한이탈주민정착지원사무소)은 1999년 설립되었어요.", "prof": "정답은 2번이에요. 하나원(북한이탈주민정착지원사무소)은 1999년 설립되었어요. 입국 이후 일정 기간 사회 적응 교육을 받아요."}, {"id": "q234", "category": "한반도·통일·북한", "difficulty": "중", "question": "이산가족 문제에 대한 설명으로 옳은 것은?", "choices": ["1985년에 이산가족 고향방문단과 예술공연단이 교환되었고 2000년 이후 상봉이 정례화되었다", "1972년 이산가족 상봉이 정례화되었다", "2018년에 처음으로 이산가족 상봉이 시작되었다", "2010년 이후 이산가족 상봉이 전면 재개되었다"], "answer": 1, "explanation": "이산가족 상봉은 1985년 최초로 이루어졌어요.", "prof": "정답은 1번이에요. 이산가족 상봉은 1985년 최초로 이루어졌어요. 2000년대에 정례화되었으나 정치 상황에 따라 중단되기도 했어요."}, {"id": "q235", "category": "한반도·통일·북한", "difficulty": "상", "question": "북한 핵 관련 국제 협상에 대한 설명으로 옳은 것은?", "choices": ["2012년 합의는 6자회담에서 체결되었다", "2012년 합의는 한국이 체결하였다", "2012년 2·29 북미합의는 핵 및 미사일 활동 유예와 영양 지원 등을 담았으나 곧 무산되었다", "2012년 합의로 북한이 핵 폐기를 이행하였다"], "answer": 3, "explanation": "2·29 합의 직후 북한이 장거리 로켓 발사를 강행하면서 무산되었어요.", "prof": "정답은 3번이에요. 2·29 합의 직후 북한이 장거리 로켓 발사를 강행하면서 무산되었어요."}, {"id": "q236", "category": "한반도·통일·북한", "difficulty": "중", "question": "한반도 신뢰 형성 및 평화 구상에 대한 설명으로 옳은 것은?", "choices": ["이명박 정부는 신뢰프로세스를 제시하였다", "김대중 정부는 비핵·개방·3000을 제시하였다", "노무현 정부는 드레스덴 구상을 제시하였다", "박근혜 정부는 한반도 신뢰프로세스와 드레스덴 구상을 제시하였다"], "answer": 4, "explanation": "비핵·개방·3000은 이명박 정부의 대북정책 구상이에요.", "prof": "정답은 4번이에요. 비핵·개방·3000은 이명박 정부의 대북정책 구상이에요. 문재인 정부는 한반도 운전자론과 신한반도체제를 제시했어요."}, {"id": "q237", "category": "한반도·통일·북한", "difficulty": "상", "question": "한반도 안보 환경에 대한 설명으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 2010년 천안함 피격 사건과 연평도 포격 사건이 발생하였다\nㄴ. 2016년 한국과 미국은 사드(THAAD) 배치를 결정하였다\nㄷ. 한국은 한미 연합훈련을 매년 실시해 왔다\nㄹ. 한국은 핵무기를 보유한 국가이다", "choices": ["ㄱ, ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "answer": 1, "explanation": "한국은 NPT 가입국으로서 핵무기를 보유하지 않아요.", "prof": "정답은 1번이에요. 한국은 NPT 가입국으로서 핵무기를 보유하지 않아요. 그래서 ㄹ이 틀려요. 앞의 세 서술은 한반도 안보 환경의 주요 사실이에요."}, {"id": "q238", "category": "한반도·통일·북한", "difficulty": "상", "question": "사드(THAAD) 배치 문제에 대한 설명으로 옳은 것은?", "choices": ["사드 배치는 중국이 요청하였다", "사드는 2010년에 이미 배치되었다", "사드는 한국이 개발한 방어체계이다", "2016년 배치 결정 이후 중국이 경제적 보복 조치를 취하면서 한중관계가 악화되었다"], "answer": 4, "explanation": "사드는 미국의 종말단계 고고도 요격체계예요.", "prof": "정답은 4번이에요. 사드는 미국의 종말단계 고고도 요격체계예요. 2017년 한국은 '3불' 입장을 표명하며 관계를 조정했어요."}, {"id": "q239", "category": "한반도·통일·북한", "difficulty": "중", "question": "한미 방위비 분담 협정에 대한 설명으로 옳은 것은?", "choices": ["SMA는 한국과 일본이 체결하는 협정이다", "한국은 주한미군 주둔 비용 일부를 부담하며 협정은 SMA라 불린다", "한국은 주한미군 주둔 비용을 전혀 부담하지 않는다", "SMA는 1966년에 체결된 한미 상호방위조약이다"], "answer": 2, "explanation": "SMA는 특별조치협정(Special Measures Agreement)의 약자로 1991년 이후 체결되어 왔어요.", "prof": "정답은 2번이에요. SMA는 특별조치협정(Special Measures Agreement)의 약자로 1991년 이후 체결되어 왔어요."}, {"id": "q240", "category": "한반도·통일·북한", "difficulty": "중", "question": "한반도 관련 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 1991년 남북한은 UN에 동시 가입하였다\nㄴ. 1994년 제네바 합의는 6자회담 결과이다\nㄷ. 2018년 북미 정상회담은 싱가포르에서 처음 열렸다", "choices": ["ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 1, "explanation": "제네바 합의는 북미 양자 협상의 결과이고 6자회담은 2003년에 시작되었어요.", "prof": "정답은 1번이에요. 제네바 합의는 북미 양자 협상의 결과이고 6자회담은 2003년에 시작되었어요. 나머지 두 서술은 정확해요."}, {"id": "q241", "category": "한반도·통일·북한", "difficulty": "하", "question": "한반도 관련 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 6·15 공동선언은 2000년에 채택되었다\nㄴ. 10·4 선언은 노무현 정부 시기에 채택되었다\nㄷ. 판문점 선언은 2007년에 채택되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 1, "explanation": "판문점 선언은 2018년 4월에 채택되었어요.", "prof": "정답은 1번이에요. 판문점 선언은 2018년 4월에 채택되었어요. 6·15 선언은 2000년, 10·4 선언은 2007년이에요."}, {"id": "q242", "category": "한반도·통일·북한", "difficulty": "하", "question": "한반도 정전협정이 체결된 해는?", "choices": ["1950년", "1960년", "1953년", "1948년"], "answer": 3, "explanation": "한국전쟁은 1950년에 발발해 1953년 7월 27일 정전협정으로 휴전되었어요.", "prof": "정답은 3번이에요. 한국전쟁은 1950년에 발발해 1953년 7월 27일 정전협정으로 휴전되었어요."}, {"id": "q243", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "이스라엘-아랍 분쟁의 전개에 대한 설명으로 옳은 것은?", "choices": ["1967년 6일 전쟁에서 이스라엘이 패배하였다", "1973년 제4차 중동전쟁은 1948년에 발발하였다", "1948년 UN이 이스라엘 건국을 금지하였다", "1948년 이스라엘 건국 직후 제1차 중동전쟁이 발발하였고 1967년 6일 전쟁에서 이스라엘이 동예루살렘과 서안지구, 가자지구를 점령하였다"], "answer": 4, "explanation": "6일 전쟁에서 이스라엘은 시나이 반도와 골란고원도 점령했어요.", "prof": "정답은 4번이에요. 6일 전쟁에서 이스라엘은 시나이 반도와 골란고원도 점령했어요. 이후 안보리 결의 242호가 점령지 철수와 평화를 연계하는 틀이 되었어요."}, {"id": "q244", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "캠프 데이비드 협정(1978)과 이집트-이스라엘 평화조약(1979)에 대한 설명으로 옳은 것은?", "choices": ["이스라엘이 가자지구에서 철수하였다", "요르단이 최초로 이스라엘과 평화조약을 체결하였다", "이집트가 아랍 국가 가운데 최초로 이스라엘을 승인하였고 이스라엘은 시나이 반도에서 철수하였다", "이집트와 이스라엘이 군사동맹을 체결하였다"], "answer": 3, "explanation": "카터 대통령의 중재로 사다트와 베긴이 합의했어요.", "prof": "정답은 3번이에요. 카터 대통령의 중재로 사다트와 베긴이 합의했어요. 이집트는 이 때문에 한동안 아랍연맹에서 자격이 정지되었어요."}, {"id": "q245", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "오슬로 협정(1993)에 대한 설명으로 옳은 것은?", "choices": ["이스라엘과 하마스가 최종 지위 문제를 해결하였다", "이스라엘과 팔레스타인해방기구(PLO)가 상호 승인하고 팔레스타인 자치정부 수립의 틀을 마련하였다", "이집트와 이스라엘이 평화조약을 체결하였다", "팔레스타인이 UN 정회원국이 되었다"], "answer": 2, "explanation": "오슬로 합의는 라빈과 아라파트가 서명했어요.", "prof": "정답은 2번이에요. 오슬로 합의는 라빈과 아라파트가 서명했어요. 예루살렘, 난민, 정착촌, 국경 문제는 최종 협상 대상으로 남겨졌어요."}, {"id": "q246", "category": "중동·유럽·분쟁 지역", "difficulty": "상", "question": "아브라함 협정(2020)에 대한 설명으로 옳은 것은?", "choices": ["이란과 이스라엘의 합의이다", "이집트와 이스라엘의 평화조약을 말한다", "아랍에미리트와 바레인이 이스라엘과 관계를 정상화한 합의이다", "사우디아라비아와 이스라엘이 동맹을 체결한 것이다"], "answer": 3, "explanation": "2020년 미국의 중재로 UAE와 바레인이 이스라엘과 정상화에 합의했고 이후 모로코와 수단도 합류했어요.", "prof": "정답은 3번이에요. 2020년 미국의 중재로 UAE와 바레인이 이스라엘과 정상화에 합의했고 이후 모로코와 수단도 합류했어요."}, {"id": "q247", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "이란 핵 문제에 대한 설명으로 옳은 것은?", "choices": ["JCPOA는 미국과 이란 양국만 체결하였다", "2015년 포괄적 공동행동계획(JCPOA)이 체결되었고 2018년 미국이 이를 탈퇴하였다", "JCPOA는 2005년에 체결되었다", "2018년 이란이 JCPOA에서 먼저 탈퇴하였다"], "answer": 2, "explanation": "JCPOA는 P5+1(미국, 영국, 프랑스, 중국, 러시아, 독일)과 이란이 체결했고 미국은 트럼프 행정부 때 탈퇴했어요.", "prof": "정답은 2번이에요. JCPOA는 P5+1(미국, 영국, 프랑스, 중국, 러시아, 독일)과 이란이 체결했고 미국은 트럼프 행정부 때 탈퇴했어요."}, {"id": "q248", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "이라크 전쟁(2003)에 대한 설명으로 옳은 것은?", "choices": ["안보리가 명시적으로 무력 사용을 승인하였다", "이라크가 쿠웨이트를 침공하여 시작되었다", "전쟁은 2013년에 시작되었다", "미국과 영국 등이 대량살상무기 보유 의혹을 이유로 이라크를 공격하였고 이후 대량살상무기는 발견되지 않았다"], "answer": 4, "explanation": "이라크 전쟁은 안보리 승인 없이 시작되어 합법성 논란이 있었어요.", "prof": "정답은 4번이에요. 이라크 전쟁은 안보리 승인 없이 시작되어 합법성 논란이 있었어요. 이후 이라크의 불안정과 종파 갈등이 심화되었어요."}, {"id": "q249", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "아랍의 봄(2010~2011)에 대한 설명으로 옳은 것은?", "choices": ["이란에서 시작되어 중동 전역으로 확산되었다", "튀니지에서 시작되어 이집트, 리비아, 시리아 등으로 확산되었다", "모든 국가에서 민주주의가 정착되었다", "2003년 이라크에서 시작되었다"], "answer": 2, "explanation": "튀니지의 시위가 벤 알리 정권을 무너뜨렸어요.", "prof": "정답은 2번이에요. 튀니지의 시위가 벤 알리 정권을 무너뜨렸어요. 시리아와 리비아에서는 내전으로 이어졌고 결과는 국가마다 달랐어요."}, {"id": "q250", "category": "중동·유럽·분쟁 지역", "difficulty": "상", "question": "시리아 내전에 대한 설명으로 옳은 것은?", "choices": ["2011년 안보리가 아사드 정권 제재를 만장일치로 채택하였다", "2003년에 발발하였다", "미국이 아사드 정권을 군사적으로 지원하였다", "2011년 시위가 무력 충돌로 확산되었고 러시아와 이란은 아사드 정권을 지원하였다"], "answer": 4, "explanation": "러시아와 중국은 안보리 제재 결의에 거부권을 행사한 바 있어요.", "prof": "정답은 4번이에요. 러시아와 중국은 안보리 제재 결의에 거부권을 행사한 바 있어요. 내전은 난민 문제를 심화시켰어요."}, {"id": "q251", "category": "중동·유럽·분쟁 지역", "difficulty": "상", "question": "수니파와 시아파의 갈등 구도에 대한 설명으로 옳은 것은?", "choices": ["사우디아라비아는 수니파 맹주를, 이란은 시아파 맹주를 자임하며 지역 패권을 놓고 경쟁해 왔다", "양국 갈등은 1900년 이전에 종결되었다", "이란은 수니파 중심이다", "사우디아라비아는 시아파 중심이다"], "answer": 1, "explanation": "1979년 이란 혁명 이후 경쟁이 심화되었어요.", "prof": "정답은 1번이에요. 1979년 이란 혁명 이후 경쟁이 심화되었어요. 2023년에는 중국의 중재로 양국이 외교관계를 복원하기로 합의했어요."}, {"id": "q252", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "걸프 협력회의(GCC)에 대한 설명으로 옳은 것은?", "choices": ["OPEC과 같은 조직이다", "이스라엘이 회원국이다", "걸프 지역 군주국들이 1981년 결성한 지역 협력체로 사우디아라비아와 UAE 등이 참여한다", "이란과 이라크가 중심이다"], "answer": 3, "explanation": "GCC는 이란 혁명과 이란-이라크 전쟁이라는 위협 속에 만들어졌어요.", "prof": "정답은 3번이에요. GCC는 이란 혁명과 이란-이라크 전쟁이라는 위협 속에 만들어졌어요."}, {"id": "q253", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "석유수출국기구(OPEC)에 대한 설명으로 옳은 것은?", "choices": ["미국이 주도하는 석유 소비국 협의체이다", "1945년 UN과 함께 결성되었다", "1960년 결성되었으며 산유국의 석유 정책 조정과 가격 안정을 목표로 한다", "OPEC은 IEA와 같은 조직이다"], "answer": 3, "explanation": "OPEC은 1973년 석유 금수와 가격 인상으로 세계 경제에 충격을 주었어요.", "prof": "정답은 3번이에요. OPEC은 1973년 석유 금수와 가격 인상으로 세계 경제에 충격을 주었어요. IEA는 소비국 중심의 기구예요."}, {"id": "q254", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "유럽안보협력기구(OSCE)에 대한 설명으로 옳은 것은?", "choices": ["1975년 헬싱키 최종의정서를 모태로 하며 안보, 인권, 경제협력을 포괄하는 지역 안보기구이다", "NATO의 하위 기구이다", "1949년에 창설되었다", "EU의 외교 기구이다"], "answer": 1, "explanation": "헬싱키 프로세스는 데탕트기에 유럽의 국경 불가침과 인권 존중을 연결한 사례예요.", "prof": "정답은 1번이에요. 헬싱키 프로세스는 데탕트기에 유럽의 국경 불가침과 인권 존중을 연결한 사례예요. 이후 CSCE가 1995년 OSCE로 개편되었어요."}, {"id": "q255", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "발칸 분쟁에 대한 설명으로 옳은 것은?", "choices": ["1990년대 발칸 분쟁은 소련 해체와 무관한 소규모 충돌이다", "1999년 NATO는 UN 안보리 결의를 받아 코소보를 공습하였다", "1995년 데이턴 협정은 코소보 문제를 해결하였다", "1990년대 유고슬라비아 해체 과정에서 보스니아와 코소보 분쟁이 발생하였다"], "answer": 4, "explanation": "데이턴 협정은 보스니아 내전을 종결시켰어요.", "prof": "정답은 4번이에요. 데이턴 협정은 보스니아 내전을 종결시켰어요. 1999년 코소보 공습은 안보리 승인 없이 이루어져 합법성 논란과 인도적 개입 논쟁을 낳았어요."}, {"id": "q256", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "북아일랜드 문제에 대한 설명으로 옳은 것은?", "choices": ["2016년 국민투표 이후 영국이 북아일랜드를 독립시켰다", "1998년 벨파스트(성금요일) 협정이 체결되어 분쟁이 완화되었다", "1998년 협정은 영국이 북아일랜드에서 철수한 것이다", "북아일랜드는 아일랜드 공화국의 일부이다"], "answer": 2, "explanation": "벨파스트 협정은 권력분점과 아일랜드와의 협력을 담았어요.", "prof": "정답은 2번이에요. 벨파스트 협정은 권력분점과 아일랜드와의 협력을 담았어요. 브렉시트 이후 국경 문제가 다시 쟁점이 되었어요."}, {"id": "q257", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "캅카스 지역 분쟁에 대한 설명으로 옳은 것은?", "choices": ["압하지야는 아르메니아 영토이다", "나고르노-카라바흐는 아제르바이잔 영토 안에서 아르메니아인이 다수인 지역이다", "나고르노-카라바흐는 조지아 영토이다", "캅카스 분쟁은 모두 2010년 이후 시작되었다"], "answer": 2, "explanation": "아제르바이잔은 2020년 전쟁과 2023년 작전을 통해 이 지역을 장악했어요.", "prof": "정답은 2번이에요. 아제르바이잔은 2020년 전쟁과 2023년 작전을 통해 이 지역을 장악했어요. 압하지야와 남오세티아는 조지아의 분쟁 지역이에요."}, {"id": "q258", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "2008년 러시아-조지아 전쟁에 대한 설명으로 옳은 것은?", "choices": ["2008년 조지아는 NATO에 가입하였다", "조지아가 러시아를 침공하였다", "NATO가 직접 참전하였다", "남오세티아를 둘러싸고 러시아가 군사 개입하였고 이후 러시아는 남오세티아와 압하지야를 독립국으로 승인하였다"], "answer": 4, "explanation": "러시아는 2008년 8월 조지아와 5일간 전쟁을 벌였어요.", "prof": "정답은 4번이에요. 러시아는 2008년 8월 조지아와 5일간 전쟁을 벌였어요. 국제사회 다수는 이들의 독립 승인을 인정하지 않았어요."}, {"id": "q259", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "인도와 파키스탄 분쟁에 대한 설명으로 옳은 것은?", "choices": ["인도와 파키스탄은 카슈미르 분쟁을 완전히 해결하였다", "1998년 이전에 두 나라가 모두 핵실험을 하였다", "1947년 분리 독립 이후 카슈미르 영유권을 둘러싸고 갈등해 왔고 양국은 1998년 핵실험을 실시하였다", "파키스탄은 핵을 보유하지 않았다"], "answer": 3, "explanation": "인도는 1974년과 1998년, 파키스탄은 1998년에 핵실험을 했어요.", "prof": "정답은 3번이에요. 인도는 1974년과 1998년, 파키스탄은 1998년에 핵실험을 했어요. 두 나라 모두 NPT 미가입국이에요."}, {"id": "q260", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "동남아시아 지역 분쟁에 대한 설명으로 옳은 것은?", "choices": ["남중국해에서 중국, 베트남, 필리핀 등이 도서와 해역의 영유권을 둘러싸고 갈등한다", "동남아시아는 영유권 분쟁이 없다", "남중국해는 한국과 일본만이 주장하는 해역이다", "ASEAN이 분쟁을 모두 법적으로 해결하였다"], "answer": 1, "explanation": "ASEAN은 중국과 행동규칙(COC) 협상을 이어가고 있으나 구속력 있는 합의는 아직 완성되지 않았어요.", "prof": "정답은 1번이에요. ASEAN은 중국과 행동규칙(COC) 협상을 이어가고 있으나 구속력 있는 합의는 아직 완성되지 않았어요."}, {"id": "q261", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "미얀마에 대한 설명으로 옳은 것은?", "choices": ["2021년 아웅산 수치가 대통령에 취임하였다", "2021년 2월 군부가 쿠데타로 정권을 장악하였다", "미얀마는 ASEAN 회원국이 아니다", "2011년 쿠데타가 발생하였다"], "answer": 2, "explanation": "쿠데타 이후 시민 불복종과 무장 저항이 이어졌고 ASEAN은 5개항 합의를 도출했으나 이행에는 어려움이 있어요.", "prof": "정답은 2번이에요. 쿠데타 이후 시민 불복종과 무장 저항이 이어졌고 ASEAN은 5개항 합의를 도출했으나 이행에는 어려움이 있어요."}, {"id": "q262", "category": "중동·유럽·분쟁 지역", "difficulty": "상", "question": "아프가니스탄 정세에 대한 설명으로 옳은 것은?", "choices": ["2001년에 탈레반이 재집권하였다", "2021년 이후에도 미군이 주둔하였다", "2021년 미군 철수 직후 탈레반이 카불을 장악하며 재집권하였다", "탈레반은 2021년에 미국과 동맹을 체결하였다"], "answer": 3, "explanation": "2020년 도하 협정을 거쳐 2021년 8월 철수가 마무리되었고 탈레반은 카불을 장악했어요.", "prof": "정답은 3번이에요. 2020년 도하 협정을 거쳐 2021년 8월 철수가 마무리되었고 탈레반은 카불을 장악했어요."}, {"id": "q263", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "아프리카 분쟁과 지역기구에 대한 설명으로 옳은 것은?", "choices": ["1994년 르완다에서 대규모 집단학살이 발생하였고 국제사회의 대응 실패가 비판받았다", "르완다 사건은 NATO가 방지하였다", "르완다 집단학살은 ICJ가 해결하였다", "르완다 집단학살은 2004년에 일어났다"], "answer": 1, "explanation": "르완다 사태 이후 보호책임 논의가 발전했고 ICTR이 설립되었어요.", "prof": "정답은 1번이에요. 르완다 사태 이후 보호책임 논의가 발전했고 ICTR이 설립되었어요."}, {"id": "q264", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "수단 및 남수단에 대한 설명으로 옳은 것은?", "choices": ["남수단은 2020년에 독립하였다", "수단은 남수단의 독립에 반대하여 UN에서 부결시켰다", "남수단은 2001년에 독립하였다", "남수단은 2011년 주민투표를 거쳐 수단에서 독립하였다"], "answer": 4, "explanation": "남수단은 가장 최근에 독립한 UN 회원국 중 하나로 독립 이후에도 내전을 겪었어요.", "prof": "정답은 4번이에요. 남수단은 가장 최근에 독립한 UN 회원국 중 하나로 독립 이후에도 내전을 겪었어요."}, {"id": "q265", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "유럽의 극우 및 포퓰리즘 정치와 국제관계에 대한 설명으로 옳은 것은?", "choices": ["2015년에 유럽은 난민 수용을 전면 금지하였다", "2015년 난민 위기는 아프리카에서만 발생하였다", "2015년 시리아 난민 유입은 유럽 각국의 이민 정책 갈등과 포퓰리즘 확산의 배경이 되었다", "난민 문제는 유럽의 정치에 영향을 주지 않았다"], "answer": 3, "explanation": "유럽 난민 위기는 쉥겐 체제와 더블린 규정에 관한 논쟁도 낳았어요.", "prof": "정답은 3번이에요. 유럽 난민 위기는 쉥겐 체제와 더블린 규정에 관한 논쟁도 낳았어요."}, {"id": "q266", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "중동 및 유럽의 지역 협력체으로 옳은 것만을 모두 고른 것은?\n\nㄱ. 아랍연맹은 1945년에 결성되었다\nㄴ. GCC는 걸프 지역 군주국 중심의 협력체이다\nㄷ. OSCE는 1975년 헬싱키 최종의정서의 전통을 잇는다\nㄹ. NATO는 중동 국가만의 군사동맹이다", "choices": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ"], "answer": 2, "explanation": "NATO는 북미와 유럽 국가들의 집단방위 동맹이에요.", "prof": "정답은 2번이에요. NATO는 북미와 유럽 국가들의 집단방위 동맹이에요. 그래서 ㄹ이 틀려요."}, {"id": "q267", "category": "중동·유럽·분쟁 지역", "difficulty": "상", "question": "중동 정세에 대한 설명으로 옳은 것은 모두 몇 개인가?\n\nㄱ. 1979년 이란에서 이슬람 혁명이 발생하였다\nㄴ. 1980년 이란-이라크 전쟁이 시작되었다\nㄷ. 1990년 이라크가 쿠웨이트를 침공하였다\nㄹ. 1967년 6일 전쟁에서 이스라엘은 아랍 국가들에게 패배하였다", "choices": ["1개", "2개", "3개", "4개"], "answer": 3, "explanation": "6일 전쟁은 이스라엘의 승리로 끝났어요.", "prof": "정답은 3번이에요. 6일 전쟁은 이스라엘의 승리로 끝났어요. 그래서 ㄹ이 틀리고 옳은 것은 3개예요."}, {"id": "q268", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "분쟁 지역에 대한 설명으로 옳지 않은 것만을 모두 고른 것은?\n\nㄱ. 구유고 분쟁은 1990년대에 발생하였다\nㄴ. 르완다 집단학살은 1994년에 일어났다\nㄷ. 시리아 내전은 2011년 이후 전개되었다\nㄹ. 1999년 코소보 개입은 안보리의 명시적 승인으로 이루어졌다", "choices": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄹ", "ㄹ"], "answer": 4, "explanation": "1999년 코소보 개입은 안보리 승인 없이 NATO가 단행했어요.", "prof": "정답은 4번이에요. 1999년 코소보 개입은 안보리 승인 없이 NATO가 단행했어요. 그래서 ㄹ이 틀려요."}, {"id": "q269", "category": "중동·유럽·분쟁 지역", "difficulty": "중", "question": "중동 정세에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 2020년 아브라함 협정에는 UAE와 바레인이 참여하였다\nㄴ. 1978년 캠프 데이비드 합의에는 이집트와 이스라엘이 참여하였다\nㄷ. JCPOA는 2018년에 체결되었다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ×", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ×  ㄷ ×"], "answer": 1, "explanation": "JCPOA는 2015년에 체결되었고 2018년은 미국이 탈퇴한 해예요.", "prof": "정답은 1번이에요. JCPOA는 2015년에 체결되었고 2018년은 미국이 탈퇴한 해예요."}, {"id": "q270", "category": "중동·유럽·분쟁 지역", "difficulty": "하", "question": "분쟁 지역에 대한 설명의 옳고 그름을 바르게 표시한 것은?\n\nㄱ. 1995년 데이턴 협정은 보스니아 내전을 종결하였다\nㄴ. 2021년 탈레반은 아프가니스탄에서 재집권하였다\nㄷ. 2011년 남수단은 수단에서 독립하였다", "choices": ["ㄱ ○  ㄴ ○  ㄷ ○", "ㄱ ○  ㄴ ×  ㄷ ×", "ㄱ ×  ㄴ ○  ㄷ ○", "ㄱ ×  ㄴ ○  ㄷ ×"], "answer": 1, "explanation": "세 서술은 모두 정확해요.", "prof": "정답은 1번이에요. 세 서술은 모두 정확해요."}, {"id": "q271", "category": "중동·유럽·분쟁 지역", "difficulty": "하", "question": "1948년 팔레스타인 지역에서 건국이 선포된 국가는?", "choices": ["이집트", "시리아", "요르단", "이스라엘"], "answer": 4, "explanation": "이스라엘은 1948년 5월 건국을 선포했고 곧바로 제1차 중동전쟁이 일어났어요.", "prof": "정답은 4번이에요. 이스라엘은 1948년 5월 건국을 선포했고 곧바로 제1차 중동전쟁이 일어났어요."}, {"id": "q272", "category": "초국가·신안보", "difficulty": "중", "question": "신안보(비전통 안보) 개념에 대한 설명으로 옳은 것은?", "choices": ["국가 간 전쟁의 가능성만을 안보의 대상으로 한정한다", "군사적 위협 중심의 전통 안보를 넘어 환경, 테러, 감염병, 사이버 등 비군사적 위협까지 안보의 범위를 확대한 개념이다", "안보의 대상을 국가로만 한정한다", "군사력 확보만을 안보의 유일한 수단으로 본다"], "answer": 2, "explanation": "신안보는 탈냉전기에 부상했어요.", "prof": "정답은 2번이에요. 신안보는 탈냉전기에 부상했어요. 안보의 대상을 개인과 인류로 넓히고 위협의 성격도 다양하게 본다는 점이 핵심이에요."}, {"id": "q273", "category": "초국가·신안보", "difficulty": "상", "question": "인간안보 개념에 대한 설명으로 옳은 것은?", "choices": ["인간안보는 국가안보를 대체하는 군사 개념이다", "1994년 UNDP는 군사안보만을 강조하였다", "1994년 UNDP 인간개발보고서가 '공포로부터의 자유'와 '결핍으로부터의 자유'를 제시하며 대중화되었다", "인간안보는 1945년에 제시되었다"], "answer": 3, "explanation": "인간안보는 국가가 아니라 개인을 안보의 준거 대상으로 삼아요.", "prof": "정답은 3번이에요. 인간안보는 국가가 아니라 개인을 안보의 준거 대상으로 삼아요. 캐나다와 일본 등이 이를 외교정책에 적극 반영했어요."}, {"id": "q274", "category": "초국가·신안보", "difficulty": "중", "question": "국제 기후 협상에 대한 설명으로 옳은 것은?", "choices": ["1997년 교토의정서는 선진국에 온실가스 감축 의무를 부과하였고 2015년 파리협정은 모든 당사국이 자발적 감축 목표를 제출하는 방식을 채택하였다", "교토의정서는 모든 국가에 동일한 감축 의무를 부과하였다", "파리협정은 2005년에 채택되었다", "파리협정은 감축 목표를 법적으로 강제하는 벌칙을 포함한다"], "answer": 1, "explanation": "파리협정은 국가결정기여(NDC)를 기반으로 해요.", "prof": "정답은 1번이에요. 파리협정은 국가결정기여(NDC)를 기반으로 해요. 교토의정서는 부속서 I 국가에 한정된 의무를 규정했어요."}, {"id": "q275", "category": "초국가·신안보", "difficulty": "중", "question": "파리협정에 대한 설명으로 옳은 것은?", "choices": ["협정은 2020년에 처음 채택되었다", "지구 평균 기온 상승을 산업화 이전 대비 2도보다 훨씬 낮게 유지하고 1.5도로 제한하려는 노력을 추구한다", "미국이 한 번도 탈퇴하지 않았다", "지구 평균 기온 상승을 5도 이내로 제한한다"], "answer": 2, "explanation": "파리협정은 2015년 12월 채택, 2016년 11월 발효했어요.", "prof": "정답은 2번이에요. 파리협정은 2015년 12월 채택, 2016년 11월 발효했어요. 미국은 트럼프 행정부 때 탈퇴를 통보했고 바이든 행정부 때 복귀했어요."}, {"id": "q276", "category": "초국가·신안보", "difficulty": "중", "question": "공유지의 비극과 국제환경 협력에 대한 설명으로 옳은 것은?", "choices": ["개인의 합리적 선택이 자원 보존으로 이어진다는 논리이다", "공유지의 비극은 1990년대 UN에서 처음 제시되었다", "국제환경 문제에는 집단행동 문제가 발생하지 않는다", "공유 자원을 각자 이익을 위해 과도하게 사용하면 모두에게 손해가 된다는 논리로 국제 환경 협력의 필요성을 설명한다"], "answer": 4, "explanation": "개릿 하딘이 1968년 논문에서 제시한 개념이에요.", "prof": "정답은 4번이에요. 개릿 하딘이 1968년 논문에서 제시한 개념이에요. 무임승차 문제와 연결되어 국제협력의 어려움을 설명할 때 자주 쓰여요."}, {"id": "q277", "category": "초국가·신안보", "difficulty": "중", "question": "오존층 보호와 관련된 국제 협력에 대한 설명으로 옳은 것은?", "choices": ["1987년 몬트리올 의정서는 염화불화탄소(CFC) 등 오존층 파괴 물질의 규제를 규정하여 성공 사례로 평가된다", "1987년 의정서는 구속력이 없다", "몬트리올 의정서는 1997년 교토에서 체결되었다", "몬트리올 의정서는 온실가스 감축을 위한 협약이다"], "answer": 1, "explanation": "몬트리올 의정서는 비엔나 협약(1985)의 틀 위에서 체결되었고 여러 차례 개정되며 규제가 강화됐어요.", "prof": "정답은 1번이에요. 몬트리올 의정서는 비엔나 협약(1985)의 틀 위에서 체결되었고 여러 차례 개정되며 규제가 강화됐어요."}, {"id": "q278", "category": "초국가·신안보", "difficulty": "중", "question": "국제 환경 레짐에 대한 설명으로 옳은 것은?", "choices": ["리우 회의에서 핵무기 폐기에 합의하였다", "1992년 리우 정상회의는 교토의정서를 채택하였다", "1992년 리우 정상회의는 기후변화협약과 생물다양성협약 서명을 위한 계기가 되었다", "리우 회의는 1972년에 열렸다"], "answer": 3, "explanation": "리우에서는 리우선언, 의제 21, 기후변화협약, 생물다양성협약 등이 채택되었어요.", "prof": "정답은 3번이에요. 리우에서는 리우선언, 의제 21, 기후변화협약, 생물다양성협약 등이 채택되었어요. 1972년에 스톡홀름 회의가 열렸어요."}, {"id": "q279", "category": "초국가·신안보", "difficulty": "중", "question": "국제 테러리즘에 대한 설명으로 옳은 것은?", "choices": ["테러는 국가 간 전쟁에 한정된다", "2001년 9·11 테러 이후 대테러전이 국제정치의 중심 의제로 부상하였고 UN 안보리 결의 1373호는 테러 자금 차단 등을 요구하였다", "9·11 테러는 UN 사무국에서 발생하였다", "1373호는 2003년에 채택되었다"], "answer": 2, "explanation": "안보리 결의 1373호(2001)는 모든 회원국에 테러리스트 자금 동결과 지원 금지를 의무화했어요.", "prof": "정답은 2번이에요. 안보리 결의 1373호(2001)는 모든 회원국에 테러리스트 자금 동결과 지원 금지를 의무화했어요."}, {"id": "q280", "category": "초국가·신안보", "difficulty": "중", "question": "이슬람국가(IS)에 대한 설명으로 옳은 것은?", "choices": ["2020년 이라크에서 건국을 선포하였다", "2001년 아프가니스탄에서 창설되었다", "알카에다와 완전히 같은 조직이다", "2014년 이라크와 시리아의 일부 지역을 장악하고 칼리프국을 선포하였다"], "answer": 4, "explanation": "IS는 2014년 6월 칼리프국을 선포했고 이후 국제연합군의 공세로 영토를 상실했어요.", "prof": "정답은 4번이에요. IS는 2014년 6월 칼리프국을 선포했고 이후 국제연합군의 공세로 영토를 상실했어요."}, {"id": "q281", "category": "초국가·신안보", "difficulty": "상", "question": "사이버 안보에 대한 설명으로 옳은 것은?", "choices": ["2007년 에스토니아 공격은 NATO 공식 전쟁으로 선포되었다", "2007년 에스토니아에 대한 대규모 사이버 공격은 국가 단위의 사이버 위협을 부각시킨 사건이었다", "2007년 에스토니아 사건 이후 NATO는 사이버 방어를 제외하였다", "사이버 공격에는 국제법이 적용될 수 없다"], "answer": 2, "explanation": "에스토니아 사건 이후 NATO는 탈린에 사이버방위센터를 설립했어요.", "prof": "정답은 2번이에요. 에스토니아 사건 이후 NATO는 탈린에 사이버방위센터를 설립했어요. 탈린 매뉴얼은 사이버 작전에 대한 국제법 적용을 논의했어요."}, {"id": "q282", "category": "초국가·신안보", "difficulty": "상", "question": "스턱스넷(Stuxnet) 사건에 대한 설명으로 옳은 것은?", "choices": ["한국의 은행망을 겨냥한 공격이다", "미국 대선을 겨냥한 공격이다", "이란 핵 시설의 원심분리기를 대상으로 한 악성코드로 사이버 무기의 전략적 사용을 보여준 사례로 거론된다", "북한 핵 시설을 겨냥한 공격이다"], "answer": 3, "explanation": "스턱스넷은 2010년경 발견되었고 이란 핵 프로그램을 지연시킨 사례로 알려져 있어요.", "prof": "정답은 3번이에요. 스턱스넷은 2010년경 발견되었고 이란 핵 프로그램을 지연시킨 사례로 알려져 있어요. 배후는 공식 확인되지 않았지만 미국과 이스라엘이 거론돼요."}, {"id": "q283", "category": "초국가·신안보", "difficulty": "중", "question": "인도적 개입에 대한 설명으로 옳은 것은?", "choices": ["1990년대 소말리아, 보스니아, 코소보 등에서 인도적 개입의 정당성이 논쟁이 되었다", "인도적 개입은 국가 주권을 절대적으로 존중하는 원칙이다", "인도적 개입은 UN 헌장에 명시된 일반 원칙이다", "코소보 공습은 모든 국가의 지지를 받았다"], "answer": 1, "explanation": "인도적 개입은 주권 존중 원칙과 충돌해요.", "prof": "정답은 1번이에요. 인도적 개입은 주권 존중 원칙과 충돌해요. 이 논쟁 속에서 ICISS 보고서(2001)와 R2P 개념이 등장했어요."}, {"id": "q284", "category": "초국가·신안보", "difficulty": "중", "question": "국제 난민 보호에 대한 설명으로 옳은 것은?", "choices": ["난민 협약은 경제적 이유로 이주한 사람도 난민으로 규정한다", "강제송환금지 원칙은 국가가 자유롭게 예외를 둘 수 있다", "난민 협약은 1920년에 채택되었다", "1951년 난민지위협약과 1967년 의정서는 박해를 피해 국경을 넘은 사람을 보호하며 강제송환금지 원칙을 포함한다"], "answer": 4, "explanation": "난민은 인종, 종교, 국적, 특정 사회집단 구성원 신분, 정치적 의견을 이유로 한 박해의 공포를 가진 사람이에요.", "prof": "정답은 4번이에요. 난민은 인종, 종교, 국적, 특정 사회집단 구성원 신분, 정치적 의견을 이유로 한 박해의 공포를 가진 사람이에요. 국내 실향민은 국경을 넘지 않아 협약상 난민이 아니에요."}, {"id": "q285", "category": "초국가·신안보", "difficulty": "중", "question": "국제 이주와 거버넌스에 대한 설명으로 옳은 것은?", "choices": ["글로벌 컴팩트에는 모든 UN 회원국이 찬성하였다", "2018년 UN은 '안전하고 질서 있는 정규 이주를 위한 글로벌 컴팩트'를 채택하였고 이는 법적 구속력이 없다", "글로벌 컴팩트는 모든 국가에 이주민 수용을 의무화한다", "2018년 컴팩트는 조약으로 발효하였다"], "answer": 2, "explanation": "미국, 헝가리 등 일부 국가는 컴팩트에 반대하거나 불참했어요.", "prof": "정답은 2번이에요. 미국, 헝가리 등 일부 국가는 컴팩트에 반대하거나 불참했어요. 비구속적 문서라는 점이 중요해요."}, {"id": "q286", "category": "초국가·신안보", "difficulty": "중", "question": "국제 감염병 대응에 대한 설명으로 옳은 것은?", "choices": ["2005년 국제보건규칙(IHR)은 WHO가 국제적 공중보건 비상사태(PHEIC)를 선포할 수 있도록 규정한다", "WHO는 회원국의 보건 정책을 직접 결정한다", "IHR은 1948년에 채택되었다", "WHO는 PHEIC를 선포할 수 없다"], "answer": 1, "explanation": "WHO는 UN 전문기구예요.", "prof": "정답은 1번이에요. WHO는 UN 전문기구예요. 코로나19에 대해 2020년 1월 PHEIC를 선포했어요."}, {"id": "q287", "category": "초국가·신안보", "difficulty": "중", "question": "코로나19가 국제정치에 미친 영향에 대한 설명으로 옳은 것은?", "choices": ["코로나19는 WHO 설립의 계기였다", "코로나19는 국제 협력의 필요성을 낮추었다", "공급망 재편 논의와 백신 접근의 불평등 문제가 부각되었다", "코로나19 이후 모든 국가가 국경을 전면 개방하였다"], "answer": 3, "explanation": "코로나19는 글로벌 보건 거버넌스의 한계와 백신 민족주의 논란을 낳았어요.", "prof": "정답은 3번이에요. 코로나19는 글로벌 보건 거버넌스의 한계와 백신 민족주의 논란을 낳았어요. COVAX 같은 공동구매 장치가 마련됐어요."}, {"id": "q288", "category": "초국가·신안보", "difficulty": "중", "question": "에너지 안보에 대한 설명으로 옳은 것은?", "choices": ["에너지 안보는 석유만을 대상으로 한다", "에너지 안보는 군사 안보와 무관하다", "1973년 석유 위기는 에너지 안보 논의와 무관하였다", "에너지 공급의 안정적 확보와 가격 안정, 에너지 수입 의존도를 둘러싼 지정학적 문제를 포함한다"], "answer": 4, "explanation": "1973년 석유 위기는 에너지 안보를 국제정치의 핵심 문제로 만들었어요.", "prof": "정답은 4번이에요. 1973년 석유 위기는 에너지 안보를 국제정치의 핵심 문제로 만들었어요. 유럽은 러시아 가스 의존도 문제를 겪었어요."}, {"id": "q289", "category": "초국가·신안보", "difficulty": "중", "question": "식량 안보에 대한 설명으로 옳은 것은?", "choices": ["식량 접근성과 공급의 안정성을 모두 포함하는 개념으로 국제 곡물 가격과 분쟁은 식량 안보에 영향을 준다", "FAO는 식량 안보를 담당하지 않는다", "식량 안보는 농업 분야만의 문제이다", "식량 안보는 생산량이 충분하면 항상 보장된다"], "answer": 1, "explanation": "FAO는 식량농업기구로서 식량 안보 문제를 다루는 UN 전문기구예요.", "prof": "정답은 1번이에요. FAO는 식량농업기구로서 식량 안보 문제를 다루는 UN 전문기구예요. 2022년 러시아-우크라이나 전쟁은 곡물 시장에도 영향을 주었어요."}, {"id": "q290", "category": "초국가·신안보", "difficulty": "상", "question": "국제 레짐에 대한 설명으로 옳은 것은?", "choices": ["국제 레짐은 현실주의에서만 사용하는 개념이다", "국제 레짐은 항상 공식 조직을 의미한다", "국제 레짐은 강제력이 있는 세계정부를 뜻한다", "크래스너는 국제 레짐을 국제관계의 특정 영역에서 행위자들의 기대가 수렴하는 원칙, 규범, 규칙, 의사결정절차로 정의하였다"], "answer": 4, "explanation": "레짐은 공식 기구와 구별되는 개념이에요.", "prof": "정답은 4번이에요. 레짐은 공식 기구와 구별되는 개념이에요. 자유주의 제도주의 이론에서 협력을 설명하는 핵심 개념이에요."}, {"id": "q291", "category": "초국가·신안보", "difficulty": "중", "question": "국제 비정부기구(NGO)에 대한 설명으로 옳은 것은?", "choices": ["NGO는 국제법의 주체로서 모든 조약을 체결할 수 있다", "NGO는 국제정치에 영향을 미치지 못한다", "NGO는 국제 규범 형성과 감시에 참여하며 대인지뢰금지협약 과정에서 활동하였다", "NGO는 국가와 동일한 투표권을 가진다"], "answer": 3, "explanation": "지뢰금지국제운동(ICBL)은 1997년 노벨 평화상을 받았어요.", "prof": "정답은 3번이에요. 지뢰금지국제운동(ICBL)은 1997년 노벨 평화상을 받았어요. 이를 초국가 행위자의 영향력 사례로 들어요."}, {"id": "q292", "category": "초국가·신안보", "difficulty": "중", "question": "다국적기업과 국제정치에 대한 설명으로 옳은 것은?", "choices": ["다국적기업은 UN 회원국이다", "다국적기업은 국가 외의 행위자로서 투자와 기술 이전을 통해 국제정치경제에 영향을 미친다", "다국적기업은 국가 주권을 대체하는 국제법의 주체이다", "다국적기업은 정부 정책에 영향을 미칠 수 없다"], "answer": 2, "explanation": "다국적기업은 초국가 행위자예요.", "prof": "정답은 2번이에요. 다국적기업은 초국가 행위자예요. 투자 유치와 규제를 둘러싼 국가-기업 관계가 중요한 연구 주제예요."}, {"id": "q293"
